# Route builder defaults (docs/design/world-layout.md Phase E).
# Read by crates/layout at compile time.

# Distance between consecutive anchorages is spacing +/- spacing_spread.
spacing = 150.0
spacing_spread = 30.0

# The heading changes by at most this many degrees per step, so the route
# bends but never doubles back.
max_turn_degrees = 30.0

# Channel along each route segment (DensityTerm::Channel).
channel_half_width = 6.0
channel_falloff = 6.0
channel_depth_below_sea = 4.0
channel_clear_above = 4

# The corridor is every region within this many regions (Chebyshev) of a
# region the route passes through (design: world-layout Decision 5).
corridor_margin = 2

# Climate bias along the route (ClimateBias::AlongPath; decided in #846).
# Temperature offset at the first and last anchorage, interpolated by arc
# length: the trip moves from cold water to warm. Same for every seed.
temp_start = -0.55
temp_end = 0.55
d_humid_start = 0.0
d_humid_end = 0.0
# Full effect within climate_half_width blocks of the route, fading to none
# over a further climate_falloff blocks.
climate_half_width = 64.0
climate_falloff = 64.0

# Cold and warm water (decided in #844): thresholds on the biased
# temperature T at a column. Cold is T < cold_below; warm is
# T > warm_above (62/63).
cold_below = 0.5
warm_above = 0.9841269841269841

# Mainland coast beside the channel (docs/design/villages-and-villagers.md
# Phase B). Not read by the layout yet. Land starts rising coast_near blocks
# from the channel centre line (never inside channel_half_width +
# channel_falloff), climbs over coast_ramp blocks (short = cliff, long =
# gentle) to coast_height blocks above sea level, continues for coast_width
# blocks and fades out over coast_fade. Each varies between its min and max
# over coast_wobble_length blocks of route arc length. The far edge
# coast_near_max + coast_ramp_max + coast_width + coast_fade must stay below
# 256, the distance from a route region to the corridor border.
coast_near_min = 30.0
coast_near_max = 40.0
coast_ramp_min = 8.0
coast_ramp_max = 24.0
coast_height_min = 6.0
coast_height_max = 14.0
coast_width = 60.0
coast_fade = 40.0
coast_wobble_length = 200.0
