# Raft tunables. See docs/design/basic-gameplay.md section 4.7.
#
# This game's own values; no claim of Beta parity.

[swell_push]
# Horizontal push added to a rider's velocity each tick, per degree of deck
# tilt, in blocks per tick. Sneaking cancels it.
per_degree = 0.004
# Loose item entities on the deck get the push times this.
item_multiplier = 2.0
