# Raft tunables. See docs/design/basic-gameplay.md section 4.7.
#
# This game's own values; no claim of Beta parity.

# The scripted swell that drives the raft each tick (section 4.7): the raft
# sways back and forth along `direction_degrees` and its deck tilts. The
# swell does not push the rider, items or animals (#640, #634, #635).
[swell]
# Peak sway from the rest pose, in blocks.
sway_amplitude = 0.4
# Peak deck tilt, in degrees.
tilt_amplitude = 3.0
# Ticks for one full swell cycle (20 ticks per second).
period_ticks = 160
# Direction the swell runs, in the xz plane: 0 is +x, 90 is +z.
direction_degrees = 30.0

# Travel between levels along the pathfound route (world-layout.md Phase E).
# The raft moves at this constant speed and does not turn.
[travel]
# Blocks per tick (20 ticks per second).
speed = 0.15

# Player driving from the helm (raft-scene-feedback.md Phase D).
[drive]
# Blocks per tick with forward held fully.
speed = 0.12
# Radians per tick with the turn axis held fully (about 1.7 degrees).
turn_rate = 0.03
