# Length of the hand animations (docs/design/held-and-world-items.md section 1).
# These are this game's own values, tuned by feel; they do not come from SPEC.md.
# Each is a whole number of 20 Hz sim ticks from the action to the hand being
# at rest again; the phase peaks halfway.

# Primary swing.
swing_ticks = 6
# Secondary use: shorter, and the client draws it smaller.
use_ticks = 4

# Pose at phase 1 (the middle of the animation), as a change from the resting
# pose in data/held.toml: offset right, up, ahead (metres) and a pitch about the
# sprite's centre (degrees, positive tips the top away). Between 0 and 1 the
# pose is linear in the phase. client/helditem.js mirrors these.
swing_offset_x = -0.2
swing_offset_y = 0.1
swing_offset_z = -0.1
swing_pitch = 50.0
use_offset_x = -0.05
use_offset_y = 0.05
use_offset_z = -0.1
use_pitch = 15.0
