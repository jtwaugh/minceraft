# Flora (docs/design/biome-flora.md Phase D.1). build.rs checks every name
# and generates `FLORA` in crates/terrain/src/flora.rs; the placement pass reads it.
#   block         block name; tall_cross takes [lower, upper]
#   shape         cross | tall_cross | ground_cover | pad | bush
#   tint          none | grass | leaf | dry
#   cluster_scale blocks per noise cell; salt unique per entry
#   requires      optional column condition: near_water (water beside the ground
#                 block, within near_water_radius columns)
#   pad           ground is the water the pad floats on; land must lie within
#                 pad_land_radius columns
#   biomes        biome name -> chance per eligible column (0 to 1)

[settings]
patch_noise_salt = 7001
colour_noise_salt = 7002
near_water_radius = 1   # columns searched by requires = "near_water"
pad_land_radius = 4     # columns searched for land by a `pad` entry
colour_scale = 20.0     # blocks per cell of the noise that picks the winner

[[flora]]
name = "daisy"
block = "daisy"
shape = "cross"
ground = ["grass"]
tint = "none"
cluster_scale = 24.0
salt = 1
biomes = { Plains = 0.020, Forest = 0.004 }

