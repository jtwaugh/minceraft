# Flora (docs/design/biome-flora.md Phase D.1). build.rs checks every name
# and generates `FLORA` in crates/terrain/src/flora.rs; the placement pass reads it.
#   block         block name; tall_cross takes [lower, upper]
#   shape         cross | tall_cross | ground_cover | pad | bush
#   tint          none | grass | leaf | dry
#   cluster_scale blocks per noise cell; salt unique per entry
#   requires      optional column condition: near_water (water beside the ground
#                 block, within near_water_radius columns) | canopy (stands on the
#                 highest grass with air above and leaves higher in the column) |
#                 coast (sand at y coast_min_y to coast_max_y with water at its y or
#                 one below, within coast_radius columns, square not circle)
#   snow_stays    optional bool: a cross plant the snow pass leaves standing (no snow in its cell)
#   pad           ground is the water the pad floats on; land must lie within
#                 pad_land_radius columns
#   biomes        biome name -> chance per eligible column (0 to 1)
#   niche         optional layer name -> [lo, hi], lo <= hi; layers: height_above_sea |
#                 soil_depth | light | slope | sun_facing | hollow. The response is 1
#                 inside and falls to 0 over niche_margin_<layer> outside. Not used yet.

[settings]
patch_noise_salt = 7001
colour_noise_salt = 7002
near_water_radius = 1   # columns searched by requires = "near_water"
coast_radius = 3        # columns searched by requires = "coast" (Chebyshev)
coast_min_y = 62        # lowest sand y for requires = "coast"
coast_max_y = 66        # highest sand y for requires = "coast"
pad_land_radius = 4     # columns searched for land by a `pad` entry
colour_scale = 20.0     # blocks per cell of the noise that picks the winner
# Soft margins of the niche response, in each layer's own units.
niche_margin_height_above_sea = 2.0
niche_margin_soil_depth = 1.0
niche_margin_light = 0.1
niche_margin_slope = 0.25
niche_margin_sun_facing = 0.2
niche_margin_hollow = 1.0

