# Flora (docs/design/biome-flora.md Phase D.1). build.rs checks every name
# and generates `FLORA` in crates/terrain/src/flora.rs; the placement pass reads it.
#   block         block name; tall_cross takes [lower, upper]
#   shape         cross | tall_cross | ground_cover | pad | bush
#   tint          none | grass | leaf | dry
#   cluster_scale blocks per noise cell; salt unique per entry
#   requires      optional column condition: near_water (water beside the ground
#                 block, within near_water_radius columns) | canopy (stands on the
#                 highest grass with air above and leaves higher in the column) |
#                 coast (sand at y coast_min_y to coast_max_y with water at its y or
#                 one below, within coast_radius columns, square not circle)
#   snow_stays    optional bool: a cross plant the snow pass leaves standing (no snow in its cell)
#   pad           ground is the water the pad floats on; land must lie within
#                 pad_land_radius columns
#   biomes        biome name -> chance per eligible column (0 to 1)
#   niche         optional layer name -> [lo, hi], lo <= hi; layers: height_above_sea |
#                 soil_depth | light | slope | sun_facing | hollow | edge | exposure. The response is 1
#                 inside and falls to 0 over niche_margin_<layer> outside; the product
#                 multiplies the biome chance. height_above_sea is ground y minus sea
#                 level; soil_depth counts dirt and grass from the ground block down;
#                 light is the fraction of columns within light_radius (the column
#                 itself included) with no leaf block above the ground block;
#                 slope is the steepness (rise per block, central differences of the
#                 surface height of the four neighbours); sun_facing is 1 where the
#                 downhill direction points at the sun, 0 where it points away,
#                 sun_facing_flat on flat ground;
#                 hollow is the column's surface height minus the mean surface height
#                 of 8 columns (the 4 axis and 4 diagonal directions) on each ring of
#                 hollow_radii, all rings weighted equally: negative in a hollow,
#                 positive on a ridge. Surface height is the top movement-blocking or
#                 liquid block, ignoring leaves, logs and plants (undecorated terrain);
#                 edge is the straight-line distance in columns to the nearest column
#                 within edge_radius (circle) with a leaf block above the ground block:
#                 0 where the column itself has one (not open), edge_radius where none
#                 is within reach;
#                 exposure is the share of exposure_cap columns of open water upwind:
#                 step one column at a time (rounded) from the column towards
#                 (wind_x, wind_z), counting water columns until the first land column
#                 or exposure_cap steps; count / exposure_cap, 0 to 1. A column is water
#                 where its surface height block is a liquid (undecorated terrain), so
#                 0 inland and in a cove sheltered from the wind, near 1 on a shore
#                 facing open water.

[settings]
patch_noise_salt = 7001
colour_noise_salt = 7002
near_water_radius = 1   # columns searched by requires = "near_water"
coast_radius = 3        # columns searched by requires = "coast" (Chebyshev)
coast_min_y = 62        # lowest sand y for requires = "coast"
coast_max_y = 66        # highest sand y for requires = "coast"
pad_land_radius = 4     # columns searched for land by a `pad` entry
colour_scale = 20.0     # blocks per cell of the noise that picks the winner
sun_x = 0.0             # horizontal direction towards the noon sun (x, z);
sun_z = 1.0             # normalised by build.rs
sun_facing_flat = 0.5   # sun_facing of a column with no slope
wind_x = 1.0            # horizontal direction the prevailing wind comes from (x, z);
wind_z = 0.0            # normalised by build.rs
# Length, in columns, of the `exposure` ray and the count that scores 1. Must stay
# inside the decoration margin (a test checks it).
exposure_cap = 48
# Columns, within this distance (circle) of the column itself, that make up the
# cone of the `light` layer. Shared with the client shade tint (#1610).
light_radius = 2
# Ring radii, in blocks, of the `hollow` layer. The largest must stay inside the
# decoration margin (a test checks it).
hollow_radii = [4, 8, 16]
# Search radius, and cap, of the `edge` layer. Must stay within READ_REACH and,
# with a tree's reach, inside the decoration margin (a test checks it).
edge_radius = 8
# Soft margins of the niche response, in each layer's own units.
niche_margin_height_above_sea = 2.0
niche_margin_soil_depth = 1.0
niche_margin_light = 0.1
niche_margin_slope = 0.25
niche_margin_sun_facing = 0.2
niche_margin_hollow = 1.0
niche_margin_edge = 1.0
niche_margin_exposure = 0.2

