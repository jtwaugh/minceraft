  # y = 1 (connectors)
  ["...", "...", "...", "..."],
]
connectors = [
  { cell = [1, 1, 0], facing = "-z", pool = "boardwalks" },
  { cell = [1, 1, 3], facing = "+z", pool = "boardwalks" },
]
