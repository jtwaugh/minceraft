# A street run with plank steps where the ground drops (docs/design/villages-and-villagers.md 2.1, 2.2).
kind = "boardwalk"
size = [3, 2, 4]      # x, y, z
origin_offset = [-1, 0, -1]
palette = { P = "dock_planks", S = "plank_step", "." = "air" }
layers = [
  # y = 0 (floor, steps on the far half)
