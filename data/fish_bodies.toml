# Fish bodies (docs/design/fish-and-fishing.md section 2), read by
# crates/game/src/fish_bodies.rs. Exactly one per species in data/fish.toml;
# squid has none. Numbers are this game's own. Schema:
# [[body]]
# species    = "name"        # an id from data/fish.toml, unique here
# box        = [0.4, 0.3]    # width (x and z) and height (y), blocks, > 0
# swim_speed = 1.5           # blocks per second, > 0
# turn_rate  = 180           # degrees per second, > 0
# school     = [3, 6]        # school size, inclusive, 1 <= min <= max
# raw_item   = "raw_x"       # item (data/items.toml) a caught fish becomes
# health     = 4             # half-hearts a fish takes to kill, >= 1; the
#                            # wooden sword (data/items.toml) kills in one hit

[[body]]
species = "mackerel"
box = [0.4, 0.3]
swim_speed = 1.5
turn_rate = 180
school = [3, 6]
raw_item = "raw_mackerel"
health = 4

[[body]]
species = "salmon"
box = [0.5, 0.4]
swim_speed = 2.0
turn_rate = 120
school = [2, 4]
raw_item = "raw_salmon"
health = 4

[[body]]
species = "tuna"
box = [0.9, 0.6]
swim_speed = 2.5
turn_rate = 90
school = [1, 2]
raw_item = "raw_tuna"
health = 4
