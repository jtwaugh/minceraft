# Fish bodies, game side (docs/design/fish-and-fishing.md section 2,
# reconciliation note 6). Read by crates/game/src/fish_bodies.rs.
#
# One table per species in data/fish.toml, no more and no fewer. Squid is
# not a fish here and has no entry. Numbers are this game's own.
# Schema:
#
# [[body]]
# species    = "name"        # an id from data/fish.toml, unique here
# box        = [0.4, 0.3]    # width (x and z) and height (y), blocks, > 0
# swim_speed = 1.5           # blocks per second, > 0
# turn_rate  = 180           # degrees per second, > 0
# school     = [3, 6]        # school size, inclusive, 1 <= min <= max
# raw_item   = "raw_x"       # item (data/items.toml) a caught fish becomes

# Small and quick to turn; comes in big schools.
[[body]]
species = "mackerel"
box = [0.4, 0.3]
swim_speed = 1.5
turn_rate = 180
school = [3, 6]
raw_item = "raw_mackerel"

[[body]]
species = "salmon"
box = [0.5, 0.4]
swim_speed = 2.0
turn_rate = 120
school = [2, 4]
raw_item = "raw_salmon"

# Large, fast and wide-turning; alone or in pairs.
[[body]]
species = "tuna"
box = [0.9, 0.6]
swim_speed = 2.5
turn_rate = 90
school = [1, 2]
raw_item = "raw_tuna"
