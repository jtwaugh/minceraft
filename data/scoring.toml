# Seed scoring weights and caps (docs/design/world-layout.md 6.3).
# Read by crates/layout at compile time (defaults) or at run time.
# Every term is normalized to 0..1 linearly against its cap, then weighted.

# Term weights.
weight_spacing_regularity = 1.0
weight_path_directness = 1.0
weight_island_quality = 1.0
weight_coastline_interest = 0.5
weight_extra_islands = 0.5
weight_climate_gradient = 1.0
weight_biome_variety = 1.0

# Island quality: area and flat tiles reach 1.0 at this multiple of the
# validation minimums (min_island_columns, min_flat_grass_tiles).
cap_area_factor = 2.0
cap_flat_factor = 2.0

# Coastline interest reaches 1.0 at this ratio of island perimeter to
# sqrt(area).
cap_ratio = 6.0

# Extra islands: this many visible non-anchorage islands reach 1.0, and the
# viewpoint on the route is this many blocks above sea level.
cap_extra_islands = 3.0
eye_height = 2.0

# Climate gradient: a rise in temperature from the first to the last
# anchorage of this much reaches 1.0.
cap_temp_change = 0.5

# Biome variety: this many distinct biomes across anchorage islands reach 1.0.
cap_biomes = 4.0
