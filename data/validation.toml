# Level validation thresholds (docs/design/world-layout.md 6.1).
# Read by crates/layout at compile time (defaults) or at run time.

# Island land area above sea level, flood-filled from the island centre,
# must cover at least this many columns.
min_island_columns = 150

# Blocks added on every side of the box that contains the island centre and
# the spawn water zone. The flood fill never leaves this window.
window_margin = 48

# Water under every raft footprint column, counted down from SEA_LEVEL - 1,
# must be at least this deep.
min_raft_water_depth = 3

# The footprint must hold no solid block from SEA_LEVEL up to
# SEA_LEVEL + raft_clearance.
raft_clearance = 4

# Island columns with a grass top and all 4 neighbours within 1 block of
# height, counted on undecorated terrain (design Decision 4).
min_flat_grass_tiles = 6

# Decorated terrain (design 6.1, Phase G). Flat grass tiles with no tree,
# plant or cactus above them, at least this many.
min_clear_flat_tiles = 6

# Trees on the island: 1 if at least one log stands on an island column.
min_trees = 1

# Navigability (docs/design/world-layout.md 6.2, decorated terrain): water
# depth from SEA_LEVEL - 1 must be at least this.
min_navigable_depth = 2

# Cells from SEA_LEVEL to SEA_LEVEL + navigable_clearance - 1 must be air.
navigable_clearance = 4

# Raft half-width in columns (design 6.2): before pathfinding, navigable
# columns within this Chebyshev distance of a blocked column are removed.
raft_half_width = 2

# Retry loop: seeds tried (start, start + 1, ...) before giving up.
max_attempts = 64
