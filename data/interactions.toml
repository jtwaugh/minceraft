# Interaction rules: what held item + button + target does what.
# The first matching rule wins, so specific rules go above general ones.
# See docs/design/basic-gameplay.md section 7.

[[rule]]
held = "tool:sword"
button = "primary"
target = "entity:animal"
action = "attack"

[[rule]]
held = "tool:hoe"
button = "secondary"
target = "block:grass"
require_air_above = true
action = "till"

[[rule]]
held = "tool:hoe"
button = "secondary"
target = "block:dirt"
require_air_above = true
action = "till"

[[rule]]
held = "tool:hoe"
button = "secondary"
target = "block:planter_dirt"
action = "till"

[[rule]]
held = "item:seeds"
button = "secondary"
target = "block:farmland"
target_face = "top"
require_air_above = true
action = "plant"

[[rule]]
held = "empty"
button = "secondary"
target = "block:crop"
action = "pick"

[[rule]]
held = "any_tool"
button = "secondary"
target = "block:crop"
action = "pick"

[[rule]]
held = "empty"
button = "secondary"
target = "block:flower"
action = "pick"

[[rule]]
held = "any_tool"
button = "secondary"
target = "block:flower"
action = "pick"

[[rule]]
held = "empty"
button = "secondary"
target = "block:tall_grass"
action = "forage"

[[rule]]
held = "any"
button = "primary"
target = "entity:animal"
action = "attack" # fallback: punch

[[rule]]
held = "any_item"
button = "interact"
target = "block:station"
target_face = "top"
action = "put_down"

[[rule]]
held = "empty"
button = "interact"
target = "block:station"
action = "take"

# Fishing (docs/design/fish-and-fishing.md 4.2, 4.4): one press, wherever the
# crosshair is; the walker sets line_out while a bobber exists.
[[rule]]
held = "tool:fishing_rod"
button = "secondary"
target = "any"
require_line_out = false
action = "cast"

[[rule]]
held = "tool:fishing_rod"
button = "secondary"
target = "any"
require_line_out = true
action = "reel"

# Fish are hit like animals (docs/design/fish-and-fishing.md 4.5): the sword,
# or a punch with the hands empty.
[[rule]]
held = "tool:sword"
button = "primary"
target = "entity:fish"
action = "attack"

[[rule]]
held = "any"
button = "primary"
target = "entity:fish"
action = "attack" # fallback: punch
