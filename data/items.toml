# Tools and carryable items. See docs/design/basic-gameplay.md section 6.
#
# Names must match the `held` strings in interactions.toml: `tool:<name>` for
# a tool, `item:<name>` for a carryable item. Names are unique within each
# list.

# Loose items in the world. These numbers are this game's own, tuned to feel
# right (decided in #214). Throw speed is added with throwing.
[item_entity]
# Edge length of the item's cubic box, in blocks.
box_size = 0.25
# Downward acceleration, blocks per second squared.
gravity = 30.0
# Fraction of velocity kept each tick, on every axis.
drag = 0.98
# Extra fraction of horizontal velocity kept each tick while resting, so a
# landed item slides to a stop.
ground_friction = 0.6

[[tool]]
name = "sword"
label = "Wooden sword"

[[tool]]
name = "hoe"
label = "Wooden hoe"

[[item]]
name = "seeds"
label = "Seeds"
