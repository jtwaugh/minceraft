# Tools and carryable items. See docs/design/basic-gameplay.md section 6.
#
# Names must match the `held` strings in interactions.toml: `tool:<name>` for
# a tool, `item:<name>` for a carryable item. Names are unique within each
# list.

# Attack damage in half-hearts (section 8.1). `hand_damage` applies when the
# hand or a tool with no `damage` is used. Stone and iron swords come later.
hand_damage = 1

# Loose items in the world. These numbers are this game's own, tuned to feel
# right (decided in #214).
[item_entity]
# Edge length of the item's cubic box, in blocks.
box_size = 0.25
# Downward acceleration, blocks per second squared.
gravity = 30.0
# Fraction of velocity kept each tick, on every axis.
drag = 0.98
# Extra fraction of horizontal velocity kept each tick while resting, so a
# landed item slides to a stop.
ground_friction = 0.6
# Speed a dropped item leaves the eye at, along the look direction, blocks per
# second.
throw_speed = 8.0

[[tool]]
name = "sword"
label = "Wooden sword"
damage = 4

[[tool]]
name = "hoe"
label = "Wooden hoe"

[[tool]]
name = "fishing_rod"
label = "Fishing rod"

[[item]]
name = "seeds"
label = "Seeds"

# Animal drops (section 8.3). Which animal drops what is in animals.toml.
[[item]]
name = "raw_beef"
label = "Raw beef"

[[item]]
name = "leather"
label = "Leather"

[[item]]
name = "raw_pork"
label = "Raw pork"

[[item]]
name = "raw_chicken"
label = "Raw chicken"

[[item]]
name = "feather"
label = "Feather"

# Flowers, picked from the matching block (see [[pickable]]). Item names differ
# from the block tile names, which are already texture names.
[[item]]
name = "dandelion_flower"
label = "Dandelion"

[[item]]
name = "rose_flower"
label = "Rose"

# Blocks that can be picked, and the item each gives. Each block must be in the
# terrain block list and appear once; each item must be in the item list.
[[pickable]]
block = "dandelion"
item = "dandelion_flower"

[[pickable]]
block = "rose"
item = "rose_flower"

# Foraging tall grass with empty hands (section 9.5).
[forage]
# The item dropped, which must be in the item list.
item = "seeds"
# A forage drops it with probability 1 in `chance`.
chance = 3
# Ticks before the same grass block can be foraged again: one minute at 20 Hz.
cooldown_ticks = 1200

# Crop produce (section 9.4). What each crop yields is in crops.toml.
[[item]]
name = "wheat"
label = "Wheat"

# Fish catches (docs/design/fish-and-fishing.md section 2). A squid killed with
# the sword gives raw_squid the same way a fish gives its raw item.
[[item]]
name = "raw_salmon"
label = "Raw salmon"

[[item]]
name = "raw_tuna"
label = "Raw tuna"

[[item]]
name = "raw_mackerel"
label = "Raw mackerel"

[[item]]
name = "raw_squid"
label = "Raw squid"

# Tilling grass with the hoe (section 9.1). This is Mince Raft's own value;
# research in #289 may change it.
[till]
# The item dropped when grass is tilled, which must be in the item list.
item = "seeds"
# Tilling grass drops it with probability 1 in `chance`.
chance = 8
# Holding secondary retries every this many ticks, on a newly targeted block.
repeat_ticks = 4
