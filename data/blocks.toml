# Block palette for the terrain generator (SPEC 6.2 + SPEC 16).
#
# Read at compile time by crates/terrain/build.rs, which generates the
# `Block` enum and the `BLOCK_INFO` table. Ids are the byte values stored in
# `Region::blocks`; keep them dense and starting at 0. The Rust variant name
# is the CamelCase form of `name`.
#
# fire        = [encouragement, flammability] (SPEC 16; unlisted blocks 0 / 0)
# collision   = "none" | "full" | "inset" (cactus: 1/16 inset on sides and top)
#               Anything other than "none" is *movement-blocking* (SPEC 6 notation).
# opacity     = light opacity for the vertical sky-light / heightmap rule
#               (255 = fully opaque; leaves 1; water and ice 3).
# opaque_cube = the "opaque cube" flag used by leaf placement and mushroom
#               ground (leaves are opaque per quirk B6).
# liquid      = still/flowing liquid (counts for the snow pass top scan).
# color       = flat fallback colour (#rrggbb) for maps / untextured views.

[[block]]
id = 0
name = "air"
fire = [0, 0]
collision = "none"
opacity = 0
opaque_cube = false
color = "#000000"

