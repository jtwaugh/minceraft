# Player body and land-movement tunables. See docs/design/basic-gameplay.md
# sections 4.1, 4.2, 4.3, 4.5 and 4.6.
#
# These are this game's own values (decided in #90). They make no claim of
# Beta parity and are not taken from SPEC.md; retune them for feel. Every key
# is required and must be a non-negative number.

[body]
# Bounding box, blocks.
width = 0.6
height = 1.8
step_height = 0.5
max_health = 20

[camera]
# Eye height above the feet, blocks (design section 3), and how much lower
# the eye sits while sneaking.
eye_height = 1.62
sneak_eye_drop = 0.08

[movement]
# Forward and strafe input are multiplied by input_scale, and also by
# sneak_scale while sneaking.
input_scale = 0.98
sneak_scale = 0.3
# Placeholder (docs/design/sprinting.md): multiplier on input while sprinting,
# pending research question #819. Must be greater than 1.
sprint_scale = 1.3
# Slipperiness of a normal block; the horizontal friction factor on ground is
# slipperiness * friction.
slipperiness = 0.6
# Horizontal friction per tick in air, and the multiplier on slipperiness.
friction = 0.91
# On ground: accel = ground_accel * (ground_accel_ref / f^3), f = slipperiness * friction.
ground_accel = 0.1
ground_accel_ref = 0.16277136
air_accel = 0.02
# Vertical velocity set when jumping from the ground.
jump_velocity = 0.42
# Horizontal speed added along the yaw facing on the tick a sprinting player
# jumps (docs/design/sprinting.md, decided in #821).
sprint_jump_boost = 0.2
# Per tick: vy = (vy - gravity) * drag.
gravity = 0.08
drag = 0.98

[sneak]
# Step size when shrinking motion so a sneaking player stays on the ground.
edge_step = 0.05

[falling]
# Fall distance that does no damage; damage is ceil(fall_distance - threshold).
damage_threshold = 3.0

[water]
# Section 4.3. Horizontal acceleration while in water, and the per-tick
# velocity multiplier applied to all three axes.
accel = 0.02
velocity_multiplier = 0.8
# Gravity in water, subtracted from vy each tick.
gravity = 0.02
# Added to vy each tick while jump is held in water.
swim_up_impulse = 0.04
# Vertical velocity set when climbing out onto a ledge, and the clearance
# above the feet that the ledge must have.
climb_out_velocity = 0.3
climb_out_clearance = 0.6
