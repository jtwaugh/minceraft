# Animal kinds: health and drops. See docs/design/basic-gameplay.md
# section 8.3. Drop items must be defined in items.toml. `box` is [width, height] in
# blocks. These numbers are the game's own (decided in #254). Wandering:
# `wander_speed` in blocks per second; `walk_ticks` and `pause_ticks` are
# inclusive [min, max] tick ranges. `hurt_ticks` is the invulnerability window
# after a hit (section 8.2). `knockback_speed` is the horizontal push away from
# the attacker and `knockback_lift` the upward kick, both in blocks per second.
# A hit animal flees (section 8.2): `flee_speed` in blocks per second, kept
# well under the player's walking speed so a chase can succeed, for
# `flee_ticks`, an inclusive [min, max] tick range. A killed animal plays its
# death animation for `death_ticks` (section 8.2), then its drops spawn flung
# out horizontally at `scatter_speed` in a random direction and up at
# `scatter_lift`, both in blocks per second (section 8.3).
# In water an animal swims instead of falling (raft-scene-feedback item 2): it
# wanders and flees at `swim_speed` (blocks per second) and uses the player's
# water numbers (`[water]` in player.toml) for buoyancy and drag.

[cow]
health = 10
box = [0.9, 1.4]
wander_speed = 0.8
swim_speed = 0.5
walk_ticks = [20, 60]
pause_ticks = [20, 100]
hurt_ticks = 10
knockback_speed = 5.0
knockback_lift = 4.0
flee_speed = 2.0
flee_ticks = [60, 100]
death_ticks = 20
scatter_speed = 1.5
scatter_lift = 3.0
drops = [{ item = "raw_beef", min = 1, max = 3 }, { item = "leather", min = 0, max = 1 }]

