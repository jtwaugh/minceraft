# Animal kinds: health and drops. See docs/design/basic-gameplay.md
# section 8.3. Drop items must be defined in items.toml. Box sizes and
# movement numbers are added by later tickets.

[cow]
health = 10
drops = [{ item = "raw_beef", min = 1, max = 3 }, { item = "leather", min = 0, max = 1 }]

[pig]
health = 10
drops = [{ item = "raw_pork", min = 1, max = 3 }]

[chicken]
health = 4
drops = [{ item = "raw_chicken", min = 1, max = 1 }, { item = "feather", min = 0, max = 2 }]
