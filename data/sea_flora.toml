# Sea flora (docs/design/sea-flora-and-shellfish.md sections 3 and 4), read by
# crates/layout/src/sea_flora.rs. Nothing places these yet. Chances, scales
# and salts are this game's own numbers, tuned here.
#   shape     column (blocks = [middle, top]) | cluster (blocks = [block])
#   habitats  habitat ids (data/habitats.toml); bottom: seabed block names
#   depth_min / depth_max, shore_distance_max (optional): inclusive
#   column    column only: height_min / height_max cells tall, inclusive, and
#             surface_gap_min, the fewest water cells above the top cell
#             (0: the top may touch the surface, never rise above it)
#   cluster_scale blocks per patch noise cell; salt unique per entry;
#   chance    per eligible column, 0 to 1

[[sea_flora]]
name = "kelp"
shape = "column"
blocks = ["kelp_0", "kelp_1"]
habitats = ["cold_open", "temperate_open", "rocky_shore"]
bottom = ["gravel", "stone", "sand"]
depth_min = 4
depth_max = 16
column = { height_min = 3, height_max = 12, surface_gap_min = 0 }
cluster_scale = 16.0
salt = 1
chance = 0.35

# Near shore: 6 is the rocky_shore limit in data/habitats.toml.
[[sea_flora]]
name = "oyster"
shape = "cluster"
blocks = ["oyster"]
habitats = ["rocky_shore", "temperate_open"]
bottom = ["gravel", "stone"]
depth_min = 1
depth_max = 5
shore_distance_max = 6
cluster_scale = 8.0
salt = 2
chance = 0.3

[[sea_flora]]
name = "scallop"
shape = "cluster"
blocks = ["scallop"]
habitats = ["cold_open", "temperate_open"]
bottom = ["sand", "gravel"]
depth_min = 3
depth_max = 12
cluster_scale = 12.0
salt = 3
chance = 0.08
