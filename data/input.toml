# Default desktop bindings. See docs/design/basic-gameplay.md section 2.1.
#
# Key names follow the browser's KeyboardEvent.code, plus pseudo-keys for the
# mouse: MouseLeft, MouseRight, MouseMove (pointer-lock motion), WheelUp and
# WheelDown. Each action lists the keys bound to it; a key may appear only once
# in the whole file.
#
# mode:
#   hold       true while the key is down
#   edge       latched once per press
#   continuous analogue input sampled every frame

[look]
# Plain linear scale, radians of rotation per pixel of mouse motion. Beta's
# curve is not in SPEC.md yet (issue #61).
sensitivity = 0.0025
fov_degrees = 70.0

[sprint]
# Double-tap window in sim ticks (SPEC Sprinting, decided in #821): the second
# forward press must come 2 to double_tap_ticks - 1 ticks after the first.
# A whole number from 0 to 10; 0 turns double-tap sprinting off.
double_tap_ticks = 7
# This game's own tunables (SPEC Sprinting, Camera), not facts about Beta. While
# sprinting the field of view widens by fov_extra_degrees, easing in and out over
# fov_ease_seconds. Both must be positive numbers.
fov_extra_degrees = 10.0
fov_ease_seconds = 0.15

[actions.move_forward]
keys = ["KeyW"]
mode = "hold"

[actions.move_left]
keys = ["KeyA"]
mode = "hold"

[actions.move_back]
keys = ["KeyS"]
mode = "hold"

[actions.move_right]
keys = ["KeyD"]
mode = "hold"

[actions.look]
keys = ["MouseMove"]
mode = "continuous"

[actions.jump]
keys = ["Space"]
mode = "hold"

[actions.sneak]
keys = ["ShiftLeft"]
mode = "hold"

[actions.primary]
keys = ["MouseLeft"]
mode = "edge"

# Press edge, plus hold for repeat where an item says so.
[actions.secondary]
keys = ["MouseRight"]
mode = "edge"
hold_repeat = true

[actions.interact]
keys = ["KeyE"]
mode = "edge"

[actions.drop]
keys = ["KeyQ"]
mode = "edge"

[actions.select_tool]
keys = ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "WheelUp", "WheelDown"]
mode = "edge"

# Opens the inventory view (docs/design/ui-art-and-inventory.md, decided in #666).
[actions.inventory]
keys = ["Tab"]
mode = "edge"
