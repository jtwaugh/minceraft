# Biomes, biome lookup thresholds and tree shapes (SPEC 8, 9, 11, 14).
#
# Read at compile time by crates/terrain/build.rs, which generates the
# `Biome` enum, `BIOME_INFO`, the lookup threshold constants, the tree shape
# constants and the JSON legend exported to the viewer. Nothing here is parsed
# at runtime.
#
# Colours are this project's own (not taken from any original colour map).
# Ramps have three stops; the viewer interpolates between them:
#   grass_ramp, leaf_ramp : by the column's humidity H (stop 0 = H 0, stop 2 = H 1)
#   water_ramp            : by the column's humidity H, like grass (multiplies the water tile)
#   dry_ramp              : by the column's humidity H, like grass (tan to straw; tints dry grass)
#   sky_ramp              : by the column's temperature T (stop 0 = T 0, stop 2 = T 1)
#
# [blend] radius R (integer 0 to 7, default 3): the viewer box-blurs column
# tints over a (2R+1) x (2R+1) window. Exported as `blend.radius` in the
# legend JSON; a client setting may override it. Does not affect world output.
# [blend] shade_mix (0 to 1, default 0.25): how far grass under leaves is
# tinted toward the dry ramp at full shade (0 turns shading off). shade_radius
# S (integer 0 to 3, default 1): the shade fraction is taken over a
# (2S+1) x (2S+1) window of columns. Exported as `blend.shade_mix` and
# `blend.shade_radius`. Viewer colouring only; does not affect world output.

# ---------------------------------------------------------------------------
# Biome lookup (SPEC 8.2). With t = i/63, h = j/63 (quantised T, H) and
# w = t*h, the first matching rule wins:
#   1 t < cold_t                      Tundra
#   2 w < dry_w   and t < cool_t      Tundra
#   3 w < dry_w   and t < hot_t       Savanna
#   4 w < dry_w                       Desert
#   5 w > swamp_w and t < swamp_t     Swampland
#   6 t < cool_t                      Taiga
#   7 t < very_hot_t and w < shrub_w  Shrubland
#   8 t < very_hot_t                  Forest
#   9 w < plains_w                    Plains
#  10 w < seasonal_w                  Seasonal Forest
#  11 otherwise                       Rainforest
# ---------------------------------------------------------------------------
[lookup]
cold_t = 0.1
cool_t = 0.5
swamp_t = 0.7
hot_t = 0.95
very_hot_t = 0.97
dry_w = 0.2
shrub_w = 0.35
plains_w = 0.45
swamp_w = 0.5
seasonal_w = 0.9

[blend]
radius = 3
shade_mix = 0.25
shade_radius = 1

# Spawn lists shared by every biome (SPEC 14); `extra_creatures` in a biome
# is appended to `creatures`. [species, weight]
[spawns]
creature_cap = 15
monster_cap = 70
water_cap = 5
creatures = [["sheep", 12], ["pig", 10], ["chicken", 10], ["cow", 8]]
monsters = [["spider", 10], ["zombie", 10], ["skeleton", 10], ["creeper", 10], ["slime", 10]]
water = [["squid", 10]]

# ---------------------------------------------------------------------------
# Tree shapes (SPEC 11). `height = [base, spread]` means base + rand(spread).
# ---------------------------------------------------------------------------
[trees.oak]
log = "oak_log"
leaves = "oak_leaves"
height = [4, 3]
canopy = [2, 2, 1, 1]          # leaf-layer radii, bottom to top; top layer sits at y + h

[trees.birch]
log = "birch_log"
leaves = "birch_leaves"
height = [5, 3]
canopy = [2, 2, 1, 1]

[trees.taiga_a]                 # sparse "pine"
log = "spruce_log"
leaves = "spruce_leaves"
height = [7, 5]
bare_trunk = [3, 2]             # a = h - 3 - rand(2)

[trees.taiga_b]                 # layered "spruce"
log = "spruce_log"
leaves = "spruce_leaves"
height = [6, 4]
bare_trunk = [1, 2]             # a = 1 + rand(2)
max_radius = [2, 2]             # R = 2 + rand(2)

[trees.big_oak]
log = "oak_log"
leaves = "oak_leaves"
height = [5, 12]
min_height = 6                  # trunk blocked below this many blocks -> fail
trunk_ratio = 0.618
branch_slope = 0.381
foliage_density = 1.0
branch_cutoff = 0.2
level_cutoff = 0.3
foliage_radii = [2.0, 3.0, 3.0, 3.0, 2.0]   # cluster layers bottom to top

# ---------------------------------------------------------------------------
# Biomes (SPEC 9.1). Ids are the per-column biome bytes exported to the
# viewer. Rust variant = CamelCase of `name` with spaces removed.
#
# tree_noise  : add the noise-driven base count N (SPEC 10.3)
# tree_bonus  : the biome term added to the count (5, 2, 0 or -20)
# trees       : relative weights of tree kinds
# plants      : patch attempts per 16x16 cell; a fraction f < 1 is one patch
#               with probability f. fern_share = chance a tall-grass patch is
#               ferns.
# ---------------------------------------------------------------------------

[[biome]]
id = 0
name = "Rainforest"
top = "grass"
filler = "dirt"
map_color = "#1f7a4d"
tree_noise = true
tree_bonus = 5
trees = { big_oak = 1, oak = 2 }
plants = { dandelion = 0, rose = 0.5, tall_grass = 10, fern_share = 0.6666667, dead_bush = 0, cactus = 0, sugar_cane = 10, pumpkin = 0.03125, brown_mushroom = 0.25, red_mushroom = 0.125 }
grass_ramp = ["#5fa83a", "#3fae4a", "#22a35a"]
leaf_ramp = ["#3f9a2e", "#2a9440", "#18874c"]
sky_ramp = ["#9cc4e8", "#86c3e6", "#6fc0e4"]
water_ramp = ["#4fb0b8", "#3fb4a8", "#35b098"]
dry_ramp = ["#b8a45a", "#b0a050", "#a89c48"]

