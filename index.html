<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mince Raft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 32px; background: #1b1e24; color: #eee; font: 16px/1.5 ui-monospace, monospace; }
  h1 { margin: 0 0 24px; }
  h2 { margin: 24px 0 4px; font-size: 20px; }
  a { color: #8cf; }
  ul { margin: 0; padding-left: 24px; }
  .seed { margin: 8px 0 0 24px; }
  .seed { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seed input { width: 14em; font: inherit; }
  .seed button { font: inherit; }
  .seed-field { position: relative; }
  .seed-text:empty { display: none; }
  .alpha { margin-left: 8px; padding: 1px 6px; font-size: 12px; color: #000; background: #fc4; border-radius: 3px; vertical-align: middle; }

  body.styled { min-height: 100vh; box-sizing: border-box; padding: calc(8 * var(--px)); text-align: center;
    color: #fff; background: var(--sea) 0 0 / var(--sea-size) var(--sea-size); image-rendering: pixelated;
    animation: sea 8s linear infinite; }
  body.styled h1 { margin: 0 0 calc(8 * var(--px)); font-size: calc(8 * var(--px)); text-shadow: var(--px) var(--px) #000; }
  body.styled section { width: calc(84 * var(--px)); margin: 0 auto calc(4 * var(--px)); text-align: left;
    border: calc(4 * var(--px)) solid transparent; border-image: var(--panel) 4 fill / calc(4 * var(--px)) stretch;
    image-rendering: pixelated; }
  /* The text stays in the h1 for accessibility; the wordmark is its background. */
  body.styled h1.wordmark { width: var(--wordmark-w); height: var(--wordmark-h); margin: 0 auto calc(8 * var(--px)); overflow: hidden;
    text-indent: -999em; white-space: nowrap; text-shadow: none; background: var(--wordmark) 0 0 / 100% 100% no-repeat; image-rendering: pixelated; }
  /* Text is drawn in the pixel font: each [data-label] holds one canvas. */
  body.styled [data-label] canvas, body.styled .seed-text canvas { display: block; }
  body.styled h2 { margin: 0; }
  body.styled section h2 a, body.styled section h2 button, body.styled section li a, body.styled section .seed button {
    padding: 0 var(--px); }
  body.styled section h2 button { display: flex; align-items: center; width: 100%; }
  body.styled .alpha { margin-left: calc(2 * var(--px)); padding: var(--px); border-radius: 0; }
  body.styled ul { margin: calc(2 * var(--px)) 0 0; padding: 0; list-style: none; }
  body.styled li + li { margin-top: calc(2 * var(--px)); }
  body.styled .seed { margin: calc(2 * var(--px)) 0 0; gap: calc(2 * var(--px)); }
  body.styled .seed label { flex: 1; }
  body.styled .seed-field { flex-basis: 100%; }
  /* The native text is invisible but keeps the caret; each character advances one 4-texel glyph cell. */
  body.styled .seed input { display: block; box-sizing: border-box; width: 100%; height: calc(16 * var(--px)); margin: 0;
    padding: var(--px); border: calc(4 * var(--px)) solid transparent;
    border-image: var(--btn-pressed) 4 fill / calc(4 * var(--px)) stretch; image-rendering: pixelated;
    background: none; outline: none; color: transparent; caret-color: #fff;
    font: calc(6 * var(--px)) / 1 ui-monospace, monospace; letter-spacing: calc(4 * var(--px) - 1ch); }
  body.styled .seed input::placeholder { color: transparent; }
  body.styled .seed-text { position: absolute; inset: calc(5 * var(--px)); overflow: hidden; pointer-events: none; }
  body.styled .seed-text.placeholder { opacity: 0.5; }
  @keyframes sea { to { background-position: var(--sea-size) 0; } }
  @media (prefers-reduced-motion: reduce) { body.styled { animation: none; } }
</style>
</head>
<body>
<h1>Mince Raft</h1>
<main id="menu"></main>
<noscript>
<p><a href="viewer/">World gen</a></p>
<p><a href="client/">Test play</a> (alpha)</p>
</noscript>
<script type="module" src="./client/menu.js"></script>
</body>
</html>
