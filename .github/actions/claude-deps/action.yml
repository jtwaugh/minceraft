name: Claude dependencies
description: >-
  Bun and the Claude Code CLI for anthropics/claude-code-action, restored from
  the Actions cache instead of installed on every run. Pass the outputs to the
  action as path_to_bun_executable and path_to_claude_code_executable.
# Why: the action otherwise downloads Bun 1.3.14, runs `bun install` and pipes
# claude.ai/install.sh into bash on every run. Bun 1.3.13-1.4.0 intermittently
# fails extracting large tarballs it is still downloading ("Fail extracting
# tarball from @anthropic-ai/claude-agent-sdk-linux-x64-musl"). Here Bun is
# 1.4.2, and its package cache is restored, so the action's own `bun install`
# reads packages from disk instead of streaming them.
inputs:
  bun:
    description: Bun version (1.4.1 or later; see above)
    default: 1.4.2
  claude-code:
    description: Claude Code CLI version
    default: 2.1.301
  action-sha:
    description: >-
      The claude-code-action commit the workflows pin. Part of the cache key,
      because its lockfile decides what the action's `bun install` fetches.
      Bump it together with the pins in .github/workflows/claude*.yml.
    default: 374f254f5efaf968abfe15d399fd90972e8138b9
outputs:
  bun:
    description: Path to the bun executable
    value: ${{ steps.paths.outputs.bun }}
  claude:
    description: Path to the claude executable
    value: ${{ steps.paths.outputs.claude }}
runs:
  using: composite
  steps:
    # On a miss, the action's own `bun install` (later in the job) fills
    # ~/.bun/install/cache, and this step's post-run saves everything.
    - id: cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/bin
          ~/.bun/install/cache
          ~/.cache/claude-code
        key: claude-deps-${{ runner.os }}-${{ runner.arch }}-bun${{ inputs.bun }}-cc${{ inputs.claude-code }}-${{ inputs.action-sha }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun }}
        no-cache: true

    - name: Install Claude Code (cache miss only)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.claude-code }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSION"; then break; fi
          [ "$attempt" = 3 ] && exit 1
          sleep 5
        done
        mkdir -p ~/.cache/claude-code
        cp -L ~/.local/bin/claude ~/.cache/claude-code/claude-"$VERSION"

    - id: paths
      shell: bash
      env:
        VERSION: ${{ inputs.claude-code }}
      run: |
        set -euo pipefail
        bun="$HOME/.bun/bin/bun"
        claude="$HOME/.cache/claude-code/claude-$VERSION"
        echo "bun $("$bun" --version), claude $("$claude" --version)"
        echo "bun=$bun" >> "$GITHUB_OUTPUT"
        echo "claude=$claude" >> "$GITHUB_OUTPUT"
