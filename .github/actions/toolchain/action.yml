name: Toolchain
description: The Rust, wasm and Node toolchain CI uses, so agents can run the same checks before pushing.
inputs:
  rust:
    description: Rust toolchain version
    default: 1.97.1
  binaryen:
    description: Binaryen release (wasm-opt)
    default: version_133
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust }}
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    # wasm-pack and wasm-opt from the Actions cache (downloaded on a miss only)
    - uses: ./.github/actions/wasm-tools
      with:
        binaryen: ${{ inputs.binaryen }}
    - uses: actions/setup-node@v7
      with:
        node-version: 22
