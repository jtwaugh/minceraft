# After every merge to master, bring the factory's open PRs back up to date.
#
# A merge often makes other open PRs conflict (two features appending to the
# same list, or editing neighbouring lines). This finds the claude/ PRs that
# now conflict and has Claude merge master into each, resolve the conflicts
# keeping both sides, run the checks and push. If a conflict needs a real
# decision, it aborts and says so on the PR instead (and isn't retried on
# that commit). Fewer conflicts arise in the first place because the factory
# tick holds tickets back while open PRs edit the same files
# (.github/scripts/factory_ready.py, with the rules in tickets.py).
#
# Run by hand: gh workflow run resolve-conflicts.yml [-f pr=<n>]
name: Resolve conflicts

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Only this PR, even if Claude stopped on it before (optional)"
        required: false
        type: string

env:
  NOTE: >-
    Commands: only the tools in your allowed list run, and nobody can approve others. Write comment bodies to a file with the Write tool and pass it with --body-file <file>; don't put heredocs or command substitution in a command. If a command is refused, use an allowed alternative, and if you still can't finish, say exactly what you couldn't do in your final message.

jobs:
  find:
    if: |
      github.event_name == 'workflow_dispatch' && github.actor == 'jtwaugh' ||
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
        github.event.pull_request.base.ref == 'master' &&
        github.event.pull_request.merged_by.login == 'jtwaugh'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_PR: ${{ inputs.pr }}
        run: |
          prs=$(python3 -B .github/scripts/conflicts.py)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "Conflicting PRs: $prs" >> "$GITHUB_STEP_SUMMARY"

  resolve:
    needs: find
    if: needs.find.outputs.prs != '' && needs.find.outputs.prs != '[]'
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find.outputs.prs) }}
    concurrency:
      # Same group as the implementer uses for this PR, so they never race.
      group: claude-${{ matrix.pr.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # This job may have queued behind another run on the same PR (each
      # merge starts a `find`), so check again: same head, not superseded,
      # and nobody stopped on it in the meantime.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          path: gate
      - name: Still worth resolving?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_PR: ${{ inputs.pr }}
        run: |
          go=$(python3 -B gate/.github/scripts/conflicts.py still ${{ matrix.pr.number }} ${{ matrix.pr.sha }})
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ matrix.pr.branch }}
          fetch-depth: 0
          # Push with the Claude app's token (set up by the action), not
          # this workflow's: the push then counts as the Claude app's, like
          # the implementer's, and triggers CI and the reviewer.
          persist-credentials: false
      - name: Note the start time
        id: start
        if: steps.gate.outputs.go == 'true'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/toolchain
        if: steps.gate.outputs.go == 'true'
      # Bun and the Claude CLI from the Actions cache (see the action)
      - id: claude-deps
        if: steps.gate.outputs.go == 'true'
        uses: ./.github/actions/claude-deps
      - id: claude
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1, 2026-10-15
        with:
          path_to_bun_executable: ${{ steps.claude-deps.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.claude-deps.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ matrix.pr.number }}
            BRANCH: ${{ matrix.pr.branch }} (checked out)

            This pull request now conflicts with master because other pull
            requests merged. Bring it up to date; change nothing else.

            1. `git fetch origin master`. The Claude action has replaced
               CLAUDE.md with master's copy (unstaged), which stops a merge:
               run `git restore CLAUDE.md` first (also `.claude` or
               `.mcp.json` if `git status` lists them; master's copies come
               back with the merge). Then `git merge origin/master`.
            2. Resolve each conflict so both sides survive: master's new
               code and this PR's change. Read both sides first
               (`git log --oneline -5 origin/master -- <file>` helps).
               Don't drop or rewrite either side's behaviour, and don't
               refactor or reformat beyond what the merge needs.
            3. Run the checks from CLAUDE.md's "Before opening a PR" that
               apply: `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`,
               `cargo test`; also `./build.sh` and
               `node --test client/test/*.test.mjs` if crates/web,
               crates/game-web or client/ changed on either side.
            4. `git add` the resolved files, `git commit --no-edit`, and
               `git push origin ${{ matrix.pr.branch }}`. Never rebase,
               force-push, or push to any other branch.
            5. If a conflict needs a real decision (both sides change the
               same behaviour in incompatible ways), or the checks fail
               after the merge and the fix isn't a direct consequence of
               combining the two sides, run `git merge --abort` and push
               nothing. Comment on the PR with
               `gh pr comment ${{ matrix.pr.number }} --body-file <file>`,
               where the file starts with the line `<!-- conflict-stop -->`
               and then names the conflicting files and why you stopped.
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git merge:*),Bash(git restore CLAUDE.md),Bash(git restore .claude:*),Bash(git restore .mcp.json),Bash(git add:*),Bash(git commit:*),Bash(git push origin claude/*),Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*),Bash(./build.sh:*),Bash(node --test:*),Bash(python3:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(cat:*),Bash(printf:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
            --append-system-prompt "Follow CLAUDE.md, above all its clean-room rules: never edit SPEC.md or anything in docs/design/, and add no behaviour that neither side of the merge has. ${{ env.NOTE }}"

      # Did the branch move (merge pushed), or did Claude say why it stopped?
      - name: Check the run left its result
        id: check
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/expect.py conflict "${{ matrix.pr.number }}@${{ matrix.pr.sha }}" "${{ steps.start.outputs.at }}"
      - name: Report the run
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        uses: ./.github/actions/claude-report
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          ok: ${{ steps.check.outputs.ok }}
          expected: ${{ steps.check.outputs.expected }}
          issue: ${{ matrix.pr.number }}
          retry: "To retry: `gh workflow run resolve-conflicts.yml`, or comment `@claude merge master into this branch and resolve the conflicts`."
