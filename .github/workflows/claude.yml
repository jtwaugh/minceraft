# Implementer.
#
# - Label a ticket "factory" to approve it. If its dependencies (its
#   "Depends on:" line and any "Blocked by #n") are all closed, Claude starts
#   at once; otherwise it says what it's waiting on and starts by itself
#   later.
# - Whenever an issue closes (usually a PR merging), every approved ticket
#   whose dependencies are now all closed, and that has no open PR, starts.
# - Mention @claude in an issue or PR comment to ask for anything else, e.g.
#   "@claude merge master into this branch and resolve the conflicts".
#
# Dependency checks are .github/scripts/tickets.py.
name: Claude implementer

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  ALLOWED_TOOLS: >-
    Edit,Write,Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*),Bash(cargo run:*),Bash(./build.sh:*),Bash(python3:*),Bash(cd:*),Bash(node viewer/flyover/preview.mjs:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(git merge:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)
  RULES: >-
    You are the implementer for this repository. Follow CLAUDE.md exactly, above all its clean-room rules: Beta behaviour comes only from SPEC.md, never edit SPEC.md or design docs, and if the spec is ambiguous or incomplete, open an issue labelled spec-question with gh issue create and stop. Before starting, read the ticket with gh issue view and check every issue on its Depends on line is closed; if one isn't, say so in a comment and stop. Run every check in CLAUDE.md's 'Before opening a PR' list before you push. To bring a branch up to date, use git fetch and git merge origin/master (never rebase or force-push). When the work is done, open a pull request with gh pr create whose body says 'Closes #<issue>', cites the spec or design-doc sections implemented, and states whether world output changes for a fixed seed.

jobs:
  # A ticket was labelled "factory", or someone mentioned @claude.
  implement:
    # Plan issues are never built directly; label their tickets instead.
    # Public repo: only jtwaugh can start a run, and a labelled issue must also
    # have been written by jtwaugh or the planner (claude[bot]), so nobody
    # else's text becomes the task.
    if: |
      github.event.sender.login == 'jtwaugh' && (
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'factory' &&
          !startsWith(github.event.issue.title, 'Plan:') &&
          contains(fromJSON('["jtwaugh", "claude[bot]"]'), github.event.issue.user.login)) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    concurrency:
      # One run per issue or PR at a time; a new trigger waits instead of racing.
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on its PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A labelled ticket whose dependencies are still open waits, without
      # spending a Claude run. It starts later from the start-ready job.
      - name: Check dependencies
        id: deps
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          waiting=$(python3 -B .github/scripts/tickets.py blocked "$N")
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          if [ "$waiting" != "[]" ]; then
            list=$(echo "$waiting" | jq -r 'map("#\(.)") | join(", ")')
            gh issue comment "$N" --body "Waiting on $list. I'll start by myself once they're all closed."
          fi

      - if: steps.deps.outputs.waiting == '' || steps.deps.outputs.waiting == '[]'
        uses: ./.github/actions/toolchain

      - if: steps.deps.outputs.waiting == '' || steps.deps.outputs.waiting == '[]'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: factory
          # Only these accounts' comments reach Claude; other people's are dropped.
          include_comments_by_actor: jtwaugh,claude[bot]
          track_progress: true
          claude_args: |
            --max-turns 80
            --allowedTools "${{ env.ALLOWED_TOOLS }}"
            --append-system-prompt "${{ env.RULES }}"

  # An issue closed: which approved tickets are now unblocked?
  find-ready:
    if: |
      github.event_name == 'issues' && github.event.action == 'closed' &&
      contains(fromJSON('["jtwaugh", "claude[bot]"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=$(python3 -B .github/scripts/tickets.py ready)
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Ready to start: $ready" >> "$GITHUB_STEP_SUMMARY"

  start-ready:
    needs: find-ready
    if: needs.find-ready.outputs.ready != '' && needs.find-ready.outputs.ready != '[]'
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.find-ready.outputs.ready) }}
    concurrency:
      # Same group as the implement job, so a ticket never runs twice at once.
      group: claude-${{ matrix.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - uses: anthropics/claude-code-action@v1
        env:
          ISSUE: ${{ matrix.issue }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The closing event can come from the Claude app (e.g. the planner
          # closing an empty plan); find-ready already limits who can.
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}

            Implement ticket #${{ matrix.issue }}. It was approved earlier
            and its dependencies have just closed.

            1. Run `gh pr list --state open --search "${{ matrix.issue }}"`. If
               a pull request for this ticket already exists, stop.
            2. Read the ticket: `gh issue view ${{ matrix.issue }} --comments`.
            3. Create a branch `claude/issue-${{ matrix.issue }}-<yyyymmdd-hhmm>`
               from master, implement the ticket, and run every check.
            4. Commit, push the branch, and open the pull request.
            5. Comment on the ticket with a link to the pull request, or,
               if you stopped, why.
          claude_args: |
            --max-turns 80
            --allowedTools "${{ env.ALLOWED_TOOLS }},Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(date:*)"
            --append-system-prompt "${{ env.RULES }}"
