# Implementer.
#
# - Label a ticket "factory" to approve it. If its dependencies (its
#   "Depends on:" line and any "Blocked by #n") are all closed, Claude starts
#   at once; otherwise it says what it's waiting on, and the factory tick
#   starts it once they close.
# - The factory tick (factory-tick.yml) starts a ready ticket by
#   dispatching this workflow with its number:
#     gh workflow run claude.yml -f issue=<n>
# - Mention @claude in an issue or PR comment to ask for anything else, e.g.
#   "@claude merge master into this branch and resolve the conflicts".
#
# Dependency checks are .github/scripts/tickets.py; deciding when a waiting
# ticket is ready is the tick's (.github/scripts/factory_ready.py).
name: Claude implementer
# The tick finds its own starts by this name (factory_stalled_tickets.py).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Claude implementer #{0}', inputs.issue) || github.event.issue.title || github.event.pull_request.title || 'Claude implementer' }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # The factory tick: it has checked the ticket and posted the start marker.
  workflow_dispatch:
    inputs:
      issue:
        description: "Ticket to start"
        required: true
        type: string

env:
  ALLOWED_TOOLS: >-
    Edit,Write,Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*),Bash(cargo run:*),Bash(./build.sh:*),Bash(python3:*),Bash(cd:*),Bash(node viewer/flyover/preview.mjs:*),Bash(node --test:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(git merge:*),Bash(git restore CLAUDE.md),Bash(git restore .claude:*),Bash(git restore .mcp.json),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(cat:*),Bash(printf:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)
  RULES: >-
    You are the implementer for this repository. Follow CLAUDE.md exactly, above all its clean-room rules: Beta behaviour comes only from SPEC.md, never edit SPEC.md or design docs, and if the spec is ambiguous or incomplete, open an issue labelled spec-question with gh issue create, then comment on the ticket 'Blocked by #<that issue>' (exactly that phrase, so the ticket restarts by itself once the question is answered) and stop. Before starting, read the ticket with gh issue view and check every issue on its Depends on line is closed; if one isn't, say so in a comment and stop. Run every check in CLAUDE.md's 'Before opening a PR' list before you push. To bring a branch up to date, use git fetch and git merge origin/master (never rebase or force-push). On a pull request the Claude action replaces CLAUDE.md (and any .claude/ or .mcp.json) with master's copy and leaves that unstaged, so git merge origin/master refuses to run. Before merging, run git restore CLAUDE.md (and git restore .claude .mcp.json if git status lists them); master's copy comes back with the merge. Never commit or stash those files otherwise. When the work is done, first run python3 -B .github/scripts/tickets.py claimed <ticket> <your branch>: if it prints anything, someone else is already building this ticket, so don't open a pull request; comment on the ticket with what it printed and stop. Otherwise open a pull request with gh pr create whose body says 'Closes #<issue>', cites the spec or design-doc sections implemented, and states whether world output changes for a fixed seed. Commands: only the tools in your allowed list run, and nobody can approve others. Write commit messages and issue or PR bodies to a file with the Write tool, then pass the file (git commit -F <file>, gh pr create --body-file <file>); don't put heredocs or command substitution in a command. If a command is refused, use an allowed alternative, and if you still can't finish, say exactly what you couldn't do in your final message.

jobs:
  # A ticket was labelled "factory", or someone mentioned @claude.
  implement:
    # Plan issues are never built directly; label their tickets instead.
    # Public repo: only jtwaugh can start a run, and a labelled issue must also
    # have been written by jtwaugh or the planner (claude[bot]), so nobody
    # else's text becomes the task.
    if: |
      github.event.sender.login == 'jtwaugh' && (
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'factory' &&
          !startsWith(github.event.issue.title, 'Plan:') &&
          contains(fromJSON('["jtwaugh", "claude[bot]"]'), github.event.issue.user.login)) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    concurrency:
      # One run per issue or PR at a time; a new trigger waits instead of racing.
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on its PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Claude pushes with the Claude app's token (the action sets the
          # remote). A persisted workflow token would win and push as
          # github-actions[bot], which the reviewer then skips.
          persist-credentials: false

      # A ticket someone else is already building (an open PR, the `local`
      # label, or a pushed branch for it with no PR yet) isn't started.
      - name: Check nobody else is building it
        id: claim
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          claim=$(python3 -B .github/scripts/tickets.py claimed "$N")
          echo "claim=$claim" >> "$GITHUB_OUTPUT"
          if [ -n "$claim" ]; then
            gh issue comment "$N" --body "Not starting: $claim."
          fi

      # A labelled ticket whose dependencies are still open waits, without
      # spending a Claude run. The factory tick starts it later. (Skipped,
      # and so is everything after it, when the ticket is claimed.)
      - name: Check dependencies
        id: deps
        if: github.event_name == 'issues' && steps.claim.outputs.claim == ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          waiting=$(python3 -B .github/scripts/tickets.py blocked "$N")
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          if [ "$waiting" != "[]" ]; then
            list=$(echo "$waiting" | jq -r 'map("#\(.)") | join(", ")')
            gh issue comment "$N" --body "Waiting on $list. I'll start by myself once they're all closed."
          fi

      # Gate on the event, not on an empty output, so a failed dependency
      # check stops the run instead of reading as "no dependencies".
      - if: success() && (github.event_name != 'issues' || steps.deps.outputs.waiting == '[]')
        uses: ./.github/actions/toolchain

      # Bun and the Claude CLI from the Actions cache (see the action)
      - id: claude-deps
        if: success() && (github.event_name != 'issues' || steps.deps.outputs.waiting == '[]')
        uses: ./.github/actions/claude-deps
      - id: claude
        if: success() && (github.event_name != 'issues' || steps.deps.outputs.waiting == '[]')
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1, 2026-10-15
        with:
          path_to_bun_executable: ${{ steps.claude-deps.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.claude-deps.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: factory
          # Only these accounts' comments reach Claude; other people's are dropped.
          include_comments_by_actor: jtwaugh,claude[bot]
          track_progress: true
          claude_args: |
            --max-turns 80
            --allowedTools "${{ env.ALLOWED_TOOLS }}"
            --append-system-prompt "${{ env.RULES }}"

      # Refused commands and Claude's last message, in the job summary.
      - name: Report the run
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/claude-report
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}

  # The tick named a ticket: it has checked dependencies and overlap and
  # posted the start marker.
  start:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      # Same group as the implement job, so a ticket never runs twice at once.
      group: claude-${{ inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Claude pushes with the Claude app's token (the action sets the
          # remote). A persisted workflow token would win and push as
          # github-actions[bot], which the reviewer then skips.
          persist-credentials: false
      # Skips only if someone is already building the ticket (a run this one
      # waited for made a PR, it's labelled `local`, or a branch for it has
      # work and no PR). Only maintainers can dispatch, so a hand-run
      # `gh workflow run claude.yml -f issue=<n>` starts any other ticket,
      # even a blocked one.
      - name: Skip a ticket someone is building
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          claim=$(python3 -B .github/scripts/tickets.py claimed "${{ inputs.issue }}")
          if [ -n "$claim" ]; then
            echo "Skipping: $claim." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mark.outputs.go == 'true'
        uses: ./.github/actions/toolchain
      # Bun and the Claude CLI from the Actions cache (see the action)
      - id: claude-deps
        if: steps.mark.outputs.go == 'true'
        uses: ./.github/actions/claude-deps
      - if: steps.mark.outputs.go == 'true'
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1, 2026-10-15
        id: claude
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          path_to_bun_executable: ${{ steps.claude-deps.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.claude-deps.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The tick dispatches as github-actions.
          allowed_bots: claude,github-actions
          prompt: |
            REPO: ${{ github.repository }}

            Implement ticket #${{ inputs.issue }}. It was approved earlier
            and its dependencies have just closed.

            1. Run `gh pr list --state open --search "${{ inputs.issue }}"`. If
               a pull request for this ticket already exists, stop.
            2. Read the ticket: `gh issue view ${{ inputs.issue }} --comments`.
            3. Create a branch with
               `git checkout -b claude/issue-${{ inputs.issue }}-<yyyymmdd-hhmm>`
               from master, implement the ticket, and run every check.
            4. Commit, push with `git push -u origin <that branch>`, and open
               the pull request. Never push to any other branch.
            5. Comment on the ticket with a link to the pull request, or,
               if you stopped, why.
          claude_args: |
            --max-turns 80
            --allowedTools "${{ env.ALLOWED_TOOLS }},Bash(git checkout -b claude/*),Bash(git switch -c claude/*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin claude/*),Bash(git push origin claude/*),Bash(date:*)"
            --append-system-prompt "${{ env.RULES }}"

      # Claude exits "successfully" even when it gives up, so check for the
      # result itself; a miss fails the job (and says so where given).
      - name: Check the run left its result
        id: check
        if: ${{ !cancelled() && steps.mark.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/expect.py ticket "${{ inputs.issue }}" "${{ steps.mark.outputs.at }}"
      - name: Report the run
        if: ${{ !cancelled() && steps.mark.outputs.go == 'true' }}
        uses: ./.github/actions/claude-report
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          ok: ${{ steps.check.outputs.ok }}
          expected: ${{ steps.check.outputs.expected }}
          issue: ${{ inputs.issue }}
          retry: Comment `@claude` here to retry.
