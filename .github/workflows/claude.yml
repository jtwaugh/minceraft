# Implementer: label an issue "factory", or mention @claude in an issue or PR
# comment. Claude works on a claude/ branch and pushes commits there.
name: Claude implementer

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # One run per issue or PR at a time; a new trigger waits instead of racing.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.97.1
  BINARYEN_VERSION: version_133

jobs:
  implement:
    # Public repo: only jtwaugh can start a run, and a labelled issue must also
    # have been written by jtwaugh, so nobody else's text becomes the task.
    if: |
      github.event.sender.login == 'jtwaugh' && (
        (github.event_name == 'issues' && github.event.label.name == 'factory' && github.event.issue.user.login == 'jtwaugh') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on its PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same toolchain CI uses, so Claude can run the checks before pushing.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install binaryen (wasm-opt)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: factory
          # Only these accounts' comments reach Claude; other people's are dropped.
          include_comments_by_actor: jtwaugh,claude[bot]
          track_progress: true
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,Write,Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*),Bash(cargo run:*),Bash(./build.sh:*),Bash(python3:*),Bash(cd:*),Bash(node viewer/flyover/preview.mjs:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh issue create:*)"
            --append-system-prompt "You are the implementer for this repository. Follow CLAUDE.md exactly, above all its clean-room rules: implement only from SPEC.md, never edit SPEC.md, and if the spec is ambiguous or incomplete, open an issue labelled spec-question with gh issue create and stop. Run every check in CLAUDE.md's 'Before opening a PR' list before you push. When the work is done, open a pull request with gh pr create whose body says 'Closes #<issue>', cites the SPEC sections implemented, and states whether world output changes for a fixed seed."
