# Design reconciler, issue intake: label an issue "idea" whose body is a
# design doc (paste the markdown). Claude reconciles it against the code and
# opens a PR adding docs/design/<name>.md marked "accepted". The open PR is
# the proposal; merging it accepts the doc. See docs/design/README.md.
#
# For a doc that's already a file, use claude-docs.yml instead.
name: Claude design reconciler

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-idea-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Only ideas jtwaugh labeled
    if: |
      github.event.label.name == 'idea' &&
      github.event.sender.login == 'jtwaugh' &&
      (github.event.issue.user.login == 'jtwaugh' ||
       github.event.issue.user.login == 'claude[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Bun and the Claude CLI from the Actions cache (see the action)
      - id: claude-deps
        uses: ./.github/actions/claude-deps
      - id: schema
        run: echo "json=$(python3 -I .github/scripts/agent_results.py schema reconciler)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1, 2026-10-15
        with:
          path_to_bun_executable: ${{ steps.claude-deps.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.claude-deps.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: idea
          branch_prefix: design/
          track_progress: true
          include_comments_by_actor: jtwaugh,claude[bot]
          claude_args: |
            --max-turns 80
            --json-schema '${{ steps.schema.outputs.json }}'
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr create:*),Bash(cat:*),Bash(printf:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
            --append-system-prompt "You are the design reconciler. This issue's body is a new design idea. Follow .github/prompts/reconcile.md exactly (read it first): create docs/design/<short-kebab-name>.md containing the idea, reconciled against this repository, with status accepted and source set to this issue. Change no other file. Then open the pull request as that file describes, ending its body with 'Closes #<this issue>'. Your result: {\"pr\": <number>} for the pull request you opened, {\"no_pr\": \"<why>\"} if none was needed, or {\"needs_maintainer\": {\"kind\": \"decision|research|needs-you\", \"question\": ..., \"options\": [...]}} if you stopped. Commands: only the tools in your allowed list run, and nobody can approve others. Write commit messages and issue or PR bodies to a file with the Write tool, then pass the file (git commit -F <file>, gh pr create --body-file <file>); don't put heredocs or command substitution in a command. If a command is refused, use an allowed alternative, and if you still can't finish, say exactly what you couldn't do in your final message."

      - id: check
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/agent-result
        with:
          role: reconciler
          result: ${{ steps.claude.outputs.structured_output }}
          comment-on: ${{ github.event.issue.number }}
          marker: issue=${{ github.event.issue.number }}
          verify: ${{ github.event.issue.number }}
      # Refused commands and Claude's last message, in the job summary.
      - name: Report the run
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/claude-report
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          ok: ${{ steps.check.outputs.ok }}
          expected: ${{ steps.check.outputs.expected }}
          issue: ${{ github.event.issue.number }}
