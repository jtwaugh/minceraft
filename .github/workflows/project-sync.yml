# Keeps the factory's GitHub Project board in step with the repo.
#
# Sets each card's Status: Idea, Inbox, Approved, Submitted, Blocked, Nits, Ready for Merge,
# Done. The rules are in .github/scripts/project_sync.py. Every run
# recomputes the whole board, so a missed event is fixed by the next run,
# and a schedule catches anything no event covers.
#
# Setup (once):
# - Secret PROJECT_TOKEN: a classic personal access token with the `project`
#   scope. The project belongs to your account, so the workflow's own token
#   can't edit it.
# - Variable PROJECT_NUMBER: the number in the project's URL
#   (github.com/users/jtwaugh/projects/<number>).
# - The project's Status field has the options above, spelled exactly
#   (Idea and Submitted are optional; without them those cards go to
#   Inbox and Approved).
# Until both are set, the job is skipped.
name: Project sync

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["CI", "Claude reviewer", "Review gate", "PR size"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Each run rebuilds the whole board, so only the newest one matters.
concurrency:
  group: project-sync
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # labels a card dragged to Idea
  pull-requests: read
  checks: read
  statuses: read

jobs:
  sync:
    # Only with setup done; never for forks; for comments, only the
    # reviewer's verdicts and the maintainer's /override.
    if: |
      vars.PROJECT_NUMBER != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || contains(fromJSON('["claude[bot]", "jtwaugh"]'), github.event.comment.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Debounce. Every issue, PR, comment and workflow event starts a run,
      # and each run makes dozens of REST calls with the workflow token,
      # which shares a 1,000-requests-an-hour budget with every other
      # workflow here. On a busy night (592 runs in an hour) that ran out
      # and the review gate, reviewer and implementer failed with it. A
      # newer run cancels this one while it waits (cancel-in-progress), so
      # a burst of events makes one run's worth of calls.
      - name: Let a burst of events settle
        if: github.event_name != 'workflow_dispatch'
        run: sleep 90
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Update the board
        env:
          # Reads (and tickets.py, imported for dependency rules) use the
          # project token's own budget; only repo writes use the workflow token.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          WRITE_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
        run: |
          set -o pipefail  # so a failure isn't hidden by tee
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::Add the PROJECT_TOKEN secret (classic token, project scope)."
            exit 1
          fi
          python3 -B .github/scripts/project_sync.py | tee -a "$GITHUB_STEP_SUMMARY"
