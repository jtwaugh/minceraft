# Factory tick: one pass of the orchestrator (.github/scripts/factory_tick.py,
# docs/design/factory-orchestrator.md Phase A).
#
# The tick is level-triggered: it re-reads everything and writes only what
# differs, so a second tick straight after does nothing. The schedule is
# the heartbeat; events only make the next tick sooner, after a 60-second
# pause that lets a burst of them collapse into one tick. Reads go through
# .github/scripts/gh_cache.py, whose ETags are kept between ticks so an
# unchanged read is a free 304 (the reads use the maintainer's own token). It starts ready
# tickets (claude.yml), closes finished plans and asks for their phase-done
# PRs (claude-docs.yml), keeps the project board in step and keeps the
# "Factory: stalled work" issue up to date.
#
# Run by hand without writing anything:
#   gh workflow run factory-tick.yml -f dry-run=true
name: Factory tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the actions without applying them"
        required: false
        default: false
        type: boolean
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  # PR activity arrives through the PR workflows finishing, never through
  # pull_request events: those run the PR's own copy of this file, so an
  # unmerged change would tick live. workflow_run always uses master's.
  workflow_run:
    workflows: ["CI", "Claude reviewer", "Review gate", "PR size"]
    types: [completed]

# Ticks never overlap. A trigger during a run waits; GitHub keeps only the
# newest waiting run, which is fine since any tick re-reads everything.
concurrency:
  group: factory-tick
  cancel-in-progress: false

permissions:
  contents: write # pushes the store to the factory-state branch (master stays protected)
  issues: write
  pull-requests: write # drafts PRs whose ticket another PR closed (factory_supersede.py)
  actions: write # dispatches the implementer and the docs updater

jobs:
  tick:
    # For comments, only trusted accounts (the tick ignores the rest
    # anyway, so they needn't spend a run).
    if: github.event_name != 'issue_comment' || contains(fromJSON('["jtwaugh", "claude[bot]"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Secrets can't appear in a step's `if`, so the App ID comes through env.
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
    steps:
      # Let a burst settle before reading. Checks on a PR finish together,
      # and each finish is a trigger; while this tick waits they queue in
      # the concurrency group, which keeps only the newest, so a burst costs
      # one tick instead of five. Hand-started and scheduled ticks don't wait.
      - name: Let a burst of events settle
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        run: sleep 60
      # Always master's scripts, whatever the event, and the design docs the
      # stall pass reads (factory_tick.load_docs fails without them).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            docs/design
      # ETags from earlier ticks (.github/scripts/gh_cache.py): an unchanged
      # read comes back 304, which doesn't count against the rate limit.
      - name: Restore the read cache
        uses: actions/cache/restore@v5
        with:
          path: .factory-cache
          key: factory-http-none
          restore-keys: factory-http-
      # The state store (FACTORY.md, "Maintainer steps for the store"). The
      # tick publishes it to factory-state itself when it finishes (live
      # ticks only; a dry run works on a copy), so there is no publish step.
      - name: Fetch the store
        run: |
          python3 -B -c 'import sys; sys.path.insert(0, ".github/scripts"); import factory_state_branch as b; b.fetch(sys.argv[1])' \
            "$RUNNER_TEMP/factory-state.db"
      # A GitHub App token for the PRs the stalled-tickets pass opens, so
      # their workflows aren't held for approval (FACTORY.md, "Maintainer step
      # for the stray-branch PRs"). Skipped until the App's secrets exist.
      - name: Mint the app token
        id: app
        if: env.FACTORY_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Tick
        env:
          FACTORY_HTTP_CACHE: .factory-cache/etags.json
          FACTORY_STORE: ${{ runner.temp }}/factory-state.db
          # Identity for the store commit (git commit-tree needs one).
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # Reads use the project token's own budget; repo writes and
          # dispatches use the workflow token (WRITE_TOKEN).
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || github.token }}
          WRITE_TOKEN: ${{ github.token }}
          # Only open_pr uses it; empty (so unused) when the step was skipped.
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
          # Dispatched agent jobs go here while a matching runner is online,
          # else to ubuntu-latest (factory_runner.py).
          FACTORY_RUNNER: ${{ vars.FACTORY_RUNNER }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          set -o pipefail  # so a failure isn't hidden by tee
          python3 -B .github/scripts/factory_tick.py $DRY_RUN | tee -a "$GITHUB_STEP_SUMMARY"
      # Keyed by content, so a tick that read nothing new adds no cache entry
      # (and doesn't crowd CI's Rust caches out of the repo's cache budget).
      - name: Save the read cache
        if: ${{ !cancelled() && hashFiles('.factory-cache/etags.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .factory-cache
          key: factory-http-${{ hashFiles('.factory-cache/etags.json') }}
      # The alarm. A failed tick opens one "Factory: tick is failing" issue
      # assigned to the maintainer (so GitHub notifies them); the next good
      # tick closes it. This runs outside factory_tick.py, so it fires even
      # when the script can't start. Issues opened with the workflow token
      # trigger no workflows, so the alarm can't set off more ticks.
      # It can't catch ticks that never run at all: for that, run
      # .github/scripts/factory_health.py from outside GitHub (FACTORY.md).
      - name: Raise the alarm
        if: failure() && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Factory: tick is failing"' --json number -q '.[0].number')
          if [ -z "$open" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --assignee jtwaugh \
              --title "Factory: tick is failing" \
              --body "The factory tick failed: $RUN_URL

          Nothing is being started, merged or reported until it passes again. This issue closes itself on the next good tick.

          To see when it broke and why: \`python3 .github/scripts/factory_health.py\` (add \`--repro\` to run a dry tick locally)."
          fi
      - name: Clear the alarm
        if: success() && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Factory: tick is failing"' --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue close -R "$GITHUB_REPOSITORY" "$open" --comment "Recovered: $RUN_URL"
          fi
