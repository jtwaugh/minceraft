# Spec editor: turns the maintainer's answer to a spec question into a
# pull request against the spec it's about: SPEC.md, or the design doc named
# on the issue's "**File:**" line.
#
# On an issue labelled both "spec-question" and "decision", comment:
#   /decide A
#   optional reasoning on the following lines
#
# Claude writes the smallest change that records the decision and opens a PR
# that changes only that file and closes the issue. Merging a SPEC.md change
# runs the planner on the changed sections (see claude-plan.yml); for a
# design doc, run the planner on the affected phase yourself.
#
# "research" questions (what does the original do?) need work/ and are
# answered locally, not here.
name: Claude spec editor

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-spec-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  edit-spec:
    if: |
      github.event.sender.login == 'jtwaugh' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/decide') &&
      contains(github.event.issue.labels.*.name, 'spec-question') &&
      contains(github.event.issue.labels.*.name, 'decision')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Bun and the Claude CLI from the Actions cache (see the action)
      - id: claude-deps
        uses: ./.github/actions/claude-deps
      - id: schema
        run: echo "json=$(python3 -I .github/scripts/agent_results.py schema spec_editor)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1, 2026-10-15
        with:
          path_to_bun_executable: ${{ steps.claude-deps.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.claude-deps.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /decide
          branch_prefix: spec/
          track_progress: true
          include_comments_by_actor: jtwaugh,claude[bot]
          claude_args: |
            --max-turns 30
            --json-schema '${{ steps.schema.outputs.json }}'
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(cat:*),Bash(printf:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
            --append-system-prompt "You are the spec editor for this repository, the one agent allowed to edit SPEC.md and the design docs in docs/design/. The maintainer has answered the question in this issue with a /decide comment. Your job is to record that decision in the file it is about: the path on the issue's '**File:**' line, or SPEC.md if there is none. Rules: (1) Change only that one file. Touch no other file, not even CLAUDE.md or README.md. (2) Record the maintainer's decision, nothing more: a project policy or a clarification of wording. Never add facts about how the original game or its code behaves, not from memory and not as examples; if the decision seems to need such a fact, stop and say in the issue that it needs a research answer from the maintainer locally. (3) Make the smallest edit that removes the ambiguity, in the section the question is about, in the file's existing style. End the changed paragraph with '(Decided in #<issue>.)'. In a design doc, also remove the question from its Open questions section, keep the header intact, and follow docs/design/README.md. (4) If the decision means the code no longer matches the file, add nothing about the code; the planner will pick that up. (5) If the /decide comment is unclear or contradicts the options in the issue, don't edit anything; ask one question in the issue instead. When done, open a pull request with gh pr create titled 'SPEC <section>: <decision in a few words>' (or '<doc title> <section>: <decision>' for a design doc) whose body quotes the decision, explains the edit in one or two sentences, and says 'Closes #<issue>'. Your result: {\"pr\": <number>} for the pull request you opened, {\"no_pr\": \"<why>\"} if none was needed, or {\"needs_maintainer\": {\"kind\": \"decision|research|needs-you\", \"question\": ..., \"options\": [...]}} if you stopped. Commands: only the tools in your allowed list run, and nobody can approve others. Write commit messages and issue or PR bodies to a file with the Write tool, then pass the file (git commit -F <file>, gh pr create --body-file <file>); don't put heredocs or command substitution in a command. If a command is refused, use an allowed alternative, and if you still can't finish, say exactly what you couldn't do in your final message."

      - id: check
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/agent-result
        with:
          role: spec_editor
          result: ${{ steps.claude.outputs.structured_output }}
          comment-on: ${{ github.event.issue.number }}
          marker: issue=${{ github.event.issue.number }}
          verify: ${{ github.event.issue.number }}
      # Refused commands and Claude's last message, in the job summary.
      - name: Report the run
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/claude-report
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          ok: ${{ steps.check.outputs.ok }}
          expected: ${{ steps.check.outputs.expected }}
          issue: ${{ github.event.issue.number }}
