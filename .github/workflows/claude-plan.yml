# Planner: turns a section of SPEC.md, or a phase of an accepted design doc
# in docs/design/, into draft issues. Runs only on GitHub, so it sees the
# repo (specs, code, issues) and never work/ or the jar.
#
# It runs by itself when a change lands on master:
# - SPEC.md changed: plans the sections that changed.
# - a design doc changed (accepted, a decision recorded, a phase marked
#   done): plans that doc's next phase, if no plan exists for it yet. Phases
#   go one at a time, in header order; .github/scripts/plan_targets.py
#   decides.
#
# Or run it by hand from the Actions tab, or:
#   gh workflow run claude-plan.yml -f section="15"                        # SPEC.md section
#   gh workflow run claude-plan.yml -f file=docs/design/world-layout.md    # next phase
#   gh workflow run claude-plan.yml -f file=docs/design/world-layout.md -f section="Phase C"
#
# It opens issues labelled "planned". Read them, edit as needed, and add the
# "factory" label to the ones you want built, in dependency order.
name: Claude planner

on:
  push:
    branches: [master]
    paths: [SPEC.md, "docs/design/**"]
  workflow_dispatch:
    inputs:
      file:
        description: "Spec to plan from: SPEC.md or an accepted docs/design/*.md"
        required: false
        default: SPEC.md
        type: string
      section:
        description: "Section(s) or phase, e.g. 15, Part II, Phase A. Empty: a design doc's next phase."
        required: false
        type: string
      notes:
        description: "Optional guidance: priorities, what to leave out, size of tickets"
        required: false
        type: string
      before:
        description: "(Set by the push trigger) SPEC.md change to plan from: old commit"
        required: false
        type: string
      after:
        description: "(Set by the push trigger) SPEC.md change to plan from: new commit"
        required: false
        type: string

concurrency:
  # One planning run per target at a time. Push runs only dispatch, so each
  # gets its own group, and merge-started runs include the merge commit, so
  # GitHub (which keeps one pending run per group) never cancels one.
  group: claude-plan-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}', inputs.file, inputs.section, inputs.after) || github.run_id }}
  cancel-in-progress: false

jobs:
  # Decide what to plan: a list of {file, section}, possibly empty.
  # The Claude action doesn't run on push events, so on a push this job
  # only decides what to plan and starts one workflow_dispatch run per
  # target (runs started with GITHUB_TOKEN show github-actions[bot] as the
  # actor). Dispatch runs then plan.
  pick:
    if: contains(fromJSON('["jtwaugh", "github-actions[bot]"]'), github.actor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # starts the dispatch runs
      issues: write # closes a plan whose questions are all answered
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FILE: ${{ inputs.file }}
          SECTION: ${{ inputs.section }}
          BEFORE: ${{ github.event.before || inputs.before }}
          AFTER: ${{ github.event.after || inputs.after }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          targets=$(python3 -B .github/scripts/plan_targets.py)
          echo "### Planning" >> "$GITHUB_STEP_SUMMARY"
          echo "$targets" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = push ]; then
            # Hand each target to a dispatch run, which can run Claude. Any
            # failed dispatch fails this step, so nothing is dropped silently.
            set -euo pipefail
            while read -r t; do
              file=$(jq -r .file <<<"$t")
              section=$(jq -r .section <<<"$t")
              gh workflow run claude-plan.yml --repo "$REPO" --ref master \
                -f file="$file" -f section="$section" -f before="$BEFORE" -f after="$AFTER"
              echo "Started a planning run for $file $section" >> "$GITHUB_STEP_SUMMARY"
            done < <(jq -c '.[]' <<<"$targets")
            targets='[]'
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  plan:
    needs: pick
    if: needs.pick.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.pick.outputs.targets) }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          FILE: ${{ matrix.target.file }}
          SECTION: ${{ matrix.target.section }}
          NOTES: ${{ inputs.notes }}
          # Set when a SPEC.md merge started this run: the change to plan from.
          SPEC_BEFORE: ${{ inputs.before }}
          SPEC_AFTER: ${{ inputs.after }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Runs started by a merge come from this workflow's own token.
          allowed_bots: github-actions
          prompt: |
            REPO: ${{ github.repository }}

            You are the planner for this repository. Break one part of a
            spec into GitHub issues that an implementer agent will later
            pick up one at a time. You plan; you don't write code.

            The spec file is in the environment variable FILE (SPEC.md, or
            an accepted design doc under docs/design/), the section or phase
            to plan is in SECTION, and optional guidance from the maintainer
            is in NOTES. Read them with
            `printenv FILE SECTION NOTES SPEC_BEFORE SPEC_AFTER`.

            If FILE is a design doc, read docs/design/README.md too, and:
            - plan only SECTION, and skip any phase the header marks `done`;
            - plan nothing tagged `[external]`; list those items in the Plan
              issue under "Not planned here (external)". Game code is built
              in this repo; older docs' `[game]` tags just mean game code
              and are planned like anything else;
            - treat `[manual check]` criteria as notes for the maintainer,
              not as things a test must prove;
            - use the doc's Current state and Reconciliation notes, but
              check them against the code, since they may be out of date;
            - the doc's own Open questions that affect SECTION become
              `decision` issues (see Ambiguities);
            - Beta behaviour still comes only from SPEC.md. If the doc relies
              on a Beta fact SPEC.md doesn't state, that's a `research`
              question.

            If SECTION is empty, this run was started by a change to SPEC.md
            on master. Run `git diff "$SPEC_BEFORE" "$SPEC_AFTER" -- SPEC.md`
            and plan only the sections that diff touches, treating the new
            text as the decision to implement. Look for the
            "(Decided in #N.)" note: read issue #N for context, and mention it
            in each ticket. If the change needs no code change (the code
            already does what the spec now says), create no tickets, only the
            Plan issue saying so.

            ## Read first

            1. CLAUDE.md, especially the clean-room rules. They apply to you:
               every requirement you write must come from FILE (and, for Beta
               behaviour, SPEC.md). Never add detail from your own knowledge
               of Minecraft, even if you're sure of it.
            2. SECTION of FILE, and any sections it refers to.
            3. The code that already implements related behaviour, so you
               plan only what's missing or wrong. Note where code and spec
               disagree.
            4. Existing issues, open and closed:
               `gh issue list --state all --limit 300 --json number,title,labels,state`.
               Don't duplicate one. If an open issue already covers part of
               the work, reference it instead.

            ## Ambiguities

            Where the spec is ambiguous, incomplete or contradicts itself,
            don't guess. Open an issue that quotes the sentence, says what's
            unclear and lists the options as A, B, ..., and leave that part
            out of the tickets (or make the dependent ticket say
            "Blocked by #n"). Label it `spec-question` plus exactly one of:

            - `decision`: a choice about this project that can be made
              without knowing how the original game behaves (policy,
              trade-offs, which of two readings to adopt). Start the body
              with a line `**File:** <FILE>` and end it with:
              "Answer by commenting `/decide <option>` with any reasoning;
              the spec editor will draft the change to <FILE>."
            - `research`: answering needs facts about the original game's
              behaviour that SPEC.md doesn't state. End the body with:
              "Needs research from the maintainer's local spec lane."

            ## Tickets

            Each ticket is one pull request's worth of work: one spec
            subsection or less, typically under 300 changed lines, testable on
            its own. Order them so each builds on the ones before. Prefer more
            small tickets over fewer large ones.

            Create each with
            `gh issue create --label planned --title "<title>" --body-file <file>`,
            writing the body to a file first. Use this body format:

            ```
            **Spec:** SPEC <number> (<heading>), or for a design doc
                      <FILE> <phase> (<heading>), plus any SPEC sections it relies on
            **Depends on:** #<n>, or "none"

            ### What
            <2-6 sentences: the behaviour to implement or fix, in terms of the
            spec. Name the files likely to change.>

            ### Done when
            - [ ] <specific, checkable behaviour, each traceable to the spec>
            - [ ] Tests cover <what>, including an overlapping-regions
                  determinism test if the change affects generated blocks
            - [ ] CLAUDE.md "Before opening a PR" checks pass

            ### World output
            <"Unchanged", or what should change for a fixed seed and roughly
            how, e.g. "caves appear below y=64; surface unchanged".>

            ### Out of scope
            <what a reader might expect here but belongs to another ticket>
            ```

            Titles start with the spec number, e.g. "SPEC 11.5: big oak
            branch clusters", or for a design doc its short name and phase,
            e.g. "Layout A: radial base-height bias".

            ## Order of work

            Create the Plan issue first, before any ticket, so that a run
            that dies halfway still leaves the marker and is never planned
            twice. Then create the tickets and spec questions, then edit the
            Plan issue's body to list them, then attach them.

            The Plan issue is labelled `planned` and titled
            "Plan: SPEC <section>" (or "Plan: <doc title> <phase>" for a
            design doc). Its body starts with this line, exactly, which the
            pick step and the docs updater read:

            `<!-- plan-source file=<FILE> section=<SECTION> -->`

            Then three short parts: the build order as a numbered list of
            issue numbers with one line each on why that order; the
            spec-question issues; and any code/spec disagreements you found
            (plus, for a design doc, the `[external]` items not planned here).
            Don't use a `- [ ]` checklist; GitHub's sub-issue list tracks
            progress instead. Update the body with
            `gh issue edit <plan number> --body-file <file>`.

            Don't attach sub-issues yourself: after you finish, a workflow
            step attaches every ticket and spec question the Plan body
            mentions, in the order it mentions them. So make sure the body
            lists each one as `#<number>`, build order first, questions
            last. Before creating anything, check no *open* Plan issue
            with the same plan-source line exists; if one does, stop.
            Closed plans for the same section are history (for example a
            plan whose questions have since been answered): the pick step
            has already decided this section needs a new plan, so go ahead.

            If this run created no tickets, the Plan issue says why. If it
            also opened no spec questions (SECTION needs nothing built in
            this repo), close the Plan issue with
            `gh issue close <plan number> --reason completed`; the docs
            updater then marks the phase done and the next one is planned.

            Don't add the `factory` label to anything. The maintainer does
            that after reviewing.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Write,Bash(printenv:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(git log:*),Bash(git diff:*)"

      # Attach the plan's tickets and questions as sub-issues, from the
      # issue numbers in its body. Done here, not by Claude, so it always
      # happens and in a fixed order.
      - name: Attach sub-issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILE: ${{ matrix.target.file }}
          SECTION: ${{ matrix.target.section }}
        run: python3 -B .github/scripts/attach_subissues.py
