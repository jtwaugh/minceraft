# Reviewer: a fresh Claude session reviews each PR against SPEC.md and
# CLAUDE.md. It comments; it can't approve or merge. Its verdict ("Ready",
# "Ready, with nits" or "Blocked") becomes the review-verdict status
# (review-gate.yml), so a block stops the merge until it is fixed and
# re-reviewed, or the maintainer comments /override <reason>. The verdict
# is JSON against the reviewer schema (agent_results.py); this workflow
# validates it and posts the summary comment from it, with the JSON block
# the gate reads (decided in #1218). A re-review
# checks its earlier points and the new commits only, so fixing nits
# converges instead of turning up new ones on every push.
name: Claude reviewer

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    # Skip spec and design-doc PRs: if every changed file is one of these,
    # don't run. You review those yourself.
    paths-ignore:
      - SPEC.md
      - docs/design/**

concurrency:
  # A new push supersedes a review still in progress.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Public repo: review only PRs from branches in this repo (not forks),
    # opened by jtwaugh or the Claude app, and updated by them or by this
    # repo's own workflows (a conflict merge can be pushed as github-actions).
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["jtwaugh", "claude[bot]"]'), github.event.pull_request.user.login) &&
      contains(fromJSON('["jtwaugh", "claude[bot]", "github-actions[bot]"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      # Full history, so a re-review can diff from the commit it last
      # reviewed to the new head (git diff <old> <new>).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same toolchain as CI, so the reviewer can prove a defect with a
      # failing test instead of describing it.
      - uses: ./.github/actions/toolchain

      # Bun and the Claude CLI from the Actions cache (see the action)
      - id: claude-deps
        uses: ./.github/actions/claude-deps
      - id: schema
        run: echo "json=$(python3 -I .github/scripts/agent_results.py schema reviewer)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1, 2026-10-15
        with:
          path_to_bun_executable: ${{ steps.claude-deps.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.claude-deps.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No track_progress or use_sticky_comment: either one forces tag
          # mode, whose built-in prompt tells Claude to act on the newest
          # "@claude" comment. On a re-review after "@claude fix the nits"
          # that made the reviewer redo the implementer's job instead of
          # reviewing, and overwrite its previous verdict in the sticky
          # comment. With only `prompt`, the action runs in agent mode and
          # the prompt below is the whole task.
          # PRs opened or updated by the Claude app have it as the actor; the
          # if: above already limits runs to this repo's own PRs.
          allowed_bots: claude,github-actions
          include_comments_by_actor: jtwaugh,claude[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request. You did not write it. Read
            CLAUDE.md first, then the linked issue, then the diff.

            Earlier comments (`gh pr view --comments`) are context only:
            requests addressed to @claude are for the implementer, not you.
            You can't commit or push. Change files only to run a test, and
            put them back; your only output is the review.

            Use `gh pr diff` for the whole PR's diff.

            ## Re-reviews

            If you already posted a verdict on this PR (look for
            "Reviewed commit:" in `gh pr view --comments`), this is a
            re-review, and it works differently from a first review:

            - Start from your last verdict. For each blocker and nit in it,
              say in one line whether the new commits fixed it. If the
              maintainer or the implementer answered a point instead of
              changing the code ("leave it", "it's disclosed", "follow-up
              ticket #n"), drop it.
            - Review only what changed since the commit your last verdict
              names: `git diff <that commit> ${{ github.event.pull_request.head.sha }} -- <files>`,
              with the files `gh pr diff --name-only` lists, so a merge of
              master doesn't count as new work. Raise a new nit only about
              lines those commits added or changed.
            - A new blocker can be about anything in the PR, with evidence.
            - Never repeat a point you put under Notes, or said needed no
              change.

            A re-review that finds the old points fixed and nothing new is
            "Ready". That is the expected outcome, not a sign you missed
            something.

            Check, in this order:

            0. Scope. From the linked issue, note what it asks for and its "Out of
               scope" and "Files" sections. Judge the PR against that, not against
               what else the repo could contain. Work the issue puts out of scope
               is never a finding, and neither is its absence. Flag only work the
               ticket doesn't ask for (scope creep) or ticket requirements the PR
               skips.
            1. Clean room. Does anything look derived from Minecraft source
               rather than SPEC.md: structure, constants or names the spec
               doesn't give? Does the PR edit SPEC.md? Either is a blocker.
            2. Spec conformance. For each SPEC section the PR cites, read it
               and check the code does what it says, including the quirks the
               spec says to keep or drop. Flag behaviour the spec doesn't
               cover, and spec requirements the PR skips.
            3. Determinism. Can any block depend on region origin or size?
               Does a new feature have an overlapping-regions test?
            4. World output. If the change can alter blocks, heights, biomes
               or decoration for a fixed seed, does the PR description say so
               and explain why? An unannounced change is a blocker.
            5. CLAUDE.md invariants: terrain crate stays no_std with no
               runtime dependencies, constants live in data/*.toml, no new
               #[allow]s without a spec reason, viewer stays framework-free,
               batches_7_12.json not hand-edited.
            6. Tests: do they test the behaviour the spec describes, or only
               that the code runs?

            Don't comment on style that rustfmt or clippy already enforce,
            don't restate CI results, and don't comment on PR size (CI
            checks it). On the maintainer's own PRs (author jtwaugh), a short
            or missing description is fine: don't ask for one.

            ## Your verdict gates the merge

            "Blocked" turns the review-verdict check red; the maintainer then
            fixes the code or overrides you on the record. Block whenever a
            point meets the blocker bar below, and never otherwise. Don't
            soften a blocker into a nit to avoid stopping the merge, and don't
            promote a nit to make it heard. Use exactly one verdict:

            - Ready: nothing to fix. Notes are allowed.
            - Ready, with nits: only minor fixes. Nits never block.
            - Blocked: at least one blocker.

            A blocker is one of these, and nothing else:

            - a clean-room problem or an unannounced world-output change
              (checks 1 and 4);
            - a concrete defect: the file and line, the input or situation
              that triggers it, what happens, and what should happen;
            - something the PR claims or depends on that nobody has checked,
              such as a test it says it didn't run;
            - a test that is meant to guard a fix or a behaviour but still
              passes when that fix or behaviour is removed. Show it: undo the
              line, run the test, report that it passed, and restore the
              line.

            Everything else is a nit, however strongly you feel: naming, structure,
            taste, docs, test style. A nit must name something wrong or fragile in
            the code this PR changes, and say what to change. Don't list things the
            PR could additionally cover, files it doesn't touch, or "fine if X"
            observations. If a point is a question about intent, ask it in one line
            or leave it out. When in doubt, leave it out: "Ready" with no nits is
            a normal verdict.

            A point that needs no change is a note, not a nit: a disclosed
            shortcut, a deliberate choice, an assumption the PR states, a
            number the maintainer should know. So is any nit whose only fix
            would be a comment or a label explaining something. Notes never
            affect the verdict.

            Prove a defect when you can. Write a small test that fails on
            this PR (a file under crates/<crate>/tests/review_*.rs, or one
            in client/test/), run it with `cargo test` or `node --test`
            (client tests need `./build.sh` first), and paste the test and
            its failure into the blocker. Don't commit it; you can't push.
            If you can't make it fail, say so, and ask yourself whether it
            is really a blocker.

            Use inline comments for specific lines. Your result is the
            verdict: `{"verdict": "ready" | "ready with nits" | "blocked",
            "reviewed_commit": "${{ github.event.pull_request.head.sha }}",
            "blockers": [{"number": 1, "text": ...}], "nits": [...]}`, each
            blocker's text with its file and line and its evidence. This
            workflow posts the summary comment: the verdict, the reviewed
            commit, the numbered **Blockers** and **Nits** from your result,
            then the file `review.md` (write it with the Write tool in the
            repository root). Put in review.md only, on a re-review, a
            **Since last review** list (one line per earlier point: fixed,
            answered, or still open), then **Notes**, if any, and the checks
            you passed in one short line. Don't post a summary comment
            yourself.
          claude_args: |
            --max-turns 60
            --json-schema '${{ steps.schema.outputs.json }}'
            --allowedTools "Write,Edit,Bash(cargo test:*),Bash(./build.sh:*),Bash(node --test:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(cat:*),Bash(printf:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
            --append-system-prompt "Commands: only the tools in your allowed list run, and nobody can approve others. Write commit messages and issue or PR bodies to a file with the Write tool, then pass the file (git commit -F <file>, gh pr create --body-file <file>); don't put heredocs or command substitution in a command. If a command is refused, use an allowed alternative, and if you still can't finish, say exactly what you couldn't do in your final message."

      # The summary comment's text, from the result: the verdict and
      # reviewed-commit lines, the blockers and nits, then Claude's review.md.
      - name: Write the review comment
        id: review
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          out="$RUNNER_TEMP/review.md"
          : > "$out"
          printf '%s' "$RESULT" > "$RUNNER_TEMP/verdict.json"
          jq -r 'select(.verdict) |
            "Verdict: \(if .verdict == "blocked" or .verdict == "changes needed" then "Blocked"
                        elif .verdict == "ready with nits" then "Ready, with nits" else "Ready" end)",
            "Reviewed commit: `\(.reviewed_commit)`", "",
            (if (.blockers | length) > 0 then "**Blockers**", "",
              (.blockers[] | "\(.number). \(.text | gsub("\n"; "\n   "))"), "" else empty end),
            (if (.nits | length) > 0 then "**Nits**", "",
              (.nits[] | "\(.number). \(.text | gsub("\n"; "\n   "))"), "" else empty end)' \
            "$RUNNER_TEMP/verdict.json" >> "$out" 2>/dev/null || true
          [ -s "$out" ] && [ -f review.md ] && cat review.md >> "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
      # Claude exits "successfully" even when it gives up, so check for the
      # result itself; a miss fails the job (and says so where given).
      - name: Post the review
        id: result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/agent-result
        with:
          role: reviewer
          result: ${{ steps.claude.outputs.structured_output }}
          comment-on: ${{ github.event.pull_request.number }}
          marker: pr=${{ github.event.pull_request.number }} sha=${{ github.event.pull_request.head.sha }}
          header-file: ${{ steps.review.outputs.file }}
      - name: Check the run left its result
        id: check
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          VALID: ${{ steps.result.outputs.valid }}
          FILE: ${{ steps.result.outputs.file }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          reviewed=$(jq -r '.reviewed_commit // ""' "$FILE" 2>/dev/null || true)
          ok=false
          if [ "$VALID" = true ] && [ -n "$reviewed" ] && [[ "$HEAD" == "$reviewed"* ]]; then ok=true; fi
          { echo "ok=$ok"; echo "expected=a valid verdict for ${HEAD:0:7}"; } >> "$GITHUB_OUTPUT"
      - name: Report the run
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        uses: ./.github/actions/claude-report
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          ok: ${{ steps.check.outputs.ok }}
          expected: ${{ steps.check.outputs.expected }}
