<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2026; --muted: #5d6673; --line: #dfe3e8;
  --accent: #2f6fdb; --ok: #1f8a4c; --warn: #b26b00; --bad: #c4352b; --chip: #eef1f5;
  --okbg: #e6f4ec; --warnbg: #fdf1dc; --badbg: #fbe7e5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --ink: #e6e9ee; --muted: #9aa3af; --line: #2c323b;
    --accent: #6ea0ff; --ok: #4cc27f; --warn: #e6a23c; --bad: #ff6b5e; --chip: #242a32;
    --okbg: #16291f; --warnbg: #2e2412; --badbg: #331a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --ink: #e6e9ee; --muted: #9aa3af; --line: #2c323b;
  --accent: #6ea0ff; --ok: #4cc27f; --warn: #e6a23c; --bad: #ff6b5e; --chip: #242a32;
  --okbg: #16291f; --warnbg: #2e2412; --badbg: #331a18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12.5px; }
header .spacer { flex: 1; }
main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
/* Two independent columns, so a long list on one side never leaves a hole on the other. */
.cols { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.col { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; overflow: hidden; }
section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650;
  margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
section > h2 .count { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 0 8px;
  font-size: 12px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
section > h2 .hint { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; }
/* An empty section shrinks to its header line, so it doesn't weigh as much as a full one. */
section.none > h2 { border-bottom: 0; }
section.none > h2 .count { color: var(--muted); }
.empty { color: var(--muted); padding: 12px 14px; }
.item { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.item:first-of-type { border-top: 0; }
.row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
/* Title line: the title wraps inside itself so the time stays top-right. */
.row:has(> .when) { flex-wrap: nowrap; }
.row:has(> .when) > .title { flex: 1 1 auto; min-width: 0; }
.row .when { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.more > summary { border-top: 1px solid var(--line); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); }
.title { font-weight: 550; overflow-wrap: anywhere; }
.why { color: var(--muted); overflow-wrap: anywhere; }
.err { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--bad); overflow-wrap: anywhere; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600;
  background: var(--chip); white-space: nowrap; }
.pill.ok { background: var(--okbg); color: var(--ok); }
.pill.warn { background: var(--warnbg); color: var(--warn); }
.pill.bad { background: var(--badbg); color: var(--bad); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 7px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
a.btn { font-size: 12.5px; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 7px; padding: 4px 10px; text-decoration: none; }
a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.btn:hover { border-color: var(--accent); text-decoration: none; }
section.reports { background: transparent; border-style: dashed; }
section.reports .item { padding: 8px 14px; }
section.reports .why { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
section.reports .title { font-weight: 500; flex: none !important; white-space: nowrap; }
@media (max-width: 600px) { section.reports .row { flex-wrap: wrap; } }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
/* Alerts: a single line until opened. The colour is a left edge, not a filled block. */
.alert { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px; }
.alert.bad { border-left-color: var(--bad); }
.alert.warn { border-left-color: var(--warn); }
.alert > summary { padding: 8px 14px; color: var(--ink); display: flex; gap: 10px; align-items: baseline; list-style: none; }
.alert > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.alert > summary::-webkit-details-marker { display: none; }
.alert[open] > summary::before { transform: rotate(90deg); }
.alert.bad > summary b { color: var(--bad); } .alert.warn > summary b { color: var(--warn); }
.alert > summary .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.alert-body { padding: 2px 14px 12px 33px; display: grid; gap: 6px; }
main > .alert + .alert { margin-top: -10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); }
.stat { background: var(--panel); padding: 10px 14px; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: 12px; }
section > .stats { border-radius: 0 0 10px 10px; overflow: hidden; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog form { padding: 16px; display: grid; gap: 10px; }
dialog h3 { margin: 0; font-size: 15px; }
dialog p { margin: 0; color: var(--muted); }
dialog textarea { width: 100%; min-height: 110px; font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 8px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
dialog label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
dialog .actions { justify-content: flex-end; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }
details summary { cursor: pointer; color: var(--muted); padding: 10px 14px; }
details[open] > summary.h { border-bottom: 1px solid var(--line); }
summary.h .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
summary.h { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 650; }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span id="tickpill" class="pill">loading</span>
  <span class="meta" id="meta">Reading GitHub; the first read takes about a minute.</span>
  <span class="spacer"></span>
  <button id="refresh" type="button">Refresh</button>
  <button id="theme" type="button" title="Switch light/dark">Theme</button>
</header>
<main id="main"></main>

<dialog id="dlg">
  <form method="dialog" id="dlgform">
    <h3 id="dlgtitle"></h3>
    <p id="dlgtext"></p>
    <textarea id="dlgbody"></textarea>
    <label id="dlgclosewrap"><input type="checkbox" id="dlgclose" checked> <span id="dlgclosetext"></span></label>
    <div class="actions">
      <button value="cancel" type="submit">Cancel</button>
      <button value="ok" class="primary" type="submit" id="dlgok">Send</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const CFG = /*CONFIG*/{};
const GH = `https://github.com/${CFG.repo || "jtwaugh/minceraft"}`;
let last = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 120) return `${m} min ago`;
  if (m < 2880) return `${Math.floor(m / 60)} h ${m % 60} min ago`;
  return `${Math.floor(m / 1440)} days ago`;
};
const clock = iso => iso ? new Date(iso).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"}) : "";
const issue = n => `<a href="${GH}/issues/${n}" target="_blank" rel="noopener">#${n}</a>`;
const pr = n => `<a href="${GH}/pull/${n}" target="_blank" rel="noopener">#${n}</a>`;
const btn = (label, act, cls = "") => CFG.readOnly ? "" :
  `<button type="button" class="${cls}" data-act='${esc(JSON.stringify(act))}'>${esc(label)}</button>`;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3500);
}

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Dashboard-Token": CFG.token},
    body: JSON.stringify(body || {})});
  return r.json().catch(() => ({ok: false, message: `HTTP ${r.status}`}));
}

// One confirm dialog for every write: shows exactly what will be posted.
function confirmAct(a) {
  const d = document.getElementById("dlg");
  document.getElementById("dlgtitle").textContent = a.title;
  document.getElementById("dlgtext").textContent = a.text || "";
  const body = document.getElementById("dlgbody");
  body.style.display = a.body !== undefined ? "" : "none";
  body.value = a.body || "";
  const cw = document.getElementById("dlgclosewrap");
  cw.style.display = a.alsoClose ? "" : "none";
  document.getElementById("dlgclosetext").textContent = a.alsoClose ? `Also close question #${a.alsoClose}` : "";
  document.getElementById("dlgclose").checked = true;
  document.getElementById("dlgok").textContent = a.ok || "Send";
  d.returnValue = "";
  d.showModal();
  d.onclose = async () => {
    if (d.returnValue !== "ok") return;
    const steps = [];
    if (a.op) steps.push(a.op);
    if (a.action === "comment") steps.push({action: "comment", number: a.number, body: body.value});
    if (a.action === "close") steps.push({action: "close", number: a.number, reason: a.reason, comment: a.body !== undefined ? body.value : ""});
    if (a.action === "label") steps.push({action: "label", number: a.number, label: a.label});
    if (a.alsoClose && document.getElementById("dlgclose").checked)
      steps.push({action: "close", number: a.alsoClose, reason: "completed", comment: a.closeNote || ""});
    let last = "";
    for (const s of steps) {
      const r = await post("/api/act", s);
      if (!r.ok) { toast(s.number ? `Failed on #${s.number}: ${r.message}` : `Failed: ${r.message}`); return; }
      last = r.message;
    }
    toast(a.op ? (last || "Done.") : `Done. Shown here now; GitHub confirms it on the next read.`);
    poll();
  };
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (b) confirmAct(JSON.parse(b.dataset.act));
});

// ---- builders for each kind of waiting item
function needsYouActions(i) {
  const out = [];
  if (i.type === "factory-question" && i.ticket) {
    out.push(btn(`Retry #${i.ticket} with @claude`, {
      action: "comment", number: i.ticket, title: `Comment on ticket #${i.ticket}`,
      text: "Posts this as you. An @claude comment starts the implementer on the ticket.",
      body: `@claude Implement this ticket. Earlier runs ended without a pull request.`,
      alsoClose: i.number, closeNote: `Retried via @claude on #${i.ticket} (factory dashboard).`, ok: "Post comment"}, "primary"));
    out.push(btn(`Build it myself (label local)`, {
      action: "label", number: i.ticket, label: "local", title: `Label #${i.ticket} local`,
      text: "The factory stops starting this ticket; you build it in a local session.",
      alsoClose: i.number, closeNote: `Building #${i.ticket} locally (factory dashboard).`, ok: "Add label"}));
  } else if (i.type === "factory-question" && i.pr) {
    out.push(btn(`Ask @claude on PR #${i.pr}`, {
      action: "comment", number: i.pr, title: `Comment on PR #${i.pr}`,
      text: "Posts this as you. Say what Claude should do.", body: "@claude ",
      alsoClose: i.number, closeNote: `Answered on #${i.pr} (factory dashboard).`, ok: "Post comment"}, "primary"));
  } else if (i.type === "spec-question" && !i.research) {
    for (const [letter, text] of i.options)
      out.push(btn(`/decide ${letter}`, {
        action: "comment", number: i.number, title: `Decide #${i.number}: option ${letter}`,
        text: text.replace(/[*`]/g, ""), body: `/decide ${letter}`, ok: "Post decision"}));
    if (!i.options.length)
      out.push(btn("/decide …", {action: "comment", number: i.number, title: `Decide #${i.number}`,
        text: "Posts this as you; the spec editor opens the PR.", body: "/decide ", ok: "Post decision"}));
  } else if (i.type === "pr") {
    out.push(`<a class="btn primary" href="${GH}/pull/${i.number}/files" target="_blank" rel="noopener">Review the diff ↗</a>`);
    out.push(btn("Approve & merge", {op: {action: "approve-merge", number: i.number}, title: `Approve and merge PR #${i.number}`,
      text: "Approves the PR as you with no comment, then merges it (merge commit). If it's your own PR, GitHub won't take " +
        "the approval, so it just merges.", ok: "Approve & merge"}, "primary"));
    out.push(btn("Ask @claude to review", {action: "comment", number: i.number, title: `Ask Claude to review PR #${i.number}`,
      text: "Posts this as you. An @claude comment starts Claude on the PR; it replies there.",
      body: "@claude Review this PR: say whether it's ready to merge, and list anything that should change first.", ok: "Post comment"}));
    out.push(btn("Comment", {action: "comment", number: i.number, title: `Comment on PR #${i.number}`, body: "", ok: "Post comment"}));
    out.push(btn("Close PR", {action: "close", number: i.number, reason: "not_planned", title: `Close PR #${i.number}`,
      text: "Closes the PR without merging.", body: "", ok: "Close"}));
  } else if (i.type === "unapproved") {
    out.push(btn("Approve (label factory)", {action: "label", number: i.number, label: "factory",
      title: `Approve ticket #${i.number}`, text: "Adds the factory label; the tick starts it once its dependencies close.", ok: "Approve"}, "primary"));
  }
  if (i.kind === "issue") {
    out.push(btn("Comment", {action: "comment", number: i.number, title: `Comment on #${i.number}`, body: "", ok: "Post comment"}));
    if (i.type === "factory-question" || i.type === "unapproved")
      out.push(btn("Close", {action: "close", number: i.number, reason: i.type === "unapproved" ? "not_planned" : "completed",
        title: `Close #${i.number}`, text: i.type === "unapproved" ? "Closes the ticket as not planned." :
        "Closing a no-PR question does not restart its ticket; use Retry for that.", body: "", ok: "Close"}));
  }
  return out.join("");
}

function render(p) {
  const d = p.data, main = document.getElementById("main");
  const pill = document.getElementById("tickpill"), meta = document.getElementById("meta");
  const parts = [];
  if (p.error) parts.push(`<details class="alert bad"><summary><b>Couldn't refresh</b><span class="meta">${d ? "showing the last good read" : ""}</span></summary>
    <div class="alert-body"><div class="err">${esc(p.error)}</div></div></details>`);
  if (!d) {
    pill.className = "pill"; pill.textContent = p.busy ? "reading" : "no data";
    main.innerHTML = parts.join("") || `<div class="empty">Reading GitHub…</div>`;
    return;
  }
  const h = d.health || {};
  const stale = h.latest && (Date.now() - new Date(h.latest.at)) > 12 * 3600e3;
  const tickState = !h.latest ? ["bad", "no ticks"] : h.workflow_state !== "active" ? ["bad", "tick disabled"]
    : h.failing ? ["bad", `tick failing ×${h.failing}`] : stale ? ["bad", "tick stale"] : ["ok", "tick healthy"];
  pill.className = `pill ${tickState[0]}`; pill.textContent = tickState[1];
  meta.textContent = `${d.repo} · read ${ago(d.generated_at)}${p.busy ? " · reading now…" : ""} · ` +
    `${d.requests} reads, ${d.not_modified} free` + (p.pending ? ` · ${p.pending} change(s) not yet confirmed` : "") + (d.rate ? ` · API ${d.rate.remaining}/${d.rate.limit} left` : "");

  const when = iso => iso ? `<span class="when" title="${esc(clock(iso))}">${esc(ago(iso))}</span>` : "";
  // Alerts: one line each, open for the detail and what to do about it.
  const alert = (cls, head, meta, body, actions = []) => `<details class="alert ${cls}"><summary><b>${head}</b>` +
    `${meta ? `<span class="meta">${meta}</span>` : ""}</summary><div class="alert-body">${body}` +
    `${actions.filter(Boolean).length ? `<div class="actions">${actions.join("")}</div>` : ""}</div></details>`;
  const investigate = topic => btn("Investigate locally", {op: {action: "investigate", topic},
    title: "Investigate in a local Claude", ok: "Open Terminal",
    text: "Opens Terminal in your minceraft checkout and starts Claude with what this alert knows. " +
      "It's told to investigate only, and never to run a live tick."}, "primary");
  const tickNow = btn("Run the tick now", {op: {action: "tick-run"}, title: "Run the factory tick now", ok: "Run it",
    text: "Dispatches factory-tick.yml, live, as you."});
  const runId = u => +(/\/runs\/(\d+)/.exec(u || "") || [])[1] || 0;
  const runs = d.agent_runs || [];

  if (h.workflow_state && h.workflow_state !== "active")
    parts.push(alert("bad", "Tick disabled", esc(h.workflow_state), "Nothing ticks until it's enabled again.", [
      btn("Enable the tick", {op: {action: "tick-enable"}, title: "Enable factory-tick.yml", ok: "Enable",
        text: "Turns the scheduled tick back on."}, "primary"), investigate("tick")]));
  if (h.failing && h.first_failure) {
    const f = h.first_failure, rid = (h.latest && h.latest.id) || runId(h.latest && h.latest.url);
    parts.push(alert("bad", "Tick failing", `since ${esc(clock(f.at))} · ${h.failing} in a row`,
      `<div class="err">${(f.why || []).map(esc).join("<br>") || "No error captured."}</div>
       <div class="why"><a href="${esc(f.url)}" target="_blank" rel="noopener">First failed run</a>${h.latest && h.latest.url !== f.url ?
         ` · <a href="${esc(h.latest.url)}" target="_blank" rel="noopener">latest</a>` : ""}</div>`,
      [investigate("tick"), rid ? btn("Re-run the latest", {op: {action: "rerun", runs: [rid]}, title: "Re-run the failed tick",
        ok: "Re-run", text: "Re-runs the failed jobs of the latest tick, live, as you. Worth it for a flake; a real fault fails again."}) : "", tickNow]));
  } else if (stale)
    parts.push(alert("bad", "Tick stale", `none for ${esc(ago(h.latest.at).replace(" ago", ""))}`,
      "Scheduled runs may have been dropped.", [tickNow, investigate("tick")]));

  const lost = runs.filter(r => /lost communication/i.test(r.error || ""));
  if (lost.length >= 2) {
    const names = [...new Set(lost.map(r => r.runner).filter(Boolean))].join(", ") || "self-hosted runner";
    // FACTORY_RUNNER holds JSON: "warm" or ["self-hosted", "x"]. Show it without the quoting.
    const label = v => { try { const j = JSON.parse(v); return Array.isArray(j) ? j.join(", ") : String(j); } catch (e) { return v; } };
    const cur = (d.runner || {}).value && label(d.runner.value), prev = p.prev_runner && label(p.prev_runner);
    parts.push(alert("warn", "Runner dropping", `${lost.length} of the last ${runs.length} agent runs · ${esc(names)}`,
      `${lost.map(r => `<div class="row"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${when(r.at)}</div>`).join("")}
       <div class="why">Agents run on ${cur ? `<code>${esc(cur)}</code>` : "GitHub-hosted <code>ubuntu-latest</code>"}.</div>`,
      [investigate("runner"),
       btn(`Re-run ${lost.length} dropped`, {op: {action: "rerun", runs: lost.map(r => r.id)}, title: "Re-run the dropped runs", ok: "Re-run",
         text: `Re-runs the failed jobs of ${lost.length} run(s), live, as you. They go wherever FACTORY_RUNNER points now.`}),
       cur ? btn("Use GitHub-hosted runners", {op: {action: "runner", to: "hosted"}, title: "Switch agents to ubuntu-latest", ok: "Switch",
         text: `Deletes the FACTORY_RUNNER variable (now ${cur}), so agent runs go to ubuntu-latest. This page offers to switch back until it restarts.`}) : "",
       !cur && prev ? btn(`Switch back to ${prev}`, {op: {action: "runner", to: "back"}, title: `Point agents at ${prev} again`, ok: "Switch back",
         text: `Sets FACTORY_RUNNER back to ${prev}.`}) : ""]));
  }
  if (d.next_tick && d.next_tick.crashed.length)
    parts.push(alert("bad", "Tick pass crashes", `${d.next_tick.crashed.length} in the dry run`,
      d.next_tick.crashed.map(c => `<div>${esc(c.pass)}: <span class="err">${esc(c.error)}</span></div>`).join(""), [investigate("tick")]));
  for (const e of d.errors || []) parts.push(alert("warn", "Partial read", "part of the page couldn't be read", `<div class="err">${esc(e)}</div>`));

  // Overview numbers.
  // The tick's own tracker issues (e.g. "Factory: stalled work") sit in the needs-you list,
  // but they're reports, not things blocking work: shown apart and left out of the counts.
  const isReport = i => i.kind === "issue" && i.type === "other" && /^Factory: /.test(i.title || "");
  const prBy = Object.fromEntries((d.open_prs || []).map(p => [p.number, p]));
  const allNy = (d.needs_you || []).map(i => i.kind === "pr" && prBy[i.number]
    ? {...i, title: i.title || prBy[i.number].title, created_at: i.created_at || prBy[i.number].created_at, prInfo: prBy[i.number]} : i);
  const reports = allNy.filter(isReport), ny = allNy.filter(i => !isReport(i));
  const st = d.started || [], bl = d.blocked || [], prs = d.open_prs || [];
  const failedRuns = runs.filter(r => ["failure", "timed_out", "startup_failure"].includes(r.conclusion)).length;
  const activeRuns = runs.filter(r => r.status !== "completed").length;
  parts.push(`<section><h2>Overview</h2><div class="stats">
    <div class="stat"><div class="k">Last tick</div><div class="v">${h.latest ? esc(ago(h.latest.at)) : "–"}</div>
      <div class="s">${h.latest ? `<a href="${esc(h.latest.url)}" target="_blank" rel="noopener">${esc(h.latest.conclusion)}</a> · ${esc(h.latest.event)}` : ""}</div></div>
    <div class="stat"><div class="k">Waiting on you</div><div class="v">${ny.length}</div><div class="s">${ny.filter(i => i.blocks).length} block other tickets</div></div>
    <div class="stat"><div class="k">Agent runs active</div><div class="v">${activeRuns}</div><div class="s">${failedRuns} failed of the last ${runs.length}</div></div>
    <div class="stat"><div class="k">Open PRs</div><div class="v">${prs.length}</div><div class="s">${bl.length} blocked</div></div>
    <div class="stat"><div class="k">Ticks, last 48 h</div><div class="v">${h.ticks_48h ?? "–"}</div><div class="s">longest gap ${h.longest_gap_h ?? "–"} h</div></div>
  </div></section>`);

  // A section with a count; an empty one collapses to its header line.
  const card = (title, items, none) => items.length
    ? `<section><h2>${title} <span class="count">${items.length}</span></h2>${items.join("")}</section>`
    : `<section class="none"><h2>${title} <span class="count">0</span><span class="hint">${esc(none)}</span></h2></section>`;
  const left = [], right = [];

  // The second line of a waiting item: a pill for what kind of ask it is, then the detail.
  const nyLead = i => {
    if (i.type === "pr") {
      const p = i.prInfo || {}, fromIssue = /issue-(\d+)/.exec(p.head || "");
      const external = /^Not a factory ticket/.test(i.reason);
      const detail = external ? "Not from the factory, so nothing merges it for you." : i.reason;
      return `<span class="pill warn">needs review</span><span class="why">${esc(detail)}` +
        `${fromIssue ? ` · from ${issue(fromIssue[1])}` : ""}${p.head && p.head !== i.title ? ` · ${esc(p.head)}` : ""}</span>`;
    }
    return `<span class="why">${esc(i.reason)}${i.ticket ? ` · ticket ${issue(i.ticket)}` : ""}</span>`;
  };

  // Needs you.
  left.push(card("Waiting on you", ny.map(i => `
    <div class="item">
      <div class="row"><span class="num">${i.kind === "pr" ? pr(i.number) : issue(i.number)}</span>
        <span class="title">${esc(i.title || "(untitled)")}</span>${when(i.created_at)}</div>
      <div class="row">${i.blocks ? `<span class="pill warn">blocks ${i.blocks}</span>` : ""}${nyLead(i)}</div>
      <div class="actions">${needsYouActions(i)}</div>
    </div>`), "Nothing waits on you."));
  if (reports.length)
    left.push(`<section class="reports">${reports.map(r => `<div class="item"><div class="row">
      <span class="pill">report</span><span class="num">${issue(r.number)}</span><span class="title">${esc(r.title)}</span>
      <span class="why">tracker the tick keeps; not a blocker</span>${when(r.created_at)}</div></div>`).join("")}</section>`);

  // Started tickets with no PR.
  const stLabel = {running: ["ok", "building"], starting: ["ok", "starting"], "open-pr": ["warn", "opening PR"],
    restart: ["warn", "restarts next tick"], asked: ["bad", "question open"], ask: ["bad", "asks next tick"]};
  left.push(card("Started, no PR yet", st.map(t => {
    const [cls, word] = t.stuck ? ["bad", "STUCK"] : (stLabel[t.state] || ["", t.state]);
    return `<div class="item"><div class="row"><span class="num">${issue(t.number)}</span><span class="title">${esc(t.title)}</span>${when(t.last_started)}</div>
      <div class="row"><span class="pill ${cls}">${esc(word)}</span><span class="why">start ${t.starts} of ${t.budget}</span></div></div>`;
  }), "None."));

  // Open PRs.
  const verdict = p => p.failed.length ? ["bad", `failed: ${p.failed.join(", ")}`] : p.mergeable === "dirty" ? ["bad", "conflict"]
    : p.pending ? ["", "checks running"] : p.verdict === "ready" ? ["ok", "ready"] : p.verdict === "nits" ? ["warn", "nits"]
    : p.verdict === "blocked" ? ["bad", "reviewer blocked"] : p.draft ? ["", "draft"] : ["", p.verdict || "open"];
  left.push(card("Open PRs", prs.map(p => {
    const [cls, word] = verdict(p);
    return `<div class="item"><div class="row"><span class="num">${pr(p.number)}</span><span class="title">${esc(p.title)}</span>${when(p.created_at)}</div>
      <div class="row"><span class="pill ${cls}">${esc(word)}</span>${p.head !== p.title ? `<span class="why">${esc(p.head)}</span>` : ""}</div></div>`;
  }), "No open PRs."));

  // Blocked PRs.
  const blCls = {fixing: "ok", queued: "ok", you: "", waiting: "bad", stuck: "bad"};
  left.push(card("Blocked PRs", bl.map(b => `
    <div class="item"><div class="row"><span class="num">${pr(b.number)}</span><span class="title">${esc(b.title)}</span></div>
      <div class="row"><span class="pill ${blCls[b.state] || ""}">${esc(b.cause)}</span><span class="why">${esc(b.what)}${b.ticket ? ` · ticket ${issue(b.ticket)}` : ""}</span></div></div>`),
    "Nothing blocked."));

  // Agent runs: the newest few, older ones folded away.
  const SHOW = 10;
  const runCls = r => r.status !== "completed" ? ["ok", r.status] : r.conclusion === "success" ? ["", "success"]
    : r.conclusion === "cancelled" ? ["", "cancelled"] : ["bad", r.conclusion];
  const runRows = runs.map(r => {
    const [cls, word] = runCls(r);
    return `<div class="item"><div class="row">
      <a class="title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${when(r.at)}</div>
      <div class="row"><span class="pill ${cls}">${esc(word)}</span><span class="why">${esc(r.workflow)}${r.runner ? ` · ${esc(r.runner)}` : ""}</span></div>
      ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}</div>`;
  });
  const older = runRows.slice(SHOW);
  const olderFailed = runs.slice(SHOW).filter(r => runCls(r)[0] === "bad").length;
  right.push(`<section${runs.length ? "" : ` class="none"`}><h2>Recent agent runs <span class="count">${runs.length}</span>
    ${runs.length ? "" : `<span class="hint">None.</span>`}</h2>${runRows.slice(0, SHOW).join("")}
    ${older.length ? `<details class="more"><summary>${older.length} older run(s)${olderFailed ? `, ${olderFailed} failed` : ""}</summary>${older.join("")}</details>` : ""}</section>`);

  // Next tick.
  const acts = (d.next_tick && d.next_tick.actions) || [];
  const link = t => { const [k, n] = t.split("#"); return /^\d+$/.test(n) ? (k === "pr" ? pr(n) : issue(n)) : esc(t); };
  right.push(`<section><details${acts.length && acts.length <= 12 ? " open" : ""}><summary class="h">Next tick would do ${acts.length} thing(s)
    <span class="sub">· dry run, nothing written</span></summary>
    ${acts.map(a => `<div class="item"><div class="row"><span class="pill">${esc(a.kind)}</span><span class="num">${link(a.target)}</span>
      <span class="why">${esc(a.reason)}</span></div></div>`).join("") || `<div class="empty">Nothing to do.</div>`}</details></section>`);

  parts.push(`<div class="cols"><div class="col">${left.join("")}</div><div class="col">${right.join("")}</div></div>`);

  main.innerHTML = parts.join("");
}

async function poll() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    last = await r.json();
    render(last);
  } catch (e) {
    document.getElementById("meta").textContent = "The dashboard server isn't answering. Is serve.py still running?";
  }
}

document.getElementById("refresh").onclick = async () => {
  await post("/api/refresh");
  toast("Reading GitHub now; takes about a minute.");
  setTimeout(poll, 500);
};
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
setInterval(() => { if (last) render(last); }, 30000); // keep "x min ago" current
setInterval(poll, 10000);  // local and cheap: GitHub is only read every few minutes
poll();
</script>
</body>
</html>
