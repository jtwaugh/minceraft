[package]
name = "layout"
version = "0.1.0"
edition = "2021"
description = "World layout bias terms built on the terrain generator (std; not part of the wasm)"

[features]
default = ["toml-io"]
# Run-time TOML reading and writing (level files, `from_toml` entry points).
# Off for the wasm build; the shipped data is parsed by build.rs instead.
toml-io = ["dep:serde", "dep:toml"]

[dependencies]
terrain = { path = "../terrain" }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.5", optional = true }

[[bin]]
name = "mince-seeds"
path = "src/bin/mince-seeds.rs"
required-features = ["toml-io"]

[[example]]
name = "find_v0"
required-features = ["toml-io"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.5"

[lints]
workspace = true
