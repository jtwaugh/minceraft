<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Viewer</title>
<style>
  :root {
    --bg: #15171a; --panel: #1e2125; --line: #30353b; --text: #d8dde3;
    --muted: #8a939d; --accent: #7fb35a; --warn: #e0a84a; --marker: #ff5a4a;
    --scrim: rgba(16, 18, 20, 0.78);
    /* both stages share this height; the map is this square */
    --stage: clamp(300px, min(calc(100vh - 170px), calc((100vw - 48px) * 0.42)), 640px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0 8px 0 0; letter-spacing: .04em; }
  header .end { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  #warn { color: var(--warn); }
  label { color: var(--muted); }
  input {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 6px; font: inherit; width: 90px;
  }
  input#seed { width: 160px; }
  button {
    background: var(--accent); color: #10140c; border: 0; border-radius: 4px;
    padding: 5px 12px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 4px 10px; }
  a { color: var(--accent); }

  main {
    display: grid; grid-template-columns: var(--stage) minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start;
  }
  @media (max-width: 900px) {
    :root { --stage: min(calc(100vw - 32px), 640px); }
    main { grid-template-columns: minmax(0, 1fr); }
  }
  /* Both panels: toolbar, stage, footer. */
  .panel { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .stage {
    position: relative; height: var(--stage); overflow: hidden;
    border: 1px solid var(--line); border-radius: 4px; background: #101214;
  }
  #mapstage { width: var(--stage); }
  .footer { min-height: 2.8em; color: var(--muted); }
  canvas { display: block; width: 100%; height: 100%; }
  #map { image-rendering: pixelated; cursor: crosshair; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #sel {
    position: absolute; border: 2px solid #fff; pointer-events: none;
    box-shadow: 0 0 0 1px #000; display: none;
  }
  #gl { cursor: grab; background: #9cc3e6; }
  #gl:active { cursor: grabbing; }
  #flyout { display: none; object-fit: contain; }
  .flying #gl, .flying #sel, .flying #label3d, .flying #hint { display: none !important; }
  .flying #flyout { display: block; }

  /* Small labels laid over the stages. */
  .tag {
    position: absolute; background: var(--scrim); padding: 3px 8px; border-radius: 4px;
    pointer-events: none; white-space: nowrap; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis;
  }
  #hover { left: 8px; bottom: 8px; display: none; }
  #label3d { left: 8px; top: 8px; }
  #hint { left: 50%; bottom: 8px; transform: translateX(-50%); color: var(--muted); transition: opacity .8s; }
  #hint.gone { opacity: 0; }
  #flymsg { left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: normal; text-align: center; }
  #flymsg:empty { display: none; }

  /* Flyover transport, video-player style along the bottom of the stage. */
  .transport {
    position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; align-items: center; gap: 10px;
    background: var(--scrim); padding: 6px 10px; border-radius: 6px;
  }
  .flying .transport { display: flex; }
  .transport button { min-width: 64px; }
  .seek { position: relative; flex: 1; min-width: 80px; }
  .seek input { width: 100%; padding: 0; margin: 0; display: block; accent-color: var(--accent); }
  .seek .tick { position: absolute; top: 100%; width: 2px; height: 5px; margin-left: -1px; background: var(--marker); pointer-events: none; }
  #flytime { color: var(--muted); white-space: nowrap; }

  .modes { display: flex; gap: 0; }
  .modes button {
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
    border-radius: 0; font-weight: 400; padding: 4px 10px;
  }
  .modes button:first-child { border-radius: 4px 0 0 4px; }
  .modes button:last-child { border-radius: 0 4px 4px 0; }
  .modes button + button { border-left: 0; }
  .modes button[aria-pressed="true"] { background: var(--accent); color: #10140c; font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px;
    vertical-align: -1px; background: var(--c); border-radius: 2px;
  }
  .legend .scale { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; width: 100%; }
  .legend .scale::before { display: none; }
  .legend .bar { grid-column: 1 / -1; height: 12px; border-radius: 2px; background: var(--g); }
  .legend .mid { text-align: center; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 400; }

  /* Flyover route: the island, then the features numbered as on the map. */
  .route { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .route b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .route button { background: var(--bg); color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 2px 8px; }
  .route button i { font-style: normal; color: var(--marker); margin-right: 4px; }

  /* Timings and counts, for development. */
  #dev { margin: 0 16px 16px; color: var(--muted); }
  #dev summary { cursor: pointer; width: max-content; }
  #dev dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 8px 0 0; }
  #dev dt { color: var(--muted); }
  #dev dd { margin: 0; color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>BETA TERRAIN</h1>
  <label>seed <input id="seed" value="12345"></label>
  <label>x <input id="x0" type="number" value="0" step="64"></label>
  <label>z <input id="z0" type="number" value="0" step="64"></label>
  <button id="go">regenerate</button>
  <div class="end">
    <span id="warn" hidden></span>
    <span id="busy"></span>
    <button id="devbtn" class="ghost" title="timings and counts">stats</button>
  </div>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <div class="modes" role="group" aria-label="map mode">
        <button data-mode="terrain" aria-pressed="true">terrain</button>
        <button data-mode="biome" aria-pressed="false">biome</button>
        <button data-mode="temperature" aria-pressed="false">temperature</button>
        <button data-mode="humidity" aria-pressed="false">humidity</button>
        <button data-mode="habitat" aria-pressed="false">habitat</button>
      </div>
    </div>
    <div class="stage" id="mapstage">
      <canvas id="map" width="512" height="512" title="1024×1024 blocks, 2 per pixel. Click to show that spot in 3D."></canvas>
      <canvas id="overlay" width="512" height="512"></canvas>
      <div id="sel"></div>
      <div id="hover" class="tag"></div>
    </div>
    <div class="footer legend" id="legend"></div>
  </section>
  <section class="panel" id="view3d">
    <div class="toolbar">
      <div class="modes" role="group" aria-label="3D view">
        <button data-view="preview" aria-pressed="true">chunk preview</button>
        <button data-view="flyover" aria-pressed="false" title="find an island near the map and fly a tour of the terrain around it">flyover</button>
      </div>
    </div>
    <div class="stage" id="stage3d">
      <canvas id="gl" width="1024" height="1024"></canvas>
      <canvas id="flyout" width="1280" height="720"></canvas>
      <div id="label3d" class="tag"></div>
      <div id="hint" class="tag">drag to orbit · wheel to zoom</div>
      <div id="flymsg" class="tag"></div>
      <div class="transport">
        <button id="flyplay">play</button>
        <div class="seek" id="seekwrap"><input id="flyseek" type="range" min="0" max="1000" value="0" aria-label="position in flight"></div>
        <span id="flytime"></span>
        <button id="flyrec" class="ghost" title="play from the start and record the view to a video file">record</button>
        <span id="flydl"></span>
      </div>
    </div>
    <div class="footer" id="route"></div>
  </section>
</main>
<details id="dev"><summary>stats</summary><dl id="devgrid"></dl></details>
<script type="module">
import init, * as wasm from './pkg/terrain_web.js';
import { VERTEX_BYTES, POS_SCALE, UV_SCALE, SHADE_SCALE, legendContext, faceLayers, quadIndices, columnTints, meshBlocks } from './mesh.js';
import { hydrate, VIEW, BIOME, SNOWY } from './flyover/plan.js';
import { FlyoverPlayer, CHUNK, OPENING, PRI } from './flyover/player.js';
import { WorkerPool } from './pool.js';
import { FOG_GLSL } from './fog.js';
const { heightmap_decorated, generate_region_decorated, biome_map, temperature_map, humidity_map, legend, habitat_names } = wasm;

const $ = (id) => document.getElementById(id);

// Timings and counts go to the collapsed stats panel (open it with ?debug=1),
// not into the page; it renders only while open.
const devStats = new Map();
function dev(key, html) {
  devStats.set(key, html);
  if ($('dev').open) renderDev();
}
function renderDev() {
  $('devgrid').innerHTML = [...devStats].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}
$('dev').addEventListener('toggle', renderDev);
$('devbtn').addEventListener('click', () => {
  $('dev').open = !$('dev').open;
  if ($('dev').open) $('dev').scrollIntoView({ behavior: 'smooth', block: 'end' });
});
// The map covers MAP x MAP blocks drawn at PX x PX pixels. It's built from
// TILE x TILE tiles on a fixed world grid, generated in workers and cached.
const MAP = 1024, PX = 512, K = MAP / PX, TILE = 512, AREA = 64, H = 128;
const WASM_URL = './pkg/terrain_web_bg.wasm';

// Block ids (data/blocks.toml); names and colours come from legend().
const B = {
  air: 0, stone: 1, dirt: 2, grass: 3, sand: 4, gravel: 5, water: 6, ice: 7,
  oak_log: 8, birch_log: 9, spruce_log: 10, oak_leaves: 11, birch_leaves: 12, spruce_leaves: 13,
  tall_grass: 14, fern: 15, dead_bush: 16, dandelion: 17, rose: 18, sugar_cane: 19,
  cactus: 20, brown_mushroom: 21, red_mushroom: 22, pumpkin: 23, snow_layer: 24,
  raft_planks: 25, butcher_block: 26, griddle: 27, crate: 28,
};
let LEGEND, COLORS, NAMES, BIOMES, CTX; // CTX: mesh.js context (legend + face layers)

let state = { seed: 0n, x0: 0, z0: 0, hm: null, sel: null, mode: 'terrain', legendAll: false };

function parseSeed(s) {
  s = s.trim();
  if (/^-?\d+$/.test(s)) return BigInt.asUintN(64, BigInt(s));
  // FNV-1a 64 for text seeds
  let h = 0xcbf29ce484222325n;
  for (const b of new TextEncoder().encode(s)) {
    h ^= BigInt(b);
    h = BigInt.asUintN(64, h * 0x100000001b3n);
  }
  return h;
}

async function wasmSize() {
  try {
    const buf = await (await fetch(WASM_URL)).arrayBuffer();
    let txt = `${(buf.byteLength / 1024).toFixed(1)} KB`;
    if (typeof CompressionStream !== 'undefined') {
      const gz = await new Response(new Blob([buf]).stream()
        .pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      txt += ` (gzip ${(gz.byteLength / 1024).toFixed(1)} KB)`;
    }
    return txt;
  } catch { return ''; }
}

// ---------------------------------------------------------------- colour helpers
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
// Biome ramps have three stops at 0, 0.5 and 1.
const ramp3 = (stops, v) => v < 0.5 ? lerp3(stops[0], stops[1], v * 2) : lerp3(stops[1], stops[2], (v - 0.5) * 2);
// Sequential scales for the climate maps (5 even stops, 0..1).
const SCALES = {
  // cold = dark violet, hot = pale yellow (inferno-like)
  temperature: [[22, 11, 57], [106, 23, 110], [188, 55, 84], [243, 120, 25], [252, 240, 160]],
  // dry = pale yellow, wet = deep blue (YlGnBu-like)
  humidity: [[255, 255, 217], [199, 233, 180], [65, 182, 196], [34, 94, 168], [8, 29, 88]],
};
function scale(stops, v) {
  const f = Math.max(0, Math.min(1, v)) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f));
  return lerp3(stops[i], stops[i + 1], f - i);
}
// Habitat colours (this project's own), by id from data/habitats.toml;
// habitats not listed here get grey.
const HABITAT_COLORS = {
  frozen: [200, 230, 245], warm_shallows: [64, 224, 200], deep_water: [14, 30, 110],
  rocky_shore: [150, 120, 90], cold_open: [70, 120, 200], temperate_open: [40, 160, 110],
};
const NO_HABITAT = 255;
let HABITATS = []; // habitat_names(): index -> id
const habitatColor = (h) => HABITAT_COLORS[HABITATS[h]] || [128, 128, 128];
const css = (c) => `rgb(${c.map((v) => Math.round(v)).join(',')})`;

// ---------------------------------------------------------------- map
function terrainColor(i, x, z) {
  const hm = state.hm;
  const tb = hm[i], ty = hm[i + 1], fy = hm[i + 2], fb = hm[i + 3];
  if (tb === B.water || tb === B.ice) {
    // water: tint by depth to the floor; ice: its own colour over the same depth tint
    const depth = Math.min(ty - fy, 24) / 24;
    const fc = COLORS[fb] || COLORS[B.stone];
    const k = 0.35 * (1 - depth);
    const w = [(20 + 30 * (1 - depth)) * (1 - k) + fc[0] * k,
      (55 + 60 * (1 - depth)) * (1 - k) + fc[1] * k,
      (140 + 70 * (1 - depth)) * (1 - k) + fc[2] * k];
    return tb === B.ice ? lerp3(w, COLORS[B.ice], 0.7) : w;
  }
  const west = x > 0 ? hm[i - 4 + 1] : ty;
  const north = z > 0 ? hm[i - MAP * 4 + 1] : ty;
  let s = 1 + (ty - west) * 0.09 + (ty - north) * 0.09;
  s = Math.max(0.55, Math.min(1.45, s)) * (0.72 + (ty - 40) / 150);
  const c = COLORS[tb] || [255, 0, 255];
  return [c[0] * s, c[1] * s, c[2] * s];
}

// Quick first draft, from the coarse survey (one sample per 8 blocks): sea by
// depth, land by height in its biome's surface colour. Tiles replace it.
function draftColor(x, z) {
  const dr = state.draft;
  if (!dr) return [30, 30, 30];
  const i = Math.min(dr.n - 1, Math.max(0, Math.floor((x + state.x0 - dr.x0) / dr.step)));
  const k = Math.min(dr.n - 1, Math.max(0, Math.floor((z + state.z0 - dr.z0) / dr.step)));
  const top = dr.raw[(k * dr.n + i) * 4], bio = dr.raw[(k * dr.n + i) * 4 + 1];
  if (top < 64) {
    const depth = Math.min(63 - top, 24) / 24;
    return [20 + 30 * (1 - depth), 55 + 60 * (1 - depth), 140 + 70 * (1 - depth)];
  }
  const c = COLORS[bio === BIOME.desert ? B.sand : SNOWY.has(bio) ? B.snow_layer : B.grass];
  const s = 0.72 + (top - 40) / 150;
  return [c[0] * s, c[1] * s, c[2] * s];
}

function drawMap() {
  const hm = state.hm, mode = state.mode;
  const ctx = $('map').getContext('2d');
  const img = ctx.createImageData(PX, PX);
  const d = img.data;
  for (let pz = 0; pz < PX; pz++) {
    for (let px = 0; px < PX; px++) {
      const x = px * K, z = pz * K, c = z * MAP + x, i = c * 4, o = (pz * PX + px) * 4;
      let col;
      if (!state.filled[c]) { col = draftColor(x, z); d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; continue; }
      if (mode === 'terrain') col = terrainColor(i, x, z);
      else {
        if (mode === 'habitat') {
          const h = state.hab[c];
          // land stays in the terrain colours; water shows its habitat
          col = h === NO_HABITAT || !state.habFilled[c] ? terrainColor(i, x, z) : habitatColor(h);
        } else if (mode === 'biome') col = BIOMES[state.biome[c]].map;
        else col = scale(SCALES[mode], (mode === 'temperature' ? state.temp : state.hum)[c]);
        // darken the sea a little so coastlines stay readable
        if (mode !== 'habitat' && (hm[i] === B.water || hm[i] === B.ice)) col = col.map((v) => v * 0.72);
      }
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  drawLegend();
}

// How many map cells show each top block (terrain) or biome, among the
// tiles that are in so far.
function legendCounts(mode) {
  const n = new Uint32Array(256), f = state.filled;
  if (mode === 'terrain') { for (let c = 0; c < f.length; c++) if (f[c]) n[state.hm[c * 4]]++; }
  else for (let c = 0; c < f.length; c++) if (f[c]) n[state.biome[c]]++;
  return n;
}

// Terrain and biome legends list what's on the map, most common first: the
// first LEGEND_TOP, then the rest behind "+N more".
const LEGEND_TOP = 8;
function drawLegend() {
  const el = $('legend');
  const mode = state.mode;
  if (mode === 'habitat') {
    const n = new Uint32Array(256);
    for (let c = 0; c < state.hab.length; c++) if (state.habFilled[c]) n[state.hab[c]]++;
    el.innerHTML = HABITATS.map((name, h) => ({ name, h }))
      .filter(({ h }) => n[h] > 0)
      .map(({ name, h }) => `<span style="--c:${css(habitatColor(h))}">${name.replace(/_/g, ' ')}</span>`).join('') +
      (state.habFilled.includes(1) ? '' : '<span>loading habitats…</span>');
    return;
  }
  if (mode === 'terrain' || mode === 'biome') {
    const n = legendCounts(mode);
    const items = (mode === 'terrain'
      ? LEGEND.blocks.map((b) => ({ id: b.id, name: b.name.replace(/_/g, ' '), c: b.color }))
      : BIOMES.map((b) => ({ id: b.id, name: b.name, c: b.map })))
      .filter((it) => n[it.id]).sort((a, b) => n[b.id] - n[a.id]);
    const total = items.reduce((t, it) => t + n[it.id], 0) || 1;
    const shown = state.legendAll ? items : items.slice(0, LEGEND_TOP);
    const rest = items.length - LEGEND_TOP;
    el.innerHTML = shown.map((it) => `<span style="--c:${css(it.c)}" title="${(n[it.id] / total * 100).toFixed(1)}% of the map">${it.name}</span>`).join('') +
      (rest > 0 ? `<button class="linkish" id="legendmore">${state.legendAll ? 'fewer' : `+${rest} more`}</button>` : '');
    $('legendmore')?.addEventListener('click', () => { state.legendAll = !state.legendAll; drawLegend(); });
  } else {
    const stops = SCALES[mode];
    const g = `linear-gradient(to right, ${stops.map(css).join(', ')})`;
    const [lo, hi] = mode === 'temperature' ? ['0 cold', 'hot 1'] : ['0 dry', 'wet 1'];
    el.innerHTML = `<div class="scale" style="--g:${g}"><div class="bar"></div>` +
      `<div>${lo}</div><div class="mid">0.5</div><div>${hi}</div></div>`;
  }
}

function setMode(mode) {
  state.mode = mode;
  if (mode === 'habitat' && state.habFilled && !state.habFilled.includes(1)) loadHabitats();
  for (const b of document.querySelectorAll('button[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  if (state.hm) drawMap();
}
for (const b of document.querySelectorAll('button[data-mode]')) b.addEventListener('click', () => setMode(b.dataset.mode));

function placeSel() {
  const el = $('sel');
  if (!state.sel) { el.style.display = 'none'; return; }
  const pct = (v) => (v / MAP * 100) + '%';
  el.style.display = 'block';
  el.style.left = pct(state.sel.x); el.style.top = pct(state.sel.z);
  el.style.width = pct(AREA); el.style.height = pct(AREA);
}

function mapCoord(ev) {
  const r = $('map').getBoundingClientRect();
  return [
    Math.max(0, Math.min(MAP - 1, Math.floor((ev.clientX - r.left) / r.width * MAP))),
    Math.max(0, Math.min(MAP - 1, Math.floor((ev.clientY - r.top) / r.height * MAP))),
  ];
}

$('map').addEventListener('mousemove', (ev) => {
  if (!state.hm) return;
  const [x, z] = mapCoord(ev);
  if (!state.filled[z * MAP + x]) return;
  const c = z * MAP + x, i = c * 4;
  const hm = state.hm;
  const nm = (b) => (NAMES[b] || `#${b}`).replace(/_/g, ' ');
  let t = `x ${state.x0 + x} z ${state.z0 + z} · ${nm(hm[i])} y ${hm[i + 1]}`;
  if (hm[i] === B.water || hm[i] === B.ice) t += `, ${hm[i + 1] - hm[i + 2]} deep over ${nm(hm[i + 3])}`;
  t += ` · ${BIOMES[state.biome[c]].name}`;
  if (state.mode === 'habitat' && state.habFilled[c] && state.hab[c] !== NO_HABITAT) t += ` · ${HABITATS[state.hab[c]].replace(/_/g, ' ')}`;
  if (state.mode === 'temperature') t += ` · T ${state.temp[c].toFixed(2)}`;
  if (state.mode === 'humidity') t += ` · H ${state.hum[c].toFixed(2)}`;
  $('hover').textContent = t;
  $('hover').style.display = 'block';
});
$('map').addEventListener('mouseleave', () => { $('hover').style.display = 'none'; });

function selectAt(x, z) {
  state.sel = {
    x: Math.max(0, Math.min(MAP - AREA, Math.round(x - AREA / 2))),
    z: Math.max(0, Math.min(MAP - AREA, Math.round(z - AREA / 2))),
  };
  placeSel();
}

$('map').addEventListener('click', (ev) => {
  if (flying) return; // the map shows the route while flying
  selectAt(...mapCoord(ev));
  build3d();
});

// Build the map: a coarse draft first (instant), then the decorated tiles
// that overlap it, in workers, the one under the 3D area first. Tiles sit on
// a fixed world grid and are cached, so moving the map reuses what it can.
// Resolves true when the map is complete (false if a newer call replaced it).
// A small LRU: a hit moves the entry to the back, and a set past `max`
// drops the least recently used. Keys are `${seed}:${tx}:${tz}`.
function lruCache(max) {
  const m = new Map();
  return {
    get(k) {
      const v = m.get(k);
      if (v !== undefined) { m.delete(k); m.set(k, v); }
      return v;
    },
    set(k, v) {
      m.set(k, v);
      while (m.size > max) m.delete(m.keys().next().value);
    },
  };
}
const TILE_CACHE = 16;
const tileCache = lruCache(TILE_CACHE); // -> { hm, biome, temp, hum }

/** Every TILE-sized tile overlapping the map at (x0, z0), row by row. */
function mapTiles(x0, z0) {
  const out = [];
  for (let tz = Math.floor(z0 / TILE); tz <= Math.floor((z0 + MAP - 1) / TILE); tz++)
    for (let tx = Math.floor(x0 / TILE); tx <= Math.floor((x0 + MAP - 1) / TILE); tx++) out.push({ tx, tz });
  return out;
}
let mapJobs = [], genId = 0;
async function regenerate() {
  const id = ++genId;
  mapJobs.forEach((j) => j.cancel());
  mapJobs = [];
  state.seed = parseSeed($('seed').value);
  state.x0 = parseInt($('x0').value, 10) || 0;
  state.z0 = parseInt($('z0').value, 10) || 0;
  const { seed, x0, z0 } = state;
  state.hm = new Uint8Array(MAP * MAP * 4);
  state.biome = new Uint8Array(MAP * MAP);
  state.temp = new Float32Array(MAP * MAP);
  state.hum = new Float32Array(MAP * MAP);
  state.filled = new Uint8Array(MAP * MAP);
  state.hab = new Uint8Array(MAP * MAP).fill(NO_HABITAT);
  state.habFilled = new Uint8Array(MAP * MAP);
  state.draft = null;
  if (!state.sel) state.sel = { x: (MAP - AREA) / 2, z: (MAP - AREA) / 2 };
  placeSel();
  const t0 = performance.now();
  $('busy').textContent = 'generating map…';
  drawMap();
  setTimeout(() => { if (id === genId && !document.body.classList.contains('flying')) build3d(); }, 0);
  prepareFlyover();

  const draft = pool.run('coarse', { seed, x0, z0, step: 8, nx: MAP / 8, nz: MAP / 8 }, -1);
  mapJobs.push(draft);
  draft.promise.then((raw) => {
    if (id !== genId) return;
    state.draft = { raw, x0: x0 & ~3, z0: z0 & ~3, step: 8, n: MAP / 8 };
    drawMap();
  }, () => {});

  // tiles overlapping the map, the one under the 3D area first
  const sx = x0 + state.sel.x + AREA / 2, sz = z0 + state.sel.z + AREA / 2;
  const tiles = mapTiles(x0, z0).map(({ tx, tz }) =>
    ({ tx, tz, d: Math.hypot((tx + 0.5) * TILE - sx, (tz + 0.5) * TILE - sz) }));
  tiles.sort((a, b) => a.d - b.d);
  let cached = 0;
  const work = tiles.map(({ tx, tz }, n) => {
    const key = `${seed}:${tx}:${tz}`;
    const hit = tileCache.get(key);
    if (hit) { cached++; return Promise.resolve(hit); }
    const job = pool.run('tile', { seed, x: tx * TILE, z: tz * TILE, size: TILE }, n / 100);
    mapJobs.push(job);
    return job.promise.then((t) => {
      tileCache.set(key, t);
      return t;
    });
  }).map((p, n) => p.then((t) => { if (id === genId) placeTile(t, tiles[n].tx * TILE - x0, tiles[n].tz * TILE - z0); }));
  try { await Promise.all(work); } catch { return false; }
  if (id !== genId) return false;
  if (state.mode === 'habitat') loadHabitats();
  const ms = performance.now() - t0;
  $('busy').textContent = '';
  dev('map', `${ms.toFixed(0)} ms (${tiles.length} tiles, ${cached} cached)`);
  return true;
}

// Habitat tiles (same grid as the map tiles) are fetched only while habitat
// mode is showing, then cached like the others.
const habCache = lruCache(TILE_CACHE); // -> habitat bytes
let habJobs = [];
function loadHabitats() {
  const id = genId;
  habJobs.forEach((j) => j.cancel());
  habJobs = [];
  const { seed, x0, z0 } = state;
  for (const { tx, tz } of mapTiles(x0, z0)) {
    const key = `${seed}:${tx}:${tz}`;
    const place = (t) => { if (id === genId) placeHabitats(t, tx * TILE - x0, tz * TILE - z0); };
    const hit = habCache.get(key);
    if (hit) { place(hit); continue; }
    const job = pool.run('habitat', { seed, x: tx * TILE, z: tz * TILE, size: TILE }, 1);
    habJobs.push(job);
    job.promise.then((t) => {
      habCache.set(key, t);
      place(t);
    }, () => {});
  }
}

function placeHabitats(t, ox, oz) {
  const xa = Math.max(0, ox), xb = Math.min(MAP, ox + TILE), za = Math.max(0, oz), zb = Math.min(MAP, oz + TILE);
  for (let z = za; z < zb; z++) {
    const src = (z - oz) * TILE + (xa - ox), dst = z * MAP + xa, w = xb - xa;
    state.hab.set(t.subarray(src, src + w), dst);
    state.habFilled.fill(1, dst, dst + w);
  }
  drawMap();
}

// Copy the part of a tile (map-relative corner ox, oz) that falls on the map.
function placeTile(t, ox, oz) {
  const xa = Math.max(0, ox), xb = Math.min(MAP, ox + TILE), za = Math.max(0, oz), zb = Math.min(MAP, oz + TILE);
  for (let z = za; z < zb; z++) {
    const src = (z - oz) * TILE + (xa - ox), dst = z * MAP + xa, w = xb - xa;
    state.hm.set(t.hm.subarray(src * 4, (src + w) * 4), dst * 4);
    state.biome.set(t.biome.subarray(src, src + w), dst);
    state.temp.set(t.temp.subarray(src, src + w), dst);
    state.hum.set(t.hum.subarray(src, src + w), dst);
    state.filled.fill(1, dst, dst + w);
  }
  drawMap();
}

// The header's regenerate (and Enter in its fields) leaves the flyover.
const userRegenerate = () => { stopFlyover(); regenerate(); };
$('go').addEventListener('click', userRegenerate);
for (const id of ['seed', 'x0', 'z0']) {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') userRegenerate(); });
}

// ---------------------------------------------------------------- 3D
const gl = $('gl').getContext('webgl2', { antialias: true });
// Two programs from one shader: `cut` discards transparent texels (leaves,
// plants, sprites); `solid` doesn't, so the GPU can reject hidden pixels
// before shading them. `prog` is the one in use.
let prog, progs, opaque = null, cutout = null, water = null, ice = null;
const cam = { yaw: 0.8, pitch: 0.55, dist: 95, ty: 68 };
let sky = [0.61, 0.76, 0.9];

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function initGL() {
  progs = { cut: program(true), solid: program(false) };
  useProg(progs.cut);
}

function program(cut) {
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, `#version 300 es
    layout(location=0) in vec3 pos;
    layout(location=1) in vec2 uv;
    layout(location=2) in float layer;
    layout(location=3) in float shade;
    layout(location=4) in vec3 tint;
    uniform mat4 mvp;
    uniform float waterFrame;
    // packed meshes (mesh.js): position, uv and shade scales, and the mesh's offset
    uniform vec3 unpack;
    uniform vec3 offset;
    uniform vec3 camPos; // eye, in the same coordinates as the mesh offsets
    out vec3 vuv;
    out float vshade;
    out float vdist;
    out vec3 vtint;
    void main() {
      vec3 wp = pos * unpack.x + offset;
      gl_Position = mvp * vec4(wp, 1.0);
      // animated tiles (water, flowing water) are runs of 4 layers starting
      // at ANIM_FIRST; offset by the current frame
      bool anim = layer > ${(ANIM_FIRST - 0.5).toFixed(1)} && layer < ${(ANIM_END - 0.5).toFixed(1)};
      vuv = vec3(uv * unpack.y, anim ? layer + waterFrame : layer);
      vshade = shade * unpack.z;
      vtint = tint;
      vdist = distance(wp, camPos);
    }`));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `#version 300 es
    precision mediump float;
    precision mediump sampler2DArray;
    in vec3 vuv; in float vshade; in float vdist; in vec3 vtint;
    uniform sampler2DArray tex;
    uniform float alpha; uniform float fogFar; uniform float fogMax; uniform vec3 fogColor;
    out vec4 o;
    ${FOG_GLSL}
    void main() {
      vec4 t = texture(tex, vuv);
      ${cut ? 'if (t.a < 0.5) discard; // transparent pixels: sprites, leaf holes, sky' : ''}
      // texels stored with alpha ~0.78 are greyscale and take the climate tint
      vec3 c = (t.a < 0.9 ? t.rgb * vtint : t.rgb) * vshade;
      float f = fogAmount(vdist, fogFar) * fogMax;
      o = vec4(mix(c, fogColor, f), alpha);
    }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  prog.locs = new Map();
  return prog;
}

// Uniforms are set by name through setU, which remembers the values so that
// switching program (useProg) carries them over.
const U = new Map();
function uloc(name) {
  let l = prog.locs.get(name);
  if (l === undefined) prog.locs.set(name, l = gl.getUniformLocation(prog, name));
  return l;
}
function applyU(name, v) {
  const l = uloc(name);
  if (l === null) return;
  if (name === 'mvp') gl.uniformMatrix4fv(l, false, v);
  else if (typeof v === 'number') gl.uniform1f(l, v);
  else gl.uniform3fv(l, v);
}
function setU(name, v) { U.set(name, v); applyU(name, v); }
function useProg(p) {
  if (prog === p) return;
  prog = p;
  gl.useProgram(p);
  for (const [name, v] of U) applyU(name, v);
}

// ---------------------------------------------------------------- textures
// Faces sample a TEXTURE_2D_ARRAY of 16x16 layers. Tiles come from the Mince
// Raft tileset (art/batches_*.json, exported to viewer/textures.json by
// build.sh); 8x8 tiles are scaled up 2x, the 16x16 sky tiles fit as-is.
// The viewer needs every TILES entry to use the tileset at all. BIOME_TILES
// (art batches 13-14) are optional: a missing one falls back to a stand-in
// built here (legend colours, ribs, plant silhouettes), so an older
// textures.json still loads.
const TILES = ['stone', 'dirt', 'grass_top', 'grass_side', 'sand', 'gravel',
  'water_0', 'water_1', 'water_2', 'water_3',
  'water_flow_0', 'water_flow_1', 'water_flow_2', 'water_flow_3',
  'sun_sky', 'log_side', 'log_top', 'leaves'];
const BIOME_TILES = ['birch_log_side', 'birch_log_top', 'spruce_log_side', 'spruce_log_top',
  'ice', 'snow', 'cactus_side', 'cactus_top', 'pumpkin_side', 'pumpkin_top',
  'tall_grass', 'fern', 'dead_bush', 'dandelion', 'rose', 'sugar_cane',
  'brown_mushroom', 'red_mushroom'];
// Greyscale-and-tint pixels (palette greens) for climate-tinted tiles.
const TINTED = { grass_top: '89', grass_side: '89', leaves: '89', tall_grass: '89', fern: '89' };
// leaves_fast: the leaves tile with its holes filled, for fast leaves.
const LAYER_NAMES = [...TILES, ...BIOME_TILES, 'leaves_fast'];
const T = Object.fromEntries(LAYER_NAMES.map((n, i) => [n, i]));
const ANIM_FIRST = T.water_0, ANIM_END = T.water_flow_3 + 1;

// Stand-in plant silhouettes for missing tiles (8x8, bottom row on the ground). Keys: g = tinted green
// (grass ramp), G = darker tinted green, s = stem green, c = legend colour,
// C = darker legend colour, w = pale stem/spots.
const SPRITES = {
  tall_grass: ['........', '.g....g.', '.g..g.g.', '.gg.g.G.', '..g.gGg.', '..gGg.g.', 'G.gGgg..', '.GgGgG.G'],
  fern: ['...g....', '.g.g.g..', '..ggg...', 'g.gGg.g.', '.ggGgg..', '..gGg.g.', '.g.G.g..', '...G....'],
  dead_bush: ['........', '.c....c.', '..c..c..', 'c..cc..c', '.c.cC.c.', '..cCCc..', '...CC...', '...CC...'],
  dandelion: ['........', '........', '..ccc...', '.cCccc..', '..ccc...', '...s....', '..ss.s..', '...ss...'],
  rose: ['........', '...cc...', '..cCcc..', '..ccCc..', '...cc...', '..s.s...', '...ss...', '...s....'],
  sugar_cane: ['.c...c..', '.c..cc..', '.C...c..', '.c...C..', 'cc...c..', '.c..cc..', '.c...c..', '.C...C..'],
  brown_mushroom: ['........', '........', '........', '..cccc..', '.ccCccc.', '...ww...', '...ww...', '...ww...'],
  red_mushroom: ['........', '........', '..cccc..', '.cwccwc.', '.cccccc.', '...ww...', '...ww...', '...ww...'],
};
const TINT_A = 200; // alpha marking a greyscale, climate-tinted texel

async function loadTextures() {
  const S = 16;
  const col = (b) => COLORS[B[b]];
  const dark = (c, k = 0.72) => c.map((v) => v * k);
  const solid = (c, a = 255) => () => [...c, a];
  // Each layer is a function (x, y) -> [r, g, b, a] over the 16x16 layer.
  const make = {};
  let textured = false, all = {}, models = {}, pal = {};
  try {
    const set = await (await fetch('./textures.json')).json();
    const batches = Object.values(set.batches);
    all = Object.assign({}, ...batches.map((b) => b.textures || {}));
    models = Object.assign({}, ...batches.map((b) => b.models || {}));
    pal = Object.fromEntries(Object.entries(set.palette).map(([k, hex]) =>
      [k, [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))]));
    for (const name of TILES) if (!all[name]) throw new Error(`missing tile ${name}`);
    textured = true;
  } catch (e) {
    console.warn('textures unavailable, using flat colours:', e);
  }
  const lum = (c) => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
  const tileFn = (name, recolor) => {
    const rows = all[name];
    const k = S / rows.length; // 2 for 8x8 tiles, 1 for 16x16
    if (k !== Math.floor(k) || rows[0].length * k !== S) throw new Error(`tile ${name} is not square`);
    const tint = TINTED[name] || '';
    const maxL = Math.max(1, ...[...tint].map((ch) => lum(pal[ch])));
    return (x, y) => {
      const ch = rows[Math.floor(y / k)][Math.floor(x / k)];
      if (ch === '.') return [0, 0, 0, 0];
      if (recolor) return [...recolor(pal[ch]), 255];
      if (tint.includes(ch)) { const v = 255 * lum(pal[ch]) / maxL; return [v, v, v, TINT_A]; }
      return [...pal[ch], 255];
    };
  };
  if (textured) {
    for (const name of TILES) make[name] = tileFn(name);
    // Birch and spruce bark: the log_side tile's shading over the legend colour.
    const meanL = (() => { let s = 0, n = 0; for (const r of all.log_side) for (const ch of r) { s += lum(pal[ch]); n++; } return s / n; })();
    const bark = (c, contrast) => (p) => c.map((v) => Math.min(255, v * (1 + (lum(p) / meanL - 1) * contrast)));
    make.birch_log_side = tileFn('log_side', bark(col('birch_log'), 1.6));
    make.spruce_log_side = tileFn('log_side', bark(col('spruce_log'), 1.0));
    make.birch_log_top = make.spruce_log_top = make.log_top;
  } else {
    // flat colours; tinted tiles are white so the tint gives the ramp colour
    Object.assign(make, {
      stone: solid(col('stone')), dirt: solid(col('dirt')), grass_top: solid([255, 255, 255], TINT_A),
      grass_side: solid([118, 128, 60]), sand: solid(col('sand')), gravel: solid(col('gravel')),
      sun_sky: solid([232, 195, 58]), log_side: solid(col('oak_log')), log_top: solid(dark(col('oak_log'), 1.25)),
      leaves: solid([255, 255, 255], TINT_A),
      birch_log_side: solid(col('birch_log')), spruce_log_side: solid(col('spruce_log')),
      birch_log_top: solid(dark(col('birch_log'), 0.9)), spruce_log_top: solid(dark(col('spruce_log'), 1.25)),
    });
    for (const n of TILES) if (n.startsWith('water')) make[n] = solid(col('water'));
  }
  // Stand-ins for missing biome tiles: flat legend colours (cactus and
  // pumpkin get ribs so their faces read as blocks).
  const ribs = (c, every, k) => (x) => (x % every === 0 ? dark(c, k) : c);
  make.ice = solid(col('ice'));
  make.snow = solid(col('snow_layer'));
  make.cactus_side = (x) => [...ribs(col('cactus'), 4, 0.75)(x), 255];
  make.cactus_top = (x, y) => [...((x === 0 || y === 0 || x === 15 || y === 15) ? dark(col('cactus'), 0.8) : col('cactus')), 255];
  make.pumpkin_side = (x) => [...ribs(col('pumpkin'), 5, 0.8)(x + 2), 255];
  make.pumpkin_top = (x, y) => [...((x > 6 && x < 9 && y > 6 && y < 9) ? [90, 120, 40] : dark(col('pumpkin'), 0.92)), 255];
  for (const [name, rows] of Object.entries(SPRITES)) {
    const c = col(name);
    const map = { c, C: dark(c), s: [76, 130, 40], w: [232, 226, 210] };
    make[name] = (x, y) => {
      const ch = rows[y >> 1][x >> 1];
      if (ch === '.') return [0, 0, 0, 0];
      if (ch === 'g') return [235, 235, 235, TINT_A];
      if (ch === 'G') return [170, 170, 170, TINT_A];
      return [...map[ch], 255];
    };
  }
  // Biome tiles from the tileset replace the stand-ins above.
  if (textured) for (const name of BIOME_TILES) if (all[name]) make[name] = tileFn(name);
  // Fast leaves: holes filled with a dark tinted grey, so the tile is solid
  // (no discard) and its mipmaps keep the tint marker alpha throughout.
  const leaf = make.leaves;
  make.leaves_fast = (x, y) => { const p = leaf(x, y); return p[3] ? p : [96, 96, 96, TINT_A]; };
  const layers = LAYER_NAMES.map((n) => make[n]);
  // Fish model faces: one layer each, drawn at native size in the top-left
  // corner. The rest of the layer repeats the edge pixels so mipmaps
  // don't bleed transparent texels into small faces.
  fishModels = {};
  if (textured) {
    const px = (ch) => ch === '.' ? [0, 0, 0, 0] : [...pal[ch], 255];
    for (const sp of Object.keys(FISH_SPECIES)) {
      const m = models[sp];
      if (!m) { console.warn(`no model for ${sp}`); continue; }
      const faces = {};
      for (const [fname, rows] of Object.entries(m)) {
        const w = rows[0].length, h = rows.length;
        if (w > S || h > S) continue;
        faces[fname] = { layer: layers.length, w, h };
        layers.push((x, y) => px(rows[Math.min(y, h - 1)][Math.min(x, w - 1)]));
      }
      fishModels[sp] = {
        faces,
        W: m.body_front[0].length, H: m.body_front.length, D: m.body_left[0].length,
      };
    }
  }
  const data = new Uint8Array(S * S * 4 * layers.length);
  layers.forEach((f, L) => {
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) data.set(f(x, y), ((L * S + y) * S + x) * 4);
  });
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
  gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, S, S, layers.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return textured;
}

// Layer for block id b on a face with vertical normal dy (1 top, -1 bottom,
// 0 side); `fast` for fast leaves (see mesh.js).
function tileFor(b, dy, fast = false) {
  switch (b) {
    case B.stone: return T.stone;
    case B.dirt: return T.dirt;
    case B.grass: return dy > 0 ? T.grass_top : dy < 0 ? T.dirt : T.grass_side;
    case B.sand: return T.sand;
    case B.gravel: return T.gravel;
    case B.water: return dy === 0 ? T.water_flow_0 : T.water_0;
    case B.ice: return T.ice;
    case B.oak_log: return dy ? T.log_top : T.log_side;
    case B.birch_log: return dy ? T.birch_log_top : T.birch_log_side;
    case B.spruce_log: return dy ? T.spruce_log_top : T.spruce_log_side;
    case B.oak_leaves: case B.birch_leaves: case B.spruce_leaves: return fast ? T.leaves_fast : T.leaves;
    case B.cactus: return dy ? T.cactus_top : T.cactus_side;
    case B.pumpkin: return dy ? T.pumpkin_top : T.pumpkin_side;
    case B.snow_layer: return T.snow;
    default: return T[NAMES[b]] ?? T.stone; // cross plants
  }
}

const STRIDE = 10;
function upload(v) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STATIC_DRAW);
  const attr = (loc, size, off) => {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, STRIDE * 4, off * 4);
  };
  attr(0, 3, 0); attr(1, 2, 3); attr(2, 1, 5); attr(3, 1, 6); attr(4, 3, 7);
  gl.bindVertexArray(null);
  return { vao, n: v.length / STRIDE, bufs: [vb] };
}

// One index buffer for every packed mesh: they're all quads with the same
// index pattern (mesh.js quadIndices). It grows by replacement; meshes made
// earlier keep the smaller one they were set up with.
let quadIB = null, quadIBSize = 0;
function quadIndexBuffer(quads) {
  if (quads > quadIBSize) {
    quadIBSize = Math.max(quads, quadIBSize * 2, 1 << 16);
    quadIB = gl.createBuffer();
    gl.bindVertexArray(null);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIB);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, quadIndices(quadIBSize), gl.STATIC_DRAW);
  }
  return quadIB;
}

// A packed mesh part from mesh.js ({ verts, faces }): 16-byte vertices, quads.
function uploadPacked({ verts, faces }) {
  const ib = quadIndexBuffer(faces);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  const attr = (loc, size, type, normalized, off) => {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, type, normalized, VERTEX_BYTES, off);
  };
  attr(0, 3, gl.SHORT, false, 0); attr(1, 2, gl.UNSIGNED_BYTE, false, 6); attr(2, 1, gl.UNSIGNED_BYTE, false, 8);
  attr(3, 1, gl.UNSIGNED_BYTE, false, 9); attr(4, 3, gl.UNSIGNED_BYTE, true, 10);
  gl.bindVertexArray(null);
  return { vao, n: faces * 6, faces, packed: true, bufs: [vb] };
}

const PACKED = [POS_SCALE, UV_SCALE, SHADE_SCALE];
// Draw a mesh: packed (mesh.js, placed at `off`) or float (sun, fish).
function drawMesh(m, off = [0, 0, 0]) {
  if (!m || !m.n) return;
  setU('unpack', m.packed ? PACKED : [1, 1, 1]);
  setU('offset', m.packed ? off : [0, 0, 0]);
  gl.bindVertexArray(m.vao);
  if (m.packed) gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_INT, 0);
  else gl.drawArrays(gl.TRIANGLES, 0, m.n);
}

function free(m) {
  if (!m) return;
  gl.deleteVertexArray(m.vao);
  m.bufs.forEach((b) => gl.deleteBuffer(b));
}

function build3d() {
  if (!state.sel) return;
  const wx = state.x0 + state.sel.x, wz = state.z0 + state.sel.z;
  const t0 = performance.now();
  const blocks = generate_region_decorated(state.seed, wx, wz, AREA, AREA);
  const tints = columnTints(wasm, CTX, state.seed, wx, wz, AREA);
  const t1 = performance.now();
  free(opaque); free(cutout); free(water); free(ice);
  const m = meshBlocks(CTX, blocks, tints, AREA);
  [opaque, cutout, water, ice] = [m.opaque, m.cutout, m.water, m.ice].map(uploadPacked);
  cam.ty = m.meanY;
  state.blocks = blocks;
  // sky and fog from the centre column's biome sky ramp (by temperature)
  sky = ramp3(tints.centre.biome.sky, tints.centre.t).map((v) => v / 255);
  $('gl').style.background = css(sky.map((v) => v * 255));
  spawnFish();
  const t2 = performance.now();
  $('label3d').textContent = `x ${wx}..${wx + AREA - 1} z ${wz}..${wz + AREA - 1} · ${tints.centre.biome.name}`;
  dev('3D preview', `gen ${(t1 - t0).toFixed(0)} ms, mesh ${(t2 - t1).toFixed(0)} ms, ` +
    `${opaque.faces + cutout.faces + water.faces + ice.faces} faces, ${fish.length} fish`);
  draw();
}

// column-major 4x4 matrices
function persp(fov, asp, near, far) {
  const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
  return [f / asp, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
}
function lookAt(e, t, u) {
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const norm = (a) => { const l = Math.hypot(...a); return a.map((v) => v / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const zA = norm(sub(e, t)), xA = norm(cross(u, zA)), yA = cross(zA, xA);
  return [xA[0], yA[0], zA[0], 0, xA[1], yA[1], zA[1], 0, xA[2], yA[2], zA[2], 0,
    -dot(xA, e), -dot(yA, e), -dot(zA, e), 1];
}
// The six clip planes of a view-projection matrix, as [a, b, c, d] with
// inside where a x + b y + c z + d >= 0.
function frustumPlanes(m) {
  const row = (i) => [m[i], m[4 + i], m[8 + i], m[12 + i]];
  const w = row(3), out = [];
  for (const i of [0, 1, 2]) {
    const r = row(i);
    out.push(w.map((v, k) => v + r[k]), w.map((v, k) => v - r[k]));
  }
  return out;
}
// False when the box lo..hi is wholly outside one of the planes.
function boxVisible(planes, lo, hi) {
  for (const p of planes) {
    const x = p[0] > 0 ? hi[0] : lo[0], y = p[1] > 0 ? hi[1] : lo[1], z = p[2] > 0 ? hi[2] : lo[2];
    if (p[0] * x + p[1] * y + p[2] * z + p[3] < 0) return false;
  }
  return true;
}
function mul(a, b) {
  const o = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
  return o;
}

function draw() {
  if (!opaque) return;
  const cv = $('gl');
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(sky[0], sky[1], sky[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  useProg(progs.cut);
  const cp = Math.cos(cam.pitch);
  const eye = [cam.dist * cp * Math.cos(cam.yaw), cam.dist * Math.sin(cam.pitch), cam.dist * cp * Math.sin(cam.yaw)];
  const target = [0, cam.ty - 64, 0];
  const view = lookAt([eye[0], eye[1] + target[1], eye[2]], target, [0, 1, 0]);
  const mvp = mul(persp(0.9, cv.width / cv.height, 0.5, 2000), view);
  setU('mvp', new Float32Array(mvp));
  setU('camPos', [eye[0], eye[1] + target[1], eye[2]]);
  setU('fogMax', 0.6);
  setU('alpha', 1);
  setU('waterFrame', waterFrame);
  setU('fogColor', sky);
  gl.disable(gl.BLEND);
  // sun first, unfogged and behind everything
  setU('fogFar', 1e9);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  drawSun(view, target);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  setU('fogFar', cam.dist + 90);
  // solid geometry without discard, then cut-outs (leaves, plants)
  const AT = [-AREA / 2, -64, -AREA / 2]; // packed meshes are in area-local coordinates
  useProg(progs.solid);
  drawMesh(opaque, AT);
  useProg(progs.cut);
  drawMesh(cutout, AT);
  // fish under the water surface; fins are flat, so draw both sides
  if (fish.length) {
    gl.disable(gl.CULL_FACE);
    drawDynamic('fish', fishVerts());
    gl.enable(gl.CULL_FACE);
  }
  // translucent water, then ice, without depth writes
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  setU('alpha', 0.45);
  drawMesh(water, AT);
  setU('alpha', 0.72);
  drawMesh(ice, AT);
  gl.depthMask(true);
  gl.bindVertexArray(null);
}

// The sun (16x16 sun_sky tile) as a camera-facing sprite in a fixed direction:
// low in the north-west sky (~9 degrees up), matching the textures' top-left
// lighting. The orbit camera looks down, so it shows when you orbit low.
const SUN_DIR = (() => { const v = [-0.7, 0.16, -0.7], l = Math.hypot(...v); return v.map((c) => c / l); })();
function drawSun(view, target) {
  const right = [view[0], view[4], view[8]], up = [view[1], view[5], view[9]];
  const R = 46, D = 700;
  const c = SUN_DIR.map((d, i) => target[i] + d * D);
  const corner = (sx, sy) => c.map((v, i) => v + (right[i] * sx + up[i] * sy) * R);
  const q = [[corner(-1, -1), 0, 1], [corner(1, -1), 1, 1], [corner(1, 1), 1, 0], [corner(-1, 1), 0, 0]];
  const v = [];
  for (const i of [0, 1, 2, 0, 2, 3]) v.push(...q[i][0], q[i][1], q[i][2], T.sun_sky, 1, 1, 1, 1);
  gl.disable(gl.CULL_FACE);
  drawDynamic('sun', new Float32Array(v));
  gl.enable(gl.CULL_FACE);
}

// Geometry rebuilt every frame (sun, fish) goes through one reusable buffer per key.
const dynMeshes = {};
function drawDynamic(key, v) {
  const m = dynMeshes[key] ||= upload(new Float32Array(0));
  gl.bindBuffer(gl.ARRAY_BUFFER, m.bufs[0]);
  gl.bufferData(gl.ARRAY_BUFFER, v, gl.DYNAMIC_DRAW);
  m.n = v.length / STRIDE;
  drawMesh(m);
}

// ---------------------------------------------------------------- fish
// Salmon, tuna and mackerel from the Batch 11 box models, swimming in small
// schools like Minecraft 1.13 fish. Each species is a body box plus flat tail
// and dorsal fins. Only the left side is drawn in the tileset; the right side
// reuses it mirrored.
const FISH_SPECIES = {
  salmon: { speed: 2.2 },
  mackerel: { speed: 2.6 },
  tuna: { speed: 1.8 },
};
const FISH_PX = 1 / 8;       // block units per model pixel (a salmon is 1 block long)
const SURFACE = 63.3;        // keep fish below the water surface (top of y=63)
let fishModels = {};         // species -> { W, H, D, faces: {name: {layer, w, h}} }
let fish = [], schools = [];

function isWater(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  if (ix < 0 || iz < 0 || ix >= AREA || iz >= AREA || iy < 0 || iy >= H) return false;
  return state.blocks[(iz * AREA + ix) * H + iy] === B.water;
}

function frozen(x, z) {
  const base = (z * AREA + x) * H;
  for (let y = 40; y < 72; y++) if (state.blocks[base + y] === B.ice) return true;
  return false;
}

function spawnFish() {
  fish = []; schools = [];
  const kinds = Object.keys(fishModels);
  if (!kinds.length) return;
  // Candidate spawn cells: open (unfrozen) water with water above, at least a
  // block under the surface. Ice-covered columns get no fish.
  const cells = [];
  let surface = 0;
  for (let z = 0; z < AREA; z++) for (let x = 0; x < AREA; x++) {
    if (frozen(x, z)) continue;
    if (isWater(x, 63, z)) surface++;
    for (let y = 40; y <= 61; y++) if (isWater(x, y, z) && isWater(x, y + 1, z)) cells.push([x, y, z]);
  }
  if (!cells.length) return;
  const target = Math.min(40, Math.round(surface / 70));
  while (fish.length < target) {
    const species = kinds[Math.floor(Math.random() * kinds.length)];
    const school = { species, yaw: Math.random() * 2 * Math.PI, pitch: 0, timer: 1 + Math.random() * 3 };
    schools.push(school);
    const [cx, cy, cz] = cells[Math.floor(Math.random() * cells.length)];
    const size = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < size && fish.length < target; i++) {
      for (let tries = 0; tries < 8; tries++) {
        const p = [cx + 0.5 + (Math.random() - 0.5) * 3, cy + 0.5 + (Math.random() - 0.5), cz + 0.5 + (Math.random() - 0.5) * 3];
        if (!isWater(...p) || p[1] > SURFACE || frozen(Math.floor(p[0]), Math.floor(p[2]))) continue;
        fish.push({
          school, pos: p, yaw: school.yaw, pitch: 0,
          jitter: (Math.random() - 0.5) * 0.4,
          phase: Math.random() * 10,
          speed: FISH_SPECIES[species].speed * (0.85 + Math.random() * 0.3),
        });
        break;
      }
    }
  }
}

const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const approach = (a, b, max) => a + Math.max(-max, Math.min(max, wrap(b - a)));

function updateFish(dt) {
  if (!fish.length) return;
  // Each school picks a new heading every few seconds.
  const centre = new Map();
  for (const s of schools) {
    s.timer -= dt;
    if (s.timer < 0) {
      s.yaw += (Math.random() - 0.5) * 2.4;
      s.pitch = (Math.random() - 0.5) * 0.5;
      s.timer = 2 + Math.random() * 4;
    }
    centre.set(s, [0, 0, 0, 0]);
  }
  for (const f of fish) { const c = centre.get(f.school); c[0] += f.pos[0]; c[1] += f.pos[1]; c[2] += f.pos[2]; c[3]++; }
  for (const f of fish) {
    const s = f.school, m = fishModels[s.species];
    const c = centre.get(s);
    let want = s.yaw + f.jitter;
    // drift back toward the school when straying
    const dx = c[0] / c[3] - f.pos[0], dz = c[2] / c[3] - f.pos[2];
    if (Math.hypot(dx, dz) > 2.5) want = approach(want, Math.atan2(dz, dx), 1.2);
    f.yaw = approach(f.yaw, want, 2.5 * dt);
    f.pitch += (s.pitch - f.pitch) * Math.min(1, dt * 2);
    const cp = Math.cos(f.pitch);
    const dir = [cp * Math.cos(f.yaw), Math.sin(f.pitch), cp * Math.sin(f.yaw)];
    const reach = (m.D / 2) * FISH_PX + 0.4;
    const ahead = f.pos.map((v, i) => v + dir[i] * reach);
    if (!isWater(...ahead) || ahead[1] > SURFACE) {
      // Blocked by land or the surface: the school turns around.
      if (ahead[1] > SURFACE) s.pitch = -0.3;
      else if (!isWater(ahead[0], ahead[1] - 1, ahead[2])) s.pitch = 0.2;
      if (s.timer > 0.3) { s.yaw = f.yaw + Math.PI + (Math.random() - 0.5); s.timer = 2 + Math.random() * 2; }
      f.yaw += 3 * dt;
      f.pitch *= 0.5;
    } else {
      for (let i = 0; i < 3; i++) f.pos[i] += dir[i] * f.speed * dt;
    }
    // keep a little space between schoolmates
    for (const o of fish) {
      if (o === f || o.school !== s) continue;
      const sx = f.pos[0] - o.pos[0], sy = f.pos[1] - o.pos[1], sz = f.pos[2] - o.pos[2];
      const dd = Math.hypot(sx, sy, sz);
      if (dd > 0.01 && dd < 1.1) {
        const k = (1.1 - dd) * dt * 2 / dd;
        const next = [f.pos[0] + sx * k, f.pos[1] + sy * k, f.pos[2] + sz * k];
        if (isWater(...next) && next[1] <= SURFACE) f.pos = next;
      }
    }
    f.phase += dt * (6 + f.speed * 2);
  }
}

// Face quads in model pixels, corners in texture order (top-left, top-right,
// bottom-right, bottom-left) as seen from outside. +X is the nose, +Y up and
// -Z the fish's left side, per art/PROMPT.md's model face conventions.
function fishFaces(m) {
  const d = m.D / 2, h = m.H / 2, w = m.W / 2;
  const t = m.faces.tail, f = m.faces.dorsal;
  const q = [
    ['body_left', [[d, h, -w], [-d, h, -w], [-d, -h, -w], [d, -h, -w]], 0.8],
    ['body_left', [[d, h, w], [-d, h, w], [-d, -h, w], [d, -h, w]], 0.8], // right = mirrored left
    ['body_front', [[d, h, w], [d, h, -w], [d, -h, -w], [d, -h, w]], 0.7],
    ['body_back', [[-d, h, -w], [-d, h, w], [-d, -h, w], [-d, -h, -w]], 0.65],
    ['body_top', [[-d, h, w], [-d, h, -w], [d, h, -w], [d, h, w]], 1.0],
    ['body_bottom', [[d, -h, w], [d, -h, -w], [-d, -h, -w], [-d, -h, w]], 0.5],
  ];
  if (t) q.push(['tail', [[-d, t.h / 2, 0], [-d - t.w, t.h / 2, 0], [-d - t.w, -t.h / 2, 0], [-d, -t.h / 2, 0]], 0.85, true]);
  if (f) q.push(['dorsal', [[f.w / 2, h + f.h, 0], [-f.w / 2, h + f.h, 0], [-f.w / 2, h, 0], [f.w / 2, h, 0]], 0.9]);
  return q.filter(([name]) => m.faces[name]);
}

function fishVerts() {
  const out = [];
  for (const f of fish) {
    const m = fishModels[f.school.species];
    const faces = m.faceQuads ||= fishFaces(m);
    const tailA = Math.sin(f.phase + 0.8) * 0.6;       // tail sweep
    const yaw = f.yaw + Math.sin(f.phase) * 0.12;     // body wiggle
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(f.pitch), sp = Math.sin(f.pitch);
    const ox = f.pos[0] - AREA / 2, oy = f.pos[1] - 64, oz = f.pos[2] - AREA / 2;
    const xf = ([x, y, z], tail) => {
      if (tail) { // swing around the tail's hinge at the back of the body
        const r = x + m.D / 2;
        x = -m.D / 2 + r * Math.cos(tailA); z = r * Math.sin(tailA);
      }
      x *= FISH_PX; y *= FISH_PX; z *= FISH_PX;
      const x1 = x * cp - y * sp, y1 = x * sp + y * cp;  // pitch: nose up
      return [ox + x1 * cy - z * sy, oy + y1, oz + x1 * sy + z * cy]; // yaw
    };
    for (const [name, corners, shade, tail] of faces) {
      const { layer, w, h } = m.faces[name];
      const uv = [[0, 0], [w / 16, 0], [w / 16, h / 16], [0, h / 16]];
      const p = corners.map((c) => xf(c, tail));
      for (const i of [0, 1, 2, 0, 2, 3]) out.push(...p[i], uv[i][0], uv[i][1], layer, shade, 1, 1, 1);
    }
  }
  return new Float32Array(out);
}

// Animate water frames and fish, unless the viewer prefers reduced motion
// (then the scene is still and redraws only on camera moves).
let waterFrame = 0, lastT = 0;
function tick(t) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  if (document.hidden || !opaque || flying) return; // the flyover runs its own loop
  waterFrame = Math.floor(t / 300) % 4;
  updateFish(dt);
  draw();
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);

// The preview canvas matches the stage's shape and pixel density (the
// flyover renders at a fixed FLY_W x FLY_H instead).
function sizeGL() {
  if (flying) return;
  const st = $('stage3d'), k = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(st.clientWidth * k), h = Math.round(st.clientHeight * k);
  if (!w || !h || ($('gl').width === w && $('gl').height === h)) return;
  $('gl').width = w; $('gl').height = h;
  draw();
}
new ResizeObserver(sizeGL).observe($('stage3d'));

const hideHint = () => $('hint').classList.add('gone');
let drag = null;
$('gl').addEventListener('pointerdown', (e) => { hideHint(); drag = [e.clientX, e.clientY]; $('gl').setPointerCapture(e.pointerId); });
$('gl').addEventListener('pointerup', () => { drag = null; });
$('gl').addEventListener('pointermove', (e) => {
  if (!drag) return;
  cam.yaw += (e.clientX - drag[0]) * 0.01;
  cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + (e.clientY - drag[1]) * 0.01));
  drag = [e.clientX, e.clientY];
  draw();
});
$('gl').addEventListener('wheel', (e) => {
  e.preventDefault();
  hideHint();
  cam.dist = Math.max(10, Math.min(400, cam.dist * Math.exp(e.deltaY * 0.001)));
  draw();
}, { passive: false });

// ---------------------------------------------------------------- flyover
// Every time the map changes, a flyover for it is prepared in the background
// (prepareFlyover): a worker plans it (flyover/plan.js) and the chunks for its
// first OPENING seconds start rendering in the pool, after the map tiles. The
// flyover toggle then plays at once, or shows a loading card until those
// chunks are in. The route stays on the map when it can (otherwise the map
// moves to it), and is drawn on #overlay. Frames render into the hidden #gl
// at 1280x720 and are copied into #flyout (shown in its place) with
// captions; #flyout is what gets recorded. See viewer/flyover/README.md.
let pool;              // WorkerPool, created at startup
let prep = null;       // { key, seed, job, ready, plan, player, origin, sky, ... } for the current map
let flying = false;    // the 3D view is in flyover mode
let flyDrawn = 0;      // chunks drawn in the last flyover frame (after culling)
let markStarted;
const started = new Promise((r) => { markStarted = r; }); // the page has a map and a pool
const FLY_W = 1280, FLY_H = 720;
const FLY_FOG = VIEW.fogEnd; // fog is solid at this radial distance

// Planning and error messages, centred on the stage ('' hides it).
function flyStatus(text) { $('flymsg').textContent = text; }

const flyEnv = () => ({ pool, canvas: $('flyout'), upload: uploadPacked, free, render: (f) => renderFly(f) });

function prepareFlyover() {
  const key = `${state.seed}:${state.x0}:${state.z0}`;
  if (prep && prep.key === key) return prep;
  cancelPrep();
  const seed = state.seed, x0 = state.x0, z0 = state.z0;
  const p = prep = { key, seed, sky: null, skyAt: -1 };
  p.job = pool.run('plan', { seed, cx: x0 + MAP / 2, cz: z0 + MAP / 2, bounds: { x0, z0, x1: x0 + MAP, z1: z0 + MAP } }, PRI.plan);
  p.ready = p.job.promise.then((data) => {
    if (prep !== p) return null;
    if (!data) { p.none = true; return null; }
    p.plan = hydrate(data);
    p.origin = [Math.round(p.plan.island.cx / CHUNK) * CHUNK, 0, Math.round(p.plan.island.cz / CHUNK) * CHUNK];
    p.player = new FlyoverPlayer(p.plan, seed, flyEnv(), onFlyState);
    return p;
  }, () => null);
  return p;
}

function cancelPrep() {
  if (!prep) return;
  prep.job?.cancel();
  prep.player?.dispose();
  prep = null;
}

function setView(view) {
  for (const b of document.querySelectorAll('button[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === view));
  document.body.classList.toggle('flying', view === 'flyover');
}

async function startFlyover() {
  if (flying) return;
  flying = true;
  setView('flyover');
  $('flydl').textContent = ''; $('flytime').textContent = '';
  renderRoute(null);
  $('gl').width = FLY_W; $('gl').height = FLY_H;
  flyStatus('planning the flyover…');
  requestAnimationFrame(flyLoop);
  await started;
  // the map may change while this waits (then a new plan replaces it)
  let p;
  for (;;) {
    p = prepareFlyover();
    await p.ready;
    if (!flying) return;
    if (prep === p) break;
  }
  if (!p.plan) { flyStatus('no island within 1024 blocks of the map centre; try another x/z or seed'); return; }
  flyStatus('');
  if (p.plan.moved) {
    // No route fits this map: move the map to the route, keeping this plan.
    const [mx, mz] = p.plan.mapOrigin;
    $('x0').value = mx; $('z0').value = mz;
    p.key = `${state.seed}:${mx}:${mz}`;
    p.plan.moved = false;
    regenerate();
  }
  selectAt(p.plan.island.cx - state.x0, p.plan.island.cz - state.z0);
  renderRoute(p.plan);
  p.player.play();
}

// Back to the chunk preview, on the flyover's island. The flyover only pauses,
// so its loaded chunks are still there if you switch back.
function stopFlyover() {
  if (!flying) return;
  flying = false;
  setView('preview');
  $('overlay').getContext('2d').clearRect(0, 0, PX, PX);
  prep?.player?.pause();
  flyStatus('');
  renderRoute(null);
  sizeGL();
  build3d();
}

// The route under the view: the island, then each feature numbered as on the
// map; a feature seeks to the moment it comes into view. The same moments
// are ticks under the seek bar.
function renderRoute(plan) {
  const el = $('route'), wrap = $('seekwrap');
  wrap.querySelectorAll('.tick').forEach((t) => t.remove());
  el.replaceChildren();
  if (!plan) return;
  const i = plan.island, dur = plan.path.duration;
  dev('flyover plan', `${plan.islandCount} islands and ${plan.featureCount} features surveyed, ` +
    `${plan.schedule.length} chunks in view, planned in ${plan.ms} ms`);
  const box = document.createElement('div');
  box.className = 'route';
  const head = document.createElement('b');
  head.textContent = i.label;
  head.title = `x ${Math.round(i.cx)} z ${Math.round(i.cz)}, ${i.blocks} m², top y ${i.maxH} · ${dur.toFixed(0)} s flight`;
  box.append(head);
  plan.chosen.forEach((f, n) => {
    const cov = plan.coverage[n], at = Math.max(0, cov.first ?? 0);
    const b = document.createElement('button');
    b.innerHTML = `<i>${n + 1}</i>`;
    b.append(f.label);
    b.title = `x ${f.x} z ${f.z} · in view ${cov.seconds.toFixed(1)} s from ${at.toFixed(1)} s`;
    b.addEventListener('click', () => { const p = prep?.player; if (flying && p) p.seek(at); });
    box.append(b);
    if (cov.first >= 0) {
      const t = document.createElement('div');
      t.className = 'tick';
      t.style.left = `${at / dur * 100}%`;
      wrap.append(t);
    }
  });
  el.append(box);
}

function onFlyState(s) {
  if (!flying) return;
  $('flyplay').textContent = s === 'playing' || s === 'loading' ? 'pause' : 'play';
}

function flyLoop(now) {
  if (!flying) return;
  requestAnimationFrame(flyLoop);
  const p = prep;
  if (document.hidden || !p?.player) return;
  waterFrame = Math.floor(now / 300) % 4;
  const pl = p.player, st = pl.stream;
  if (!pl.prepared && pl.t === 0 && pl.state !== 'playing') {
    // still rendering the opening: a card instead of a half-built scene
    const [d, n] = pl.opening;
    pl.frame(now); // keeps loading; its picture is replaced below
    loadingCard(d, n);
    flyStatus('');
    $('flytime').textContent = `loading ${d}/${n}`;
    drawRoute(pl.plan.path.at(0));
    return;
  }
  pl.frame(now);
  $('flytime').textContent = `${pl.t.toFixed(1)} / ${pl.duration.toFixed(0)} s` +
    (pl.state === 'loading' ? ' · loading' : '') + (pl.recorder ? ' · ● rec' : '');
  if (pl.frameNo % 15 === 0) {
    let fast = 0;
    for (const c of st.loaded.values()) if (c.fast) fast++;
    dev('flyover chunks', `${st.loaded.size} loaded (${fast} with fast leaves), ${flyDrawn} drawn, ${st.jobs.size} queued`);
  }
  if (!seeking) $('flyseek').value = String(Math.round(pl.t / pl.duration * 1000));
}

function loadingCard(d, n) {
  const ctx = $('flyout').getContext('2d');
  ctx.fillStyle = '#101214'; ctx.fillRect(0, 0, FLY_W, FLY_H);
  ctx.fillStyle = '#d8dde3'; ctx.font = '600 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.fillText('loading flyover render…', 80, FLY_H / 2 - 24);
  ctx.fillStyle = '#30353b'; ctx.fillRect(80, FLY_H / 2, FLY_W - 160, 10);
  ctx.fillStyle = '#7fb35a'; ctx.fillRect(80, FLY_H / 2, (FLY_W - 160) * (n ? d / n : 0), 10);
  ctx.fillStyle = '#8a939d'; ctx.font = '18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.fillText(`${d} of ${n} chunks for the first ${OPENING} s`, 80, FLY_H / 2 + 44);
}

// Sky and fog follow the biome under the camera (its sky ramp by temperature),
// eased so biome edges don't flash.
function flySky(eye) {
  const want = (() => {
    const x = Math.round(eye[0]), z = Math.round(eye[2]);
    const b = biome_map(prep.seed, x, z, 1, 1)[0], t = temperature_map(prep.seed, x, z, 1, 1)[0];
    return ramp3(BIOMES[b].sky, t).map((v) => v / 255);
  });
  if (!prep.sky) prep.sky = want();
  if (prep.player.frameNo - prep.skyAt >= 15) { prep.skyWant = want(); prep.skyAt = prep.player.frameNo; }
  prep.sky = lerp3(prep.sky, prep.skyWant || prep.sky, 0.04);
  return prep.sky;
}

function renderFly(f) {
  const o = prep.origin;
  const eye = [f.eye[0] - o[0], f.eye[1] - 64, f.eye[2] - o[2]];
  const tgt = [f.target[0] - o[0], f.target[1] - 64, f.target[2] - o[2]];
  const skyC = flySky(f.eye);
  gl.viewport(0, 0, FLY_W, FLY_H);
  gl.clearColor(skyC[0], skyC[1], skyC[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.disable(gl.BLEND);
  useProg(progs.cut);
  const view = lookAt(eye, tgt, [0, 1, 0]);
  const mvp = mul(persp(1.0, FLY_W / FLY_H, 0.3, 1000), view);
  setU('mvp', new Float32Array(mvp));
  setU('camPos', eye);
  setU('alpha', 1);
  setU('waterFrame', waterFrame);
  setU('fogColor', skyC);
  setU('fogMax', 1);
  setU('fogFar', 1e9);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  drawSun(view, eye);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  setU('fogFar', FLY_FOG);
  // Chunks whose box is in the view frustum and nearer than solid fog,
  // nearest first.
  const planes = frustumPlanes(mvp);
  const vis = [];
  for (const c of f.chunks) {
    const lo = [c.cx * CHUNK - o[0], (c.minY ?? 0) - 8 - 64, c.cz * CHUNK - o[2]];
    const hi = [lo[0] + CHUNK, H - 64, lo[2] + CHUNK];
    const d = Math.hypot(...[0, 1, 2].map((i) => Math.max(lo[i] - eye[i], 0, eye[i] - hi[i])));
    if (d > VIEW.fogEnd || !boxVisible(planes, lo, hi)) continue;
    vis.push({ c, off: [lo[0], -64, lo[2]], d });
  }
  vis.sort((a, b) => a.d - b.d);
  flyDrawn = vis.length;
  // solid front to back (hidden pixels are rejected early), cut-outs, then
  // water and ice back to front
  useProg(progs.solid);
  for (const { c, off } of vis) drawMesh(c.parts.opaque, off);
  useProg(progs.cut);
  for (const { c, off } of vis) drawMesh(c.parts.cutout, off);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  setU('alpha', 0.45);
  for (let i = vis.length - 1; i >= 0; i--) drawMesh(vis[i].c.parts.water, vis[i].off);
  setU('alpha', 0.72);
  for (let i = vis.length - 1; i >= 0; i--) drawMesh(vis[i].c.parts.ice, vis[i].off);
  gl.depthMask(true);
  gl.bindVertexArray(null);
  composeFly(f);
  drawRoute(f);
}

// Copy the frame into #flyout (same task, so no preserveDrawingBuffer) and
// draw the captions over it.
function composeFly(f) {
  const ctx = $('flyout').getContext('2d');
  ctx.drawImage($('gl'), 0, 0);
  const caption = (text, alpha, y, size) => {
    if (alpha <= 0 || !text) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `600 ${size}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 48, y);
    ctx.restore();
  };
  // opening title, then feature captions
  const ta = Math.min(1, f.t / 0.8, Math.max(0, (4.5 - f.t) / 0.8));
  caption('MINCE RAFT', ta, FLY_H - 112, 34);
  caption(`seed ${$('seed').value.trim()}`, ta * 0.85, FLY_H - 80, 20);
  if (f.t > 4.5) caption(f.label, f.labelAlpha, FLY_H - 56, 28);
  // gentle fade from and to black
  const fade = Math.max(0, 1 - f.t / 1.2, 1 - (f.duration - f.t) / 1.5);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, FLY_W, FLY_H); }
}

// The route, the features and the camera, over the main map.
function drawRoute(f) {
  if (prep.player.frameNo % 6) return;
  const ctx = $('overlay').getContext('2d');
  const px = (x, z) => [(x - state.x0) / K, (z - state.z0) / K];
  ctx.clearRect(0, 0, PX, PX);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  const trace = () => {
    ctx.beginPath();
    const path = prep.plan.path;
    for (let t = 0; t <= path.duration; t += 0.5) { const e = path.at(t).eye; const [a, b] = px(e[0], e[2]); t ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }
    ctx.stroke();
  };
  trace();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  trace();
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.textBaseline = 'middle';
  prep.plan.chosen.forEach((ft, n) => {
    const [a, b] = px(ft.x, ft.z);
    ctx.fillStyle = '#ff5a4a'; ctx.fillRect(a - 3, b - 3, 6, 6);
    ctx.fillStyle = '#fff'; ctx.fillText(String(n + 1), a + 6, b);
  });
  const [a, b] = px(f.eye[0], f.eye[2]);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000';
  ctx.beginPath(); ctx.arc(a, b, 4, 0, 7); ctx.fill(); ctx.stroke();
}

// For the console and scripted captures: window.flyover() -> { plan, player, ... } or null.
window.flyover = () => (flying ? prep : null);

let seeking = false;
for (const b of document.querySelectorAll('button[data-view]')) {
  b.addEventListener('click', () => { if (b.dataset.view === 'flyover') startFlyover(); else stopFlyover(); });
}
$('flyplay').addEventListener('click', () => {
  const p = prep?.player;
  if (!flying || !p) return;
  if (p.state === 'playing' || p.state === 'loading') p.pause(); else p.play();
});
$('flyseek').addEventListener('input', () => { seeking = true; const p = prep?.player; if (flying && p) p.seek($('flyseek').value / 1000 * p.duration); });
$('flyseek').addEventListener('change', () => { seeking = false; });
$('flyrec').addEventListener('click', async () => {
  if (!flying || !prep?.player || prep.player.recorder) return;
  $('flydl').textContent = '';
  const f = prep;
  try {
    const { blob, type } = await f.player.record();
    const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `flyover-${$('seed').value.trim().replace(/[^\w-]+/g, '_')}.${ext}`;
    a.textContent = `save (${(blob.size / 1048576).toFixed(1)} MB)`;
    a.title = a.download;
    $('flydl').replaceChildren(a);
  } catch (e) {
    $('flydl').textContent = String(e.message || e);
  }
});

// ---------------------------------------------------------------- start
const qs = new URLSearchParams(location.search);
for (const k of ['seed', 'x0', 'z0']) if (qs.has(k)) $(k).value = qs.get(k);
if (qs.has('sx') && qs.has('sz')) state.sel = { x: +qs.get('sx'), z: +qs.get('sz') };
if (qs.has('dist')) cam.dist = +qs.get('dist');
if (qs.has('yaw')) cam.yaw = +qs.get('yaw');
if (qs.has('pitch')) cam.pitch = +qs.get('pitch');
if (qs.has('debug')) $('dev').open = true; // ?debug=1 opens the stats panel
// Compile the wasm once; the workers get the same module instead of each
// compiling (and warming up) their own.
const wasmModule = await WebAssembly.compileStreaming(fetch(WASM_URL));
await init({ module_or_path: wasmModule });
LEGEND = JSON.parse(legend());
COLORS = []; NAMES = [];
for (const b of LEGEND.blocks) { COLORS[b.id] = b.color; NAMES[b.id] = b.name; }
HABITATS = JSON.parse(habitat_names());
BIOMES = [];
for (const b of LEGEND.biomes) BIOMES[b.id] = b;
CTX = legendContext(legend(), faceLayers(tileFor));
pool = new WorkerPool({ faceLayer: CTX.faceLayer, module: wasmModule });
setMode(['terrain', 'biome', 'temperature', 'humidity', 'habitat'].includes(qs.get('mode')) ? qs.get('mode') : 'terrain');
initGL();
state.textured = await loadTextures();
if (!state.textured) {
  $('warn').hidden = false;
  $('warn').textContent = '⚠ flat colours';
  $('warn').title = 'textures.json not found (run ./build.sh); using flat colours';
}
dev('wasm', await wasmSize());
regenerate();
markStarted();
if (qs.has('fly')) startFlyover(); // ?fly=1 opens the flyover straight away
</script>
</body>
</html>
